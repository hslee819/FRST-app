<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDIJ TA (현황)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--fg:#111;--sub:#8a8a8a;--faint:#c4c4c4;--line:#e3e3e3;--line2:#d2d2d2;--bg2:#f5f5f6;--purple:#5b2be0;--red:#e2363c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#d9dbe0;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;color:var(--fg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#ipad{width:1180px;height:820px;background:#fff;position:relative;overflow:hidden;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);flex:none}
.status{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;font-weight:700;position:relative;z-index:80}
.status .r{display:flex;gap:6px;align-items:center}
.batt{width:24px;height:11px;border:1.5px solid currentColor;border-radius:3px;padding:1px}.batt i{display:block;height:100%;width:88%;background:currentColor}
#app{position:absolute;inset:0}
.top{position:absolute;top:30px;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.top .bk{position:absolute;left:24px}
.top .bell{position:absolute;right:28px}
.edge{position:absolute;left:0;top:350px;width:14px;height:60px;border-radius:0 8px 8px 0;background:#eee;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:10px;z-index:5}
.pg{position:absolute;top:76px;left:30px;right:30px;bottom:20px}
.sec-h{display:flex;align-items:baseline;gap:10px;font-size:15px;font-weight:700}
.sec-h small{font-size:9.5px;font-weight:400;color:var(--sub)}
.crumb{display:flex;align-items:center;gap:12px;font-size:12.5px;margin-top:20px}
.crumb .g{color:var(--faint)}
.crumb .ar{font-size:8px;color:#555}
.pop{position:absolute;right:0;top:0;width:330px;border:1px solid var(--line);border-radius:4px;background:#fff;z-index:10;font-size:11px}
.pop .hd{height:34px;display:flex;align-items:center;gap:6px;padding:0 10px;cursor:pointer}
.pop .hd .tk{flex:1;overflow:hidden;height:16px;position:relative}
.pop .hd .tk span{display:block;transition:transform .4s}
.pop li{list-style:none;display:flex;gap:10px;height:32px;align-items:center;padding:0 16px;cursor:pointer}
.pop li:hover{background:var(--bg2)}
.pop li b{width:14px;font-weight:500}
.pop li i{margin-left:auto;font-style:normal;font-size:9px}
.cols{position:absolute;top:110px;left:0;right:0;bottom:56px;border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;gap:10px;background:#fafafa}
.col{border:1px solid var(--line);background:#fff;overflow-y:auto;flex:1}
.col button{display:flex;align-items:center;gap:6px;width:100%;height:46px;padding:0 18px;border-bottom:1px solid var(--line);font-size:14px;text-align:left}
.col button.on{background:#111;color:#fff;font-weight:700}
.col .cam{font-weight:800;letter-spacing:.3px}
.nextb{position:absolute;right:16px;bottom:6px;height:38px;padding:0 30px;border-radius:19px;background:#ececec;color:#aaa;font-size:12px}
.nextb.en{background:#111;color:#fff}
.qbtn{height:32px;padding:0 22px;border-radius:16px;background:#111;color:#fff;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.tabs2{display:flex;gap:22px;font-size:16px;font-weight:700}
.tabs2 button{color:var(--faint)}.tabs2 button.on{color:var(--fg)}
.tog{width:34px;height:20px;border-radius:10px;background:#ddd;position:relative;transition:.2s;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--purple)}.tog.on::after{left:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;overflow-y:auto;position:absolute;top:118px;left:0;right:0;bottom:0;padding-bottom:20px}
.card{border:1px solid var(--line);border-radius:4px;padding:12px;cursor:pointer;background:#fff;height:270px;display:flex;flex-direction:column}
.card:hover{border-color:#999}
.card .ch{display:flex;align-items:center;font-size:11.5px;gap:8px;margin-bottom:10px}
.card .ch small{color:var(--sub);font-size:10px}
.card .ch .bm{margin-left:auto;font-size:10px;display:flex;align-items:center;gap:2px}
.qbox{border:1px solid var(--line);padding:8px;flex:1;overflow:hidden;font-size:9.5px;line-height:1.45;white-space:pre-line}
.tag{display:inline-block;font-size:9px;padding:1px 5px;border:1px solid var(--line2);color:#666;margin-bottom:6px;background:#fafafa}
.abox{margin-top:8px;border:1px solid var(--line);height:28px;display:flex;align-items:center;gap:8px;padding:0 6px;font-size:9.5px;color:#555;overflow:hidden;white-space:nowrap}
.abox .tag{margin:0;background:#555;color:#fff;border:0}
.aibtn{margin-top:8px;height:22px;background:#3a2bb8;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dimimg{background:#555;color:#fff;padding:6px;font-size:9px;line-height:1.5;margin-bottom:6px}
.det{position:absolute;top:120px;bottom:0;left:0;right:0;display:flex;gap:16px}
.det .pane{flex:1;border:1px solid var(--line);border-radius:4px;padding:14px;position:relative;font-size:12.5px;line-height:1.6;display:flex;flex-direction:column}
.pane .ph{display:flex;justify-content:space-between;font-size:10.5px;color:#555;margin-bottom:22px}
.pane .body{flex:1;overflow-y:auto;white-space:pre-line;padding:0 10px}
.sm{height:26px;padding:0 12px;border:1px solid var(--line2);border-radius:13px;font-size:10.5px;background:var(--bg2);display:inline-flex;align-items:center;gap:4px;color:#555}
.badge{display:inline-block;font-size:9px;padding:2px 6px;background:#4a6bd8;color:#fff;border-radius:2px;margin-left:8px;vertical-align:middle;font-weight:500}
.redbtn{height:32px;padding:0 20px;background:var(--red);color:#fff;font-size:11.5px;border-radius:3px}
.form{position:absolute;top:150px;left:0;right:0;bottom:0;display:flex;gap:20px}
.upl{border:1px solid var(--line);height:330px;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#555;gap:6px;cursor:pointer;flex:1}
.camsq{width:48px;height:48px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#aaa;flex:none;cursor:pointer}
textarea.qt{width:100%;height:105px;border:1px solid var(--line);padding:10px;font-size:10.5px;resize:none;outline:0;line-height:1.6}
.tabtn{flex:1;height:42px;border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:11.5px}
.tabtn.on{border-color:#111;border-width:1.5px}
.rchip{height:24px;padding:0 9px;font-size:10px;border-radius:3px}
.rchip.on{background:#111;color:#fff}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:center;justify-content:center}
.sheet{position:absolute;left:40px;right:40px;top:50px;bottom:24px;background:#fff;border-radius:6px;padding:20px 26px;overflow:hidden}
.banner{border-radius:8px;background:linear-gradient(90deg,#3a1fc7,#7a28e8);color:#fff;padding:12px 16px;position:relative;margin-top:10px}
.banner .lab{display:inline-block;font-size:8.5px;background:rgba(255,255,255,.2);border-radius:8px;padding:2px 8px;margin-right:8px}
.banner .sel{position:absolute;right:14px;top:16px;background:#fff;color:#333;border-radius:4px;padding:6px 10px;font-size:9.5px;line-height:1.7;font-family:monospace;min-width:120px}
.strip{background:#3a1fc7;color:#fff;font-size:9.5px;font-weight:700;text-align:center;padding:4px;margin-top:10px}
.ta{border:1px solid var(--line);display:flex;gap:14px;padding:14px 16px;margin-top:8px;cursor:pointer;position:relative}
.ta.sel{border:2px solid #3a1fc7}
.ta .av{width:40px;height:40px;border-radius:50%;flex:none;margin-top:10px}
.ta .nm{font-size:12.5px;font-weight:700}
.ta .nm small{font-weight:400;color:#555;margin-left:8px;font-size:10.5px}
.ta .q{font-size:11.5px;margin:6px 0;color:#333}
.ta .tg{font-size:10px;color:#555}
.ta .st{position:absolute;right:16px;top:12px;text-align:right;font-size:9.5px;color:#555;line-height:2.3}
.aib{display:inline-block;background:#3a1fc7;color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:2px;margin-left:6px}
.box{background:#fff;border-radius:3px;overflow:hidden;text-align:center}
.box p{padding:30px 20px;font-size:13px}
.box .mf{display:flex;height:52px}.box .mf button{flex:1;font-size:13px}
.mtabs{display:flex;gap:22px;font-size:16px;font-weight:700;margin-top:28px}
.mtabs button{color:var(--faint)}.mtabs button.on{color:var(--fg)}
.mbox{position:absolute;top:62px;left:0;right:0;bottom:0;border:1px solid var(--line);border-radius:4px;padding:20px}
.mnav{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700}
.arr{width:20px;height:20px;border-radius:50%;background:#333;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.arr.dis{background:#bbb}
.empty{text-align:center;margin-top:120px}
.empty b{display:block;font-size:14px;margin-top:16px}
.empty small{font-size:10.5px;color:#555}
.qc{width:280px;border:1px solid var(--line);padding:12px;margin-top:20px;cursor:pointer;font-size:11px}
.sbar{position:absolute;top:0;left:0;bottom:0;width:180px;background:#fff;z-index:50;padding:44px 16px;transform:translateX(-100%);transition:.25s;box-shadow:4px 0 20px rgba(0,0,0,.1)}
.sbar.open{transform:none}
.sbar .logo{font-size:20px;font-weight:300;letter-spacing:-.5px;margin-bottom:34px}
.sbar .logo b{font-weight:900;font-size:16px;letter-spacing:-1px}
.sbar nav button{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:18px;font-size:11.5px;color:#555;margin-bottom:4px}
.sbar nav button.on{background:#111;color:#fff;font-weight:700}
.sbar .me{position:absolute;bottom:18px;left:16px;right:16px;border-top:1px solid var(--line);padding-top:14px;display:flex;gap:8px;align-items:center;font-size:10px;cursor:pointer}
.sbar .me i{width:24px;height:24px;border-radius:50%;background:#8bd18f;color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:10px}
.ddl{position:relative;height:24px;border:1px solid var(--line2);border-radius:12px;padding:0 10px;font-size:10px;display:inline-flex;align-items:center;gap:20px;color:#555}
.ddl select{position:absolute;inset:0;opacity:0;cursor:pointer}
#toast{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);background:#111;color:#fff;font-size:12px;font-weight:700;padding:10px 18px;border-radius:3px;z-index:90;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#jump{position:fixed;right:14px;bottom:14px;z-index:100;font-size:12px}
#jump>button{background:#111;color:#fff;border-radius:18px;padding:8px 14px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#jump ul{list-style:none;position:absolute;bottom:42px;right:0;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:6px;display:none;width:220px;max-height:80vh;overflow:auto}
#jump.open ul{display:block}
#jump li button{width:100%;text-align:left;padding:7px 10px;border-radius:6px;color:#111}
#jump li button:hover{background:#f1f1f1}
.mini{border:1px solid var(--line);padding:8px;margin:10px 0;font-size:9px}
.mini .s{display:flex;justify-content:space-around;text-align:center;margin-top:8px}
.mini .s b{display:block;font-size:15px}

/* 촬영 사진 톤: 연회색 바탕, 저대비 회색 테두리, 검정 선택/필 버튼 */
:root{--line:#d9d9db;--line2:#cfcfd2;--bg2:#f5f5f6;--sub:#8d8d92;--faint:#b9b9bd;--paper:#fff;--panel:#fff}
#ipad{background:var(--paper)}
.top{font-weight:600;font-size:19px}
.sec-h{font-weight:600}
.crumb{font-size:13.5px;margin-top:22px}
.pop,.card,.det .pane,.upl,.camsq,textarea.qt,.tabtn,.col,.ta{background:var(--panel)}
.cols{top:92px;background:#fff;border-color:#e3e3e3}
.col button{border-bottom-color:#dcdcdf;font-weight:500;height:47px}
.col button.on{background:#141414}
.nextb{background:#e3e3e6;color:#a4a4a8}
.qbox,.abox{background:#f8f8f9}
.sheet{background:#f1f1f3}
.banner{background:linear-gradient(90deg,#4b17e6,#7a1ff0)}
.strip{background:#4b17e6}
.sm{background:#ebebed}
</style>
</head>

const POPULAR=['국어 서바이벌프로 8회 2번','수학 월례고사 3회 4번','수학 서바이벌 24회 30번','수학 월례고사 10회 29번','수학 월례고사 10회 15번','국어 월례고사 10회 34번','수학 서바이벌 24회 21번','국어 월례고사 10회 2번','수학 서바이벌 22회 22번','국어 월례고사 10회 16번','수학 서바이벌전국 10회 30번','국어 상상(FINAL) 8회 24번','생윤 월례고사 10회 3번','수학 서바이벌 24회 20번'];

 else if(S.camera)h=`<div class="dim" style="background:#000"><div style="color:#fff;text-align:center"><div style="width:520px;height:360px;border:2px dashed #666;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px">카메라 화면 (문제를 화면에 맞춰 촬영)</div><div style="margin-top:20px;display:flex;gap:30px;justify-content:center;align-items:center"><button style="color:#fff" data-a="camx">취소</button><button style="width:56px;height:56px;border-radius:50%;background:#fff;border:4px solid #888" data-a="shot"></button><span style="width:30px"></span></div></div></div>`;
 o.innerHTML=h;
}
function sidebar(){const items=[['search','문항 검색',I.search],['ask','문항 질문',I.q],['tameet','TA Meet',I.ppl],['sameet','SA Meet',I.ppl],['mine','나의 질문들',I.chat]];
 document.getElementById('side').innerHTML=`${S.side?'<div class="dim" style="background:rgba(0,0,0,.35);z-index:49" data-a="sidex"></div>':''}<div class="sbar ${S.side?'open':''}"><div class="logo">sdij <b>TA</b></div><nav>${items.map(([k,t,ic])=>`<button class="${S.page===k||(k==='search'&&['result','detail'].includes(S.page))?'on':''}" data-a="nav" data-v="${k}">${ic} ${t}</button>`).join('')}</nav>
 <div class="me" data-a="na"><i>이</i><div>이현서t<br><small style="color:#888">정보 및 설정</small></div></div></div>`}
function render(){
 const p=S.page;document.getElementById('app').innerHTML=p==='search'?search():p==='result'?result():p==='detail'?detail():p==='ask'?ask():p==='mine'?mine():meet(p==='tameet'?'TA Meet':'SA Meet');
 overlay();sidebar();
}
const HIST=[];const go=p=>{HIST.push(S.page);S.page=p};

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
 if(t.tagName==='SELECT')return;
 switch(a){
  case 'side':S.side=true;break;case 'sidex':S.side=false;break;
  case 'nav':S.side=false;HIST.length=0;S.page=v;if(v==='ask'){S.form={txt:'',req:'없습니다',taMode:null,imgs:0}}break;
  case 'bell':toast('새 알림이 없어요');return;
  case 'back':S.page=HIST.pop()||'search';break;
  case 'pop':S.popOpen=!S.popOpen;break;
  case 'popgo':{const m=v.match(/^(\S+) (.+) (\d+회) (\d+)번$/);if(!m)return;const subj=m[1]==='생윤'?'생활과윤리':m[1];S.subj=subj;S.content=m[2];S.round=m[3];S.num=+m[4];S.popOpen=false;break}
  case 'camera':S.camera=true;overlay();return;
  case 'camx':S.camera=false;overlay();return;
  case 'shot':S.camera=false;S.subj='국어';S.content='월례고사';S.round='10회';S.num=1;toast('촬영한 문제로 국어 월례고사 10회 1번을 찾았어요 (예시)');break;
  case 'subj':S.subj=v;S.content=S.round=S.num=null;break;
  case 'content':S.content=v;S.round=S.num=null;break;
  case 'round':S.round=v;S.num=null;break;
  case 'num':S.num=+v;break;
  case 'go':if(!S.num)return;S.rTab='ans';S.aiOn=false;go('result');break;
  case 'rtab':S.rTab=v;break;
  case 'aion':S.aiOn=!S.aiOn;break;
  case 'open':S.sel={i:+v,ai:S.aiOn};S.detTab=0;S.aiOk=false;go('detail');break;
  case 'dettab':S.detTab=+v;break;
  case 'aiok':S.aiOk=true;break;
  case 'report':toast('질문 신고 (프로토타입에서는 동작하지 않아요)');return;
  case 'bookmark':toast('북마크에 추가했어요');return;
  case 'stars':toast('답변 리뷰는 내 질문에만 남길 수 있어요');return;
  case 'ask':S.form={txt:'',req:'없습니다',taMode:null,imgs:0};S.pickAI=false;S.pickTA=null;go('ask');break;
  case 'tosearch':S.page='search';break;
  case 'resetq':S.content=S.round=S.num=null;toast('문항을 초기화했어요');break;
  case 'img':if(S.form.imgs<5)S.form.imgs++;else toast('이미지는 5장까지 올릴 수 있어요');break;
  case 'tamode':S.form.taMode=v;if(v==='pick'){S.taModal=true;S.tmp={ai:S.pickAI,ta:S.pickTA}}else{S.pickAI=false;S.pickTA=null}break;
  case 'req':S.form.req=v;if(v==='직접입력')toast('요청 사항을 직접 입력할 수 있어요');break;
  case 'taf':S.taFilter=v;overlay();return;
  case 'fav':e.stopPropagation();if(S.favs.has(v)){S.favs.delete(v);toast('관심 TA에서 해제되었습니다.')}else{S.favs.add(v);toast('관심 TA로 등록되었습니다.')}overlay();return;
  case 'pickta':if(v==='ai')S.tmp.ai=!S.tmp.ai;else S.tmp.ta=S.tmp.ta===v?null:v;overlay();return;
  case 'convert':toast('문항 질문권 1회를 AI 질문권으로 전환해요 (예시)');return;
  case 'tacancel':S.taModal=false;if(!S.pickAI&&!S.pickTA)S.form.taMode=null;break;
  case 'tadone':S.pickAI=S.tmp.ai;S.pickTA=S.tmp.ta;S.taModal=false;if(!S.pickAI&&!S.pickTA)S.form.taMode=null;break;
  case 'submit':if(!S.num){toast('문항 정보를 먼저 골라 주세요');return}if(!S.form.taMode){toast('답변 요청 TA를 선택해 주세요');return}S.confirm='ask';overlay();return;
  case 'cfno':S.confirm=null;overlay();return;
  case 'cfyes':S.confirm='loading';overlay();setTimeout(()=>{S.confirm='done';overlay()},900);return;
  case 'donego':S.confirm=null;if(S.pickAI)S.aiUsed=(S.aiUsed||0)+1;S.mine.unshift({subj:S.subj,rest:`${S.content} ${S.round} ${S.num}번`,txt:S.form.txt,ta:S.pickTA?TAS.find(x=>x.id===S.pickTA).name+' 검토 중':S.pickAI?'AI 답변 생성 중':'TA가 검토 중'});HIST.length=0;S.page='mine';S.myTab='문항 질문';break;
  case 'mytab':S.myTab=v;break;
  case 'ticket':S.ticket=true;overlay();return;
  case 'ticketx':if(e.target===t){S.ticket=false;overlay()}return;
  case 'na':toast('스크린샷이 없어 동작은 비워 두었어요');return;
  default:return;
 }
 render();
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.a==='dd'){S[t.dataset.k]=t.value;render()}if(t.dataset.a==='tasort'){S.taSort=t.value;overlay()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.a==='qtxt'){S.form.txt=t.value;document.getElementById('qcnt').textContent=t.value.length+'/1000'}});
setInterval(()=>{if(S.page==='search'&&!S.popOpen&&!S.side){S.tick=(S.tick+1)%10;const el=document.querySelector('.pop .tk span');if(el)el.textContent=`${(S.tick+4)%10+1}. ${POPULAR[(S.tick+4)%POPULAR.length]}`}},2500);

const JUMPS=[
 ['① 문항 검색 (처음)',{page:'search',subj:'국어',content:null,round:null,num:null}],
 ['② 콘텐츠 선택',{page:'search',subj:'국어',content:'월례고사',round:null,num:null}],
 ['③ 회차 선택',{page:'search',subj:'국어',content:'월례고사',round:'10회',num:null}],
 ['④ 번호 선택 → 확인',{page:'search',subj:'국어',content:'월례고사',round:'10회',num:1}],
 ['⑤ 이번 주 인기 문항 펼침',{page:'search',subj:'국어',content:'월례고사',round:'10회',num:1,popOpen:true}],
 ['⑥ 검색결과 (TA 답변)',{page:'result',subj:'국어',content:'월례고사',round:'10회',num:1,aiOn:false,rTab:'ans'}],
 ['⑦ 검색결과 (AI 답변 함께 보기)',{page:'result',subj:'국어',content:'월례고사',round:'10회',num:1,aiOn:true,rTab:'ans'}],
 ['⑧ 상세보기 (TA 답변)',{page:'detail',subj:'국어',content:'월례고사',round:'10회',num:1,sel:{i:0,ai:false},detTab:0}],
 ['⑨ 상세보기 (AI 답변 안내)',{page:'detail',subj:'국어',content:'월례고사',round:'10회',num:1,sel:{i:0,ai:true},detTab:0,aiOk:false}],
 ['⑩ 문항 질문 작성',{page:'ask',subj:'국어',content:'월례고사',round:'10회',num:1}],
 ['⑪ TA 선택 (전체)',{page:'ask',subj:'국어',content:'월례고사',round:'10회',num:1,taModal:true,taFilter:'all',tmp:{ai:false,ta:null}}],
 ['⑫ TA 선택 (관심 TA 없음)',{page:'ask',subj:'국어',content:'월례고사',round:'10회',num:1,taModal:true,taFilter:'fav',tmp:{ai:false,ta:null}}],
 ['⑬ TA 선택 (AI 선택됨)',{page:'ask',subj:'국어',content:'월례고사',round:'10회',num:1,taModal:true,taFilter:'all',tmp:{ai:true,ta:null}}],
 ['⑭ 질문 등록 확인',{page:'ask',subj:'국어',content:'월례고사',round:'10회',num:1,confirm:'ask'}],
 ['⑮ 나의 질문들 (문항 질문)',{page:'mine',myTab:'문항 질문'}],
 ['⑯ 내 이용권 확인',{page:'mine',myTab:'문항 질문',ticket:true}],
 ['⑰ 나의 질문들 (북마크)',{page:'mine',myTab:'북마크'}],
 ['⑱ TA Meet / SA Meet 탭',{page:'mine',myTab:'TA Meet'}],
 ['⑲ 사이드 메뉴',{page:'mine',myTab:'북마크',side:true}]];
document.getElementById('jumplist').innerHTML=JUMPS.map((j,i)=>`<li><button data-j="${i}">${j[0]}</button></li>`).join('');
document.getElementById('jumplist').addEventListener('click',e=>{const b=e.target.closest('[data-j]');if(!b)return;e.stopPropagation();
 Object.assign(S,{popOpen:false,taModal:false,confirm:null,ticket:false,side:false,camera:false,form:{txt:'',req:'없습니다',taMode:null,imgs:0}},JUMPS[+b.dataset.j][1]);
 if(S.page==='mine'&&S.myTab==='문항 질문'&&!S.mine.length&&b.dataset.j!=='17')S.mine=[{subj:'국어',rest:'월례고사 10회 1번',txt:'ㅠㅠ',ta:'TA가 검토 중'}];
 HIST.length=0;if(['result','detail','ask'].includes(S.page))HIST.push('search');if(S.page==='detail')HIST.push('result');
 render();document.getElementById('jump').classList.remove('open')});
function fit(){const s=Math.min((innerWidth-24)/1180,(innerHeight-24)/820);document.getElementById('ipad').style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();render();
