<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시대인재N 재종 행정 (현황)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--fg:#111;--sub:#8b8b90;--faint:#c3c3c8;--line:#e6e6ea;--soft:#f5f5f8;--blue:#2b6cf0;--red:#e5383b;--dark:#1d1d1f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#d9dbe0;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;color:var(--fg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#ipad{width:1180px;height:820px;background:#fff;position:relative;overflow:hidden;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);flex:none}
.status{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;font-weight:700;position:absolute;top:0;left:0;right:0;z-index:90}
.status .r{display:flex;gap:6px;align-items:center}
.batt{width:24px;height:11px;border:1.5px solid currentColor;border-radius:3px;padding:1px}.batt i{display:block;height:100%;width:86%;background:currentColor}
.hd{position:absolute;top:30px;left:0;right:0;height:72px;display:flex;align-items:center;padding:0 40px;gap:20px;background:#fff;z-index:20}
.hd .hb{width:30px;height:24px;display:flex;flex-direction:column;justify-content:space-between;padding:3px 0}
.hd .hb i{display:block;height:2.5px;background:#111;border-radius:2px}
.hd .hb i:nth-child(2){width:70%}.hd .hb i:nth-child(3){width:85%;background:#ccc}
.hd h1{font-size:25px;font-weight:700;letter-spacing:-.3px}
.hd h1.logo{font-weight:400;font-size:27px}.hd h1.logo b{font-weight:900;font-size:24px;margin-left:4px}
.hd .rt{margin-left:auto;display:flex;align-items:center;gap:12px}
.pg{position:absolute;top:102px;left:0;right:0;bottom:0;overflow-y:auto;padding:0 40px 40px}
.pg::-webkit-scrollbar{display:none}
/* home */
.who{text-align:right;margin-top:14px}.who b{font-size:25px;font-weight:800}.who p{font-size:18px;margin-top:4px}
.dday{display:flex;align-items:center;gap:14px;margin-top:-8px}
.dday span{border:2px solid #111;border-radius:16px;padding:3px 14px;font-weight:700;font-size:14px}
.dday b{font-size:40px;font-weight:800;letter-spacing:-.5px}
.hrow{display:flex;gap:14px;margin-top:20px;height:470px}
.must{width:300px;background:#2c2c2e;color:#fff;flex:none}
.must h3{font-size:20px;font-weight:700;padding:22px 22px 16px;border-bottom:1px solid #555}
.must li{list-style:none;padding:14px 22px 0 34px;position:relative;cursor:pointer}
.must li::before{content:"•";position:absolute;left:22px;top:14px;color:#888}
.must li b{display:block;font-size:14px;font-weight:600;color:#9a9a9e;line-height:1.35}
.must li small{display:block;font-size:12.5px;color:#6d6d70;margin-top:6px}
.dcol{flex:1;display:flex;flex-direction:column}
.days{display:flex;gap:14px;flex:1}
.day{position:relative;flex:1;border-top:5px solid var(--blue);background:#f7f7fa;padding:18px 24px}
.day.nx{border-top-color:#d5d5da;background:#fff;flex:.55}
.day .n{font-size:30px;font-weight:800}.day .w{font-size:16px;color:#aaa;margin-top:2px}
.day .t{position:absolute;right:0;top:0;background:var(--blue);color:#fff;font-weight:700;font-size:15px;padding:14px 12px}
.day p{font-size:16px;font-weight:700;margin-top:30px;line-height:1.4}
.day img{position:absolute;right:20px;bottom:0;width:142px}
.arr{position:absolute;right:0;top:170px;width:46px;height:46px;border-radius:50%;background:#f3f3f6;display:flex;align-items:center;justify-content:center}
.tick{display:flex;align-items:center;gap:12px;height:44px;font-size:15px;cursor:pointer}
.tick .lb{background:var(--blue);color:#fff;font-size:13px;font-weight:700;padding:3px 13px}
.tick .ch{margin-left:auto;color:#bbb}
.tiles{display:flex;gap:14px;margin-top:70px}
.tiles button{flex:1;height:124px;background:#f6f6f9;font-weight:700;font-size:15.5px;line-height:1.3}
.tiles button:active{background:#ececf1}
.callbtn{position:absolute;right:40px;bottom:40px;background:#000;color:#fff;font-weight:700;font-size:16px;height:40px;padding:0 20px;z-index:30}
.callmenu{position:absolute;right:40px;bottom:80px;width:172px;z-index:30;display:flex;flex-direction:column;gap:2px}
.callmenu button{height:60px;background:#a3a3a7;color:#eee;font-size:15px;text-align:center}
.callmenu button:hover{background:#8f8f93;color:#fff}
.shade{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:25}
/* drawer */
.drawer{position:absolute;left:0;top:0;bottom:0;width:495px;background:var(--dark);color:#fff;z-index:60;padding:80px 40px 40px;overflow-y:auto;transform:translateX(-100%);transition:transform .25s}
.drawer.open{transform:none}
.drawer::-webkit-scrollbar{display:none}
.drawer .x{position:absolute;left:36px;top:52px;font-size:34px;font-weight:200;line-height:1}
.drawer .pf{display:flex;align-items:flex-start;margin-top:40px}
.drawer .pf b{font-size:22px;font-weight:600;display:flex;align-items:center;gap:8px}
.drawer .pf p{font-size:17px;margin-top:8px}
.drawer .av{margin-left:auto;width:96px;height:96px;border-radius:50%;background:#c9c9d4;position:relative;display:flex;align-items:center;justify-content:center;margin-top:-30px}
.drawer .av i{position:absolute;right:-4px;bottom:6px;width:26px;height:26px;border-radius:50%;background:#fff;color:#333;font-size:15px;display:flex;align-items:center;justify-content:center;font-style:normal}
.drawer h5{font-size:16px;color:#77777b;font-weight:600;margin-top:56px}
.drawer .gr{display:grid;grid-template-columns:repeat(3,140px);row-gap:20px;margin-top:20px}
.drawer .gr button{text-align:left;font-size:19.5px;color:#fff}
.drawer .gr button.on{color:#7fa6ff}
/* common */
.ttl{text-align:center}
.monthnav{display:flex;align-items:center;justify-content:center;gap:90px;margin-top:20px}
.monthnav b{font-size:46px;font-weight:800;min-width:80px;text-align:center}
.monthnav button{font-size:30px;font-weight:300;padding:0 10px}
.monthnav button.off{color:#ccc}
.linkr{display:flex;justify-content:flex-end;font-size:14.5px;color:#555;gap:4px;cursor:pointer}
.empty{text-align:center;color:#555;font-size:15.5px;line-height:1.6}
.empty img{display:block;margin:0 auto 18px}
table{border-collapse:collapse;width:100%}
.cal{border-top:2px solid #111;margin-top:14px}
.cal th{background:var(--soft);height:52px;font-size:15px;font-weight:700;border:1px solid var(--line);border-top:0}
.cal td{border:1px solid var(--line);height:84px;vertical-align:top;padding:12px 16px;font-size:16px;width:14.28%;cursor:pointer}
.cal td:hover{background:#fafafc}
.cal .we{color:var(--red)}
.cal td small{font-size:11px;margin-left:4px}
.cal .ev{display:block;border-left:3px solid #111;padding-left:6px;font-size:11.5px;margin-top:8px;line-height:1.4}
.cal .wk{display:block;border-left:3px solid var(--red);padding-left:6px;font-size:11.5px;margin-top:8px;color:var(--red)}
.cal td.sel{outline:2px solid #111;outline-offset:-2px}
.leg{display:flex;gap:26px;font-size:15px;align-items:center}
.leg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.tt{table-layout:fixed}.tt th{background:var(--soft);height:44px;font-size:15px;border:1px solid var(--line)}
.tt td{border:1px solid var(--line);height:80px;text-align:center;font-size:14px;line-height:1.45}
.tt td:first-child{font-weight:700;font-size:15px}
.tt tr.br td{height:36px;background:var(--soft);font-weight:700;font-size:14.5px}
.tt td.has{cursor:pointer}.tt td.has:hover{background:#f3f6ff}
.pill{height:30px;padding:0 16px;border-radius:15px;background:#e6e6ea;font-size:13px;font-weight:600}
.tabs{display:flex;gap:48px;font-size:18px;margin-top:26px;padding:0 18px}
.tabs button{color:#aaa}.tabs button.on{color:#111;font-weight:700}
.nl{border-top:2px solid #111;margin-top:14px}
.nl li{list-style:none;padding:20px 40px 20px 34px;border-bottom:1px solid var(--line);position:relative;cursor:pointer}
.nl li.pin{background:var(--soft)}
.nl li small{font-size:13px;color:#777}
.nl li p{font-size:17px;margin-top:8px;display:flex;align-items:center;gap:6px}
.nl li .dt{position:absolute;right:40px;top:22px;color:#aaa;font-size:15px}
.nb{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center}
.seg{display:flex;gap:14px;margin-top:44px}
.seg button{height:50px;padding:0 32px;border-radius:25px;background:#ececf1;font-size:16.5px}
.seg button.on{background:#111;color:#fff}
.meals{display:flex;gap:18px;margin-top:22px}
.meal{flex:1;position:relative;padding-top:40px}
.meal .lb{position:absolute;top:0;left:0;background:var(--blue);color:#fff;font-size:17px;font-weight:700;width:120px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:4px 4px 0 0}
.meal .bd{background:#f4f4f7;border-radius:0 18px 18px 18px;height:425px;position:relative}
.meal img{position:absolute;left:40px;top:80px;width:225px;height:225px;border-radius:50%;object-fit:cover}
.meal .mn{position:absolute;left:290px;right:20px;top:150px;text-align:center;font-size:15px;line-height:1.7}
.meal .ask{position:absolute;left:165px;top:315px;width:210px;height:50px;border-radius:25px;background:var(--blue);color:#fff;font-size:16.5px;font-weight:600}
.fab{position:absolute;right:40px;bottom:150px;width:86px;height:86px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;z-index:5}
.dstrip{display:flex;align-items:center;margin-top:16px}
.dstrip .d{flex:1;text-align:center;cursor:pointer;color:#d0d0d4}
.dstrip .d b{display:block;font-size:26px;font-weight:700}.dstrip .d small{font-size:16px;font-weight:600}
.dstrip .d.on{color:#111}
.dstrip>button{font-size:26px;width:40px}
.cons{display:flex;justify-content:space-around;margin-top:56px}
.cons .c{width:300px;text-align:center}
.bub{border:2px solid #111;border-radius:28px;padding:22px 10px;font-size:16.5px;font-weight:500;line-height:1.4;position:relative;margin:0 14px}
.bub::after{content:"";position:absolute;left:50%;bottom:-13px;width:20px;height:20px;background:#fff;border-right:2px solid #111;border-bottom:2px solid #111;transform:translateX(-50%) rotate(45deg)}
.cons img{height:212px;display:block;margin:22px auto -60px;position:relative;z-index:0}
.cons .nm{position:relative;z-index:1;width:210px;height:60px;margin:0 auto;border-radius:30px;background:#111;color:#fff;font-size:16.5px;font-weight:600;line-height:1.3}
.cons .nm.g{background:#dcdce2;color:#111}
.dots{display:flex;gap:8px;justify-content:center;margin-top:30px}.dots i{width:12px;height:12px;border-radius:50%;background:#e6e6ea}.dots i.on{background:#6dbb47}
.info th{background:var(--soft);width:225px;font-size:14.5px;border:1px solid var(--line);padding:12px}
.info td{border:1px solid var(--line);padding:10px 26px;font-size:14px;line-height:1.75}
.info .bl{color:var(--blue)}
.h4{font-size:17px;font-weight:700;margin:30px 0 12px}
.box{border-top:2px solid #111;background:var(--soft);padding:16px 22px 20px}
.box li{font-size:14.5px;line-height:2.1;list-style:none;padding-left:16px;position:relative}
.box li::before{content:"•";position:absolute;left:0}
.bluebtn{height:44px;padding:0 26px;border-radius:22px;background:var(--blue);color:#fff;font-weight:600;font-size:17px}
.note{color:#999;font-size:14px;line-height:1.5;margin:22px 0 0 16px}
.subj{display:flex;gap:14px;margin:24px 0 0 32px}
.subj button{width:118px;height:44px;border-radius:22px;background:#ececf1;font-size:15.5px;font-weight:600}
.subj button.on{background:#000;color:#fff}
.ltabs{display:flex;gap:26px;margin:36px 0 0 46px;font-size:18px;font-weight:700}
.ltabs button{color:#aaa}.ltabs button.on{color:#111}
.lect{margin:16px 32px 0;border-top:1px solid var(--line)}
.lect li{list-style:none;display:flex;align-items:center;padding:24px 40px;border-bottom:1px solid var(--line)}
.lect h6{font-size:22px;font-weight:700}
.lect .who2{font-size:15.5px;margin-top:6px}
.lect .meta{display:flex;gap:22px;font-size:16px;margin-left:30px;color:#222}
.lect .meta span:last-child{color:#999}
.lect .ap{margin-left:auto;height:40px;padding:0 20px;background:#000;color:#fff;font-size:15px}
.lect .ap.done{background:#ddd;color:#777}
.guide{display:flex;gap:14px;margin:56px -40px 0 -10px;overflow-x:auto;padding-right:40px}
.guide::-webkit-scrollbar{display:none}
.guide button{flex:none;width:300px;height:420px;background-size:cover;background-position:center;position:relative}
.guide button.part{width:240px}
.search{width:400px;height:50px;border:1px solid var(--line);border-radius:25px;display:flex;align-items:center;padding:0 24px;font-size:15px}
.search input{flex:1;border:0;outline:0;background:none}
.callc{display:flex;justify-content:center;gap:70px;margin-top:150px}
.callc button{text-align:center;font-size:16.5px;font-weight:700}
.callc img{width:182px;height:182px;border-radius:50%;display:block;margin-bottom:12px}
.callc button:hover img{outline:3px solid var(--blue)}
/* modal */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:70;display:flex;align-items:center;justify-content:center}
.mod{background:#fff;width:560px;max-height:680px;overflow:auto;border-radius:6px}
.mod .mh{display:flex;align-items:center;padding:22px 26px;font-size:19px;font-weight:700;border-bottom:1px solid var(--line)}
.mod .mh button{margin-left:auto;font-size:26px;font-weight:200}
.mod .mb{padding:22px 26px;font-size:15px;line-height:1.7}
.mod .mf{display:flex}.mod .mf button{flex:1;height:58px;font-size:16.5px;background:#f3f3f5}.mod .mf button.k{background:#111;color:#fff}
.fld{display:flex;align-items:center;gap:14px;margin-top:12px}
.fld label{width:80px;color:#666;font-size:14.5px}
.fld input,.fld select{flex:1;height:42px;border:1px solid #ddd;border-radius:4px;padding:0 12px;font:inherit;font-size:14.5px}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:rgba(40,40,40,.92);color:#fff;padding:14px 28px;border-radius:26px;font-size:15.5px;z-index:95;white-space:nowrap}
.guess{display:inline-block;font-size:11px;color:#b06b00;background:#fff4dc;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;font-weight:600}
.rate{display:flex;gap:12px;justify-content:center;margin:10px 0 4px}
.rate button{width:84px;height:84px;border-radius:14px;background:#f3f3f6;font-size:34px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rate button small{font-size:12px;margin-top:4px}
.rate button.on{outline:2px solid var(--blue);background:#eef3ff}
#jump{position:fixed;right:14px;bottom:14px;z-index:100;font-size:12px}
#jump>button{background:#111;color:#fff;border-radius:18px;padding:8px 14px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#jump ul{list-style:none;position:absolute;bottom:42px;right:0;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:6px;display:none;width:220px;max-height:80vh;overflow:auto}
#jump.open ul{display:block}
#jump li button{width:100%;text-align:left;padding:7px 10px;border-radius:6px;color:#111}
#jump li button:hover{background:#f1f1f1}
</style>
</head>
<body>
<div id="stage"><div id="ipad">
 <div class="status" id="sb"><span>오후 8:21&nbsp;&nbsp; 11월 3일 화요일</span><span class="r"><svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2-2.3a2.8 2.8 0 00-4 0zM3.3 6.8l1.4 1.5a4.7 4.7 0 016.6 0l1.4-1.5a6.7 6.7 0 00-9.4 0zM.5 3.9L2 5.4a8.6 8.6 0 0112 0l1.5-1.5a10.7 10.7 0 00-15 0z" fill="currentColor"/></svg><svg width="12" height="12" viewBox="0 0 12 12"><path d="M7.5 1a5 5 0 103.5 8.6A5.5 5.5 0 017.5 1z" fill="currentColor"/></svg>86% <span class="batt"><i></i></span></span></div>
 <div id="app"></div>
 <div class="drawer" id="drawer"></div>
 <div id="ov"></div>
</div></div>

mealuse(){return ['급식 이용 현황',`11월 이용 : 점심 0회 / 저녁 0회<span class="guess">화면 추정</span>`]},
mealreq(){return ['급식 의견 남기기',`<textarea style="width:100%;height:120px;border:1px solid #ddd;border-radius:4px;padding:12px;font:inherit" placeholder="급식에 대한 의견을 남겨주세요."></textarea><span class="guess">FAB 기능 추정</span>`,'등록']},
rate(m){return [`11/0${S.mealDay+2} ${m} 맛 평가`,`<div class="rate">${[['😋','최고'],['🙂','좋아요'],['😐','보통'],['🙁','별로']].map(([e,t])=>`<button data-a="rpick" data-v="${t}" class="${S.pick===t?'on':''}">${e}<small>${t}</small></button>`).join('')}</div><span class="guess">평가 방식 추정</span>`,'평가하기',`rsave:${m}`]},
mgr(){return ['학습 매니저 상담 신청',`<div class="fld"><label>담당</label><input value="김기도 학습 매니저" disabled></div><div class="fld"><label>희망 일시</label><input type="datetime-local"></div><div class="fld"><label>상담 내용</label><input placeholder="상담받고 싶은 내용을 적어주세요."></div><span class="guess">신청 폼 추정</span>`,'신청하기','done:상담 신청이 완료되었습니다.']},
c2apply(){return ['수시컨설팅 상담 신청',`<div class="fld"><label>희망 전형</label><select><option>학생부종합</option><option>학생부교과</option><option>논술</option></select></div><div class="fld"><label>희망 대학</label><input placeholder="예) 서울대 공학계열"></div><div class="fld"><label>서류</label><input type="file"></div><span class="guess">신청 폼 추정</span>`,'신청하기','done:수시컨설팅 신청이 완료되었습니다.']},
callform(t){return [t,`<div class="fld"><label>날짜</label><input type="date" value="2026-11-03"></div><div class="fld"><label>시간</label><input type="time" value="18:00"></div><div class="fld"><label>사유</label><input placeholder="사유를 입력해주세요."></div><span class="guess">신청 폼 추정</span>`,'Call 보내기',`done:${t}이 Library로 전달되었습니다.`]},
mycall(){return ['내가 신청한 Call',S.calls.length?S.calls.map(c=>`<div style="padding:10px 0;border-bottom:1px solid #eee">${c} <span style="color:var(--blue);float:right">접수</span></div>`).join(''):'<div style="color:#999;text-align:center;padding:30px">신청한 Call이 없습니다.</div><span class="guess">화면 추정</span>']}
};
S.calls=[];

function render(){
 $('#app').innerHTML=V[S.p]();
 drawer();
 let o='';
 if(S.modal){const [k,arg]=S.modal;const [t,b,ok,act]=MOD[k](arg);o+=`<div class="dim" data-a="mx"><div class="mod" onclick="event.stopPropagation()"><div class="mh">${t}<button data-a="mx">×</button></div><div class="mb">${b}</div><div class="mf"><button data-a="mx">${ok?'취소':'닫기'}</button>${ok?`<button class="k" data-a="mok" data-v="${act||'done:'}">${ok}</button>`:''}</div></div></div>`}
 if(S.toast)o+=`<div class="toast">${S.toast}</div>`;
 $('#ov').innerHTML=o;
 const dark=S.drawer;$('#sb').style.color=dark?'#fff':'#111';$('#sb').style.background=dark?'transparent':'';
}
function drawer(){const g=(arr)=>`<div class="gr">${arr.map(([t,p])=>`<button class="${S.p===p?'on':''}" data-a="dgo" data-v="${p}">${t}</button>`).join('')}</div>`;
 const d=$('#drawer');d.className='drawer'+(S.drawer?' open':'');
 d.innerHTML=`<button class="x" data-a="drawer">✕</button><div class="pf"><div><b>이현서t ${bell}</b><p>57285288 / 임시관 / 1 / 2</p></div><div class="av"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="15" r="8" stroke="#fff" stroke-width="2" fill="none"/><path d="M6 40c2-9 9-13 16-13s14 4 16 13" stroke="#fff" stroke-width="2" fill="none"/></svg><i>⚙</i></div></div>
 <h5>Home</h5>${g([['홈','home']])}
 <h5>My</h5>${g([['출결','att'],['시간표','tt'],['몰입도','imm'],['벌점','pen'],['급식','meal'],['공지 사항','notice'],['캘린더','cal'],['설문','survey']])}
 <h5>1:1상담</h5>${g([['학습 매니저','consult'],['담임 선생님','consult'],['컨설팅신청','consult2']])}
 <h5>강의/보강</h5>${g([['선택특강 신청','lect'],['리클래스 수강','reclass']])}
 <h5>부엉이 Library</h5>${g([['가이드북','guide'],['FAQ','faq'],['바로Call','call']])}`;
 document.querySelectorAll('.drawer-shade').forEach(x=>x.remove());
 if(S.drawer){const sh=document.createElement('div');sh.className='shade drawer-shade';sh.style.zIndex=55;sh.dataset.a='drawer';$('#ipad').appendChild(sh)}
}
let tt;function toast(m){S.toast=m;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast='';render()},1800)}
function go(p){S.p=p;S.call=false;S.drawer=false;S.sel=null;render();const pg=$('.pg');if(pg)pg.scrollTop=0}
$('#ipad').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.classList.contains('dim')&&e.target!==b)return;const a=b.dataset.a,v=b.dataset.v;
 switch(a){
 case 'drawer':S.drawer=!S.drawer;render();break;
 case 'dgo':go(v);break;
 case 'go':go(v);break;
 case 'call':S.call=!S.call;render();break;
 case 'callx':S.call=false;render();break;
 case 'callform':S.call=false;S.modal=['callform',v];render();break;
 case 'notice':S.modal=['notice',+v];render();break;
 case 'modal':S.modal=[v];render();break;
 case 'mx':S.modal=null;S.pick=null;render();break;
 case 'mok':{const [k,msg]=v.split(':');
   if(k==='rsave'){if(!S.pick){toast('맛 평가를 선택해주세요.');return}S.rated[S.mealDay+msg]=S.pick;S.modal=null;S.pick=null;toast('평가가 등록되었습니다.');return}
   if(S.modal&&S.modal[0]==='callform')S.calls.push(S.modal[1]+' · 11/02 18:00');
   S.modal=null;msg?toast(msg):render();break}
 case 'toast':toast(v);break;
 case 'ntab':S.noticeTab=v;render();break;
 case 'stab':S.surveyTab=v;render();break;
 case 'mday':S.mealDay=Math.max(0,Math.min(4,S.mealDay+ +v));render();break;
 case 'mdayset':S.mealDay=+v;render();break;
 case 'rate':S.pick=S.rated[S.mealDay+v]||null;S.modal=['rate',v];render();break;
 case 'rpick':S.pick=v;render();break;
 case 'subj':S.subj=v;S.ltab='apply';render();break;
 case 'ltab':S.ltab=v;render();break;
 case 'lapply':if(S.applied[v])return toast('이미 신청한 특강입니다.');S.applied[v]=1;toast('선택 특강 신청이 완료되었습니다.');break;
 case 'imm':S.immM=Math.min(10,S.immM+ +v);S.immW=1;render();break;
 case 'immw':S.immW=+v;render();break;
 case 'day':S.sel=S.sel===+v?null:+v;render();break;
 case 'faqs':S.q=($('#fq')||{}).value||'';toast(S.q?`"${S.q}" 검색 결과가 없습니다.`:'검색어를 입력해주세요.');break;
 }},true);
const JUMPS=[['① 홈','home'],['② 홈 · Library 바로 Call 메뉴','home',{call:true}],['③ 사이드 메뉴','home',{drawer:true}],['④ 출결 현황','att'],['⑤ 시간표','tt'],['⑥ 몰입도 현황','imm'],['⑦ 벌점 현황','pen'],['⑧ 급식 현황','meal'],['⑨ 공지 사항','notice'],['⑩ 공지 상세 (추정)','notice',{modal:['notice',1]}],['⑪ 캘린더','cal'],['⑫ 설문지','survey'],['⑬ 1:1 상담 신청','consult'],['⑭ 수시컨설팅 신청','consult2'],['⑮ 선택 특강 신청','lect'],['⑯ Library 가이드북','guide'],['⑰ Library FAQ','faq'],['⑱ Library 바로 Call','call'],['⑲ 결석/지각 신청 폼 (추정)','call',{modal:['callform','결석/지각신청']}]];
document.getElementById('jumplist').innerHTML=JUMPS.map((j,i)=>`<li><button data-j="${i}">${j[0]}</button></li>`).join('');
document.getElementById('jumplist').addEventListener('click',e=>{const b=e.target.closest('[data-j]');if(!b)return;const j=JUMPS[+b.dataset.j];
 go(j[1]);Object.assign(S,{modal:null,call:false,drawer:false},j[2]||{});render();document.getElementById('jump').classList.remove('open')});
function fit(){const s=Math.min((innerWidth-24)/1180,(innerHeight-24)/820);document.getElementById('ipad').style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();render();
</script>
</body>
</html>
