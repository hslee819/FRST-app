 return `<div class="nr"><button style="position:absolute;left:24px;top:20px;font-size:18px;font-weight:300" data-a="nrx">✕</button><div class="tt"><span class="tg"><i class="dot" style="background:var(--green)"></i>수학</span><input value="${n.title}" id="nrt"></div>
 <div style="text-align:center;font-size:11px;margin-top:14px"><b style="font-size:12px">출처·태그로 검색</b> | 출처와 태그로 문항을 검색하고 새로운 복습 목록을 만듭니다.</div>
 <div class="dds">${Object.keys(lab).map(k=>`<div>${lab[k]}<div class="s" data-a="dd" data-v="${k}">${val(k)}<span>⌄</span></div>${S.dd===k?`<div class="ddl">${D[k].map(o=>`<div data-a="ddpick" data-v="${k}|${o}">${k==='color'&&o[0]==='#'?`<i class="dot" style="background:${o};width:9px;height:9px"></i>`:o}</div>`).join('')}</div>`:''}</div>`).join('')}</div>
 <div class="nrb"><div style="width:140px;padding:10px">${any?'정리를 완료한 문항 중 조건을 만족하는 문항이 없습니다.':'콘텐츠·태그를 선택해주세요.'}</div><div style="flex:1"><b style="font-size:11px">선택한 문항이 없습니다.</b><div style="margin-top:6px">정리를 마친 문항으로 새로운 복습 그룹을 만들고 플래시 카드를 통해 복습 학습을 진행해 보세요.</div></div></div></div>`}

function render(){
 let h;
 if(S.v&&S.v.pdf)h=pdfViewer();else if(S.v)h=viewer();
 else h=side()+`<div class="main">${PAGES[S.page]()}</div>`+(S.menu?`<div class="menu" style="left:${S.menu.x}px;top:${S.menu.y}px">${['즐겨찾기 추가','다운로드','콘텐츠 숨기기','학습 기록 초기화'].map(x=>`<button data-a="toast" data-v="${x} (메뉴 항목 추정)">${x}</button>`).join('')}</div>`:'');
 $('#app').innerHTML=h;
 $('#ov').innerHTML=newReview()+modal()+(S.toast?`<div class="toast">${S.toast}</div>`:'');
 $('#sb').style.color='#111';
}
let tt;function toast(m){S.toast=m;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast='';render()},1700)}
setInterval(()=>{const v=S.v;if(v&&!v.pdf&&v.mode!=='learn'&&!v.graded&&!v.paused){v.sec++;const t=document.querySelector('.vbar .tm');if(t)t.innerHTML=ico.clock+' '+mm(v.sec)}},1000);
function openViewer(src,i,mode){
 const b=src==='fav'?FAV[i]:ONE[S.tab][i];
 if(b.pdf){S.v={pdf:1,title:`${b.t} ${b.n}회`,n:b.n,pg:1};return}
 const saved=S.saved&&S.saved[b.t+b.n];
 S.v=saved||{title:`${b.t} ${b.n}회`,mode,q:1,ans:{},sec:0,tool:'pen',math:!!b.math,n2:!!b.done};
 if(saved)S.v.paused=false;
}
function grade(){const v=S.v;let ok=0;for(let n=1;n<=45;n++)if(v.ans[n]===KEY[n])ok++;v.graded=true;v.wrong=45-ok;v.score=ok*2;S.modal='omr';v.q=1;
 const b=ONE['국어'].find(x=>x.t+x.n===v.title.replace('회','').replace(' ',''));}
$('#ipad').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.classList.contains('dim')&&e.target!==b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a!=='more'&&S.menu&&!b.closest('.menu')){S.menu=null}
 switch(a){
 case 'page':S.page=v;S.menu=null;if(v==='flash'&&!S.onbSeen){S.onbSeen=1;S.modal='onb'}render();break;
 case 'tab':S.tab=v;S.chip='전체';render();break;
 case 'toastTab':toast('시대 콘텐츠의 과목 탭 (사진은 즐겨찾기만 있음, 추정)');break;
 case 'chip':S.chip=v;render();break;
 case 'fav':S.fav=v;render();break;
 case 'more':{e.stopPropagation();const r=b.getBoundingClientRect(),p=$('#ipad').getBoundingClientRect(),s=p.width/1180;S.menu={x:(r.left-p.left)/s-120,y:(r.bottom-p.top)/s+4};render();break}
 case 'open':{const [src,i]=v.split(':');const bk=src==='fav'?FAV[+i]:ONE[S.tab][+i];S.pending=[src,+i];
   if(bk.pdf){openViewer(src,+i);render();break}
   if(bk.math){openViewer(src,+i,'learn');render();break}
   if(bk.done){openViewer(src,+i,'exam');render();break}
   S.modal='mode';render();break}
 case 'start':S.modal=null;openViewer(S.pending[0],S.pending[1],v);render();break;
 case 'mx':S.modal=null;render();break;
 case 'omr':S.modal='omr';render();break;
 case 'omrpick':{const [n,k]=v.split(':').map(Number);e.stopPropagation();if(S.v.ans[n]===k)delete S.v.ans[n];else S.v.ans[n]=k;render();break}
 case 'goq':{S.v.q=+String(v).split(':')[0];if(S.v.graded&&S.v.q>2)toast('사진에 1~2번 문항만 있어 나머지는 자리만 표시해요.');S.modal=null;render();break}
 case 'pick':{if(S.v.graded)return;const k=+v;if(S.v.ans[S.v.q]===k)delete S.v.ans[S.v.q];else S.v.ans[S.v.q]=k;render();break}
 case 'qprev':S.v.q=Math.max(1,S.v.q-1);render();break;
 case 'qnext':S.v.q=Math.min(S.v.math?30:45,S.v.q+1);render();break;
 case 'tool':S.v.tool=v;render();break;
 case 'lset':S.modal='lset';render();break;
 case 'lsSwap':S.lsSwap=!S.lsSwap;render();break;
 case 'lsBand':S.lsBand=!S.lsBand;render();break;
 case 'report':S.modal='report';render();break;
 case 'vend':if(S.v.graded){S.v=null;S.modal=null;render();break}S.modal='end';render();break;
 case 'later':S.saved=S.saved||{};S.v.paused=true;S.saved[S.v.title.replace(/ |회/g,'')]=S.v;S.v=null;S.modal=null;toast('풀던 기록이 저장되었어요. 다음에 이어서 풀 수 있어요.');break;
 case 'grade':if(Object.keys(S.v.ans).length<45){S.modal='left';render()}else grade(),render();break;
 case 'forcegrade':grade();render();break;
 case 'quit':S.v=null;S.modal=null;render();break;
 case 'only':S.v.only=v==='1';if(S.v.only){const w=Object.keys(KEY).map(Number).find(n=>S.v.ans[n]!==KEY[n]);if(w)S.v.q=w}render();break;
 case 'reveal':S.v.reveal=!S.v.reveal;render();break;
 case 'expl':S.modal='expl';render();break;
 case 'wnote':S.modal='wnote';render();break;
 case 'wadd':S.modal=null;toast('오답노트(오답 플래시)에 추가되었어요.');break;
 case 'pdfend':S.v=null;render();break;
 case 'ftab':S.flashTab=v;render();break;
 case 'fdays':S.fDays=v;render();break;
 case 'fstate':S.fState=v;render();break;
 case 'fview':S.fView=v;render();break;
 case 'fshow':S.fShow=!S.fShow;render();break;
 case 'fprev':S.fIdx=(S.fIdx+2)%3;S.fShow=false;render();break;
 case 'fnext':S.fIdx=(S.fIdx+1)%3;S.fShow=false;render();break;
 case 'nr':S.nr={title:'새 복습'};render();break;
 case 'nrx':S.nr=null;S.dd=null;render();break;
 case 'dd':S.dd=S.dd===v?null:v;render();break;
 case 'ddpick':{const [k,o]=v.split('|');S.nr[k]=o;S.dd=null;render();break}
 case 'menuStart':{const L=['시그니처','시대 하나씩','시대 콘텐츠','오답 플래시'];S.startScreen=L[(L.indexOf(S.startScreen)+1)%4];render();break}
 case 'menuOrder':{const L=['번호순','최신순','내 순서'];S.order=L[(L.indexOf(S.order)+1)%3];render();break}
 case 'toast':toast(v);break;
 }},true);
document.addEventListener('scroll',e=>{if(e.target.id==='pdf'&&S.v){const p=e.target.scrollTop>350?2:1;if(p!==S.v.pg){S.v.pg=p;const el=document.querySelector('.vw>div[style*="right:16px"]');if(el)el.innerHTML='🔖 &nbsp;'+p+'/2'}}},true);
const JUMPS=[
 ['① 시그니처',{page:'sig'}],['② 시대 하나씩 · 국어',{page:'one',tab:'국어',chip:'전체'}],['③ 시대 하나씩 · 서바 필터',{page:'one',tab:'국어',chip:'서바'}],['④ 시대 콘텐츠 · 즐겨찾기',{page:'con'}],
 ['⑤ 모드 선택 팝업',{page:'one',tab:'국어',chip:'월례',modal:'mode',pending:['one',2]}],
 ['⑥ 시험 모드 뷰어 (월례고사 10회)',{},()=>{openViewer('one',2,'exam')}],
 ['⑦ OMR 답안지',{modal:'omr'},()=>{openViewer('one',2,'exam');S.v.ans={1:1};S.v.q=2}],
 ['⑧ 학습 화면 설정',{modal:'lset'},()=>{openViewer('one',2,'exam');S.v.q=2}],
 ['⑨ 오류 신고',{modal:'report'},()=>{openViewer('one',2,'exam');S.v.q=2}],
 ['⑩ 학습 종료 → 채점하기',{modal:'end'},()=>{openViewer('one',2,'exam');S.v.ans={1:1};S.v.q=2}],
 ['⑪ 미응답 경고',{modal:'left'},()=>{openViewer('one',2,'exam');S.v.ans={1:1};S.v.q=2}],
 ['⑫ 채점 결과 OMR',{},()=>{openViewer('one',2,'exam');S.v.ans={1:1};S.v.sec=37;grade()}],
 ['⑬ 채점 후 해설',{},()=>{openViewer('one',2,'exam');S.v.ans={1:1};S.v.sec=37;grade();S.v.q=2;S.modal='expl'}],
 ['⑭ 채점 후 오답노트 추가',{},()=>{openViewer('one',2,'exam');S.v.ans={1:1};S.v.sec=37;grade();S.v.q=2;S.modal='wnote'}],
 ['⑮ 학습 모드 (수학 서바이벌 26회)',{tab:'수학'},()=>{S.tab='수학';openViewer('one',0,'learn')}],
 ['⑯ N차 시험 모드 (서바이벌 17회)',{tab:'국어'},()=>{S.tab='국어';openViewer('one',3,'exam')}],
 ['⑰ PDF 뷰어 (엑셀러레이터 29회 해설)',{},()=>{openViewer('fav',0)}],
 ['⑱ 오답 플래시 안내',{page:'flash',modal:'onb'}],['⑲ 오답 플래시',{page:'flash'}],
 ['⑳ 새 복습 · 콘텐츠 드롭다운',{page:'flash',nr:{title:'새 복습'},dd:'cont'}],
 ['㉑ 새 복습 · 조건 선택 후',{page:'flash',nr:{title:'새 복습',cont:'사진으로 문항 추가한 콘텐츠',tag:'자연수 조건',color:'#e8b43a',st:'복습 중'}}],
 ['㉒ 설정',{page:'set'}]];
document.getElementById('jumplist').innerHTML=JUMPS.map((j,i)=>`<li><button data-j="${i}">${j[0]}</button></li>`).join('');
document.getElementById('jumplist').addEventListener('click',e=>{const b=e.target.closest('[data-j]');if(!b)return;const j=JUMPS[+b.dataset.j];
 S.saved={};Object.assign(S,{v:null,modal:null,menu:null,nr:null,dd:null,toast:'',tab:'국어',chip:'전체',onbSeen:1},j[1]);if(j[2])j[2]();if(j[1].modal)S.modal=j[1].modal;render();document.getElementById('jump').classList.remove('open')});
function fit(){const s=Math.min((innerWidth-24)/1180,(innerHeight-24)/820);document.getElementById('ipad').style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();render();
</script>
