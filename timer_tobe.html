 if(m==='focus'){const it=S.items[S.sel],x=it.s||0,p=n=>String(n).padStart(2,'0');return `<div class="dim fsd" data-a="mx"><div class="fsheet" onclick="event.stopPropagation()"><div class="fsh"><b>집중도 평가하기</b><button class="fx" data-a="mx">${ico.x||'✕'}</button></div>

 if(m==='synced'){const it=S.items[S.sel];return `<div class="dim" data-a="mx"><div class="mod done-sch" style="width:400px;padding:28px 26px 22px" onclick="event.stopPropagation()"><b style="font-size:18px">스케줄러에 기록했어요</b><i class="new">NEW</i>

 d.innerHTML=`<div style="display:flex;align-items:center;padding:42px 24px 24px;border-bottom:1px solid #ddd;font-size:16px;font-weight:700;gap:8px">${ico.gear}설정<button class="xbtn" style="position:static;margin-left:auto" data-a="set">×</button></div>
 <div style="padding-top:12px">${['이용 안내','공지 사항','자주 묻는 질문','1:1 문의하기','개인정보처리방침','이용 약관'].map(x=>`<div class="it2" data-a="toast" data-v="${x} 페이지">${x}<span>›</span></div>`).join('')}</div>
 <div style="border-top:1px solid #ddd;margin:12px 24px"></div><div class="it2" data-a="toast" data-v="닉네임 수정">닉네임 수정<span>›</span></div><div style="border-top:1px solid #ddd;margin:12px 24px"></div>

 <div class="it2" style="color:#999;font-weight:400">앱버전<span style="color:#111">2.23(284)</span></div><button style="display:block;margin:10px auto;width:224px;height:38px;border-radius:19px;background:#e5e5e8;font-size:12px" data-a="toast" data-v="로그아웃">로그아웃</button>`;
 document.querySelectorAll('.set-shade').forEach(x=>x.remove());
 if(S.setOpen){const sh=document.createElement('div');sh.className='dim set-shade';sh.style.zIndex=65;sh.style.background='rgba(0,0,0,.6)';sh.dataset.a='set';$('#ipad').appendChild(sh)}}

let RK='';const scEls=()=>[...document.querySelectorAll('#app *,#ov *')].filter(e=>e.scrollHeight>e.clientHeight+1);
function render(){
 const rk=[S.tab,S.mng,S.rep,S.modal,S.anaTab].join('|'),sc=rk===RK?scEls().map(e=>[e.scrollTop,e.scrollLeft]):[];RK=rk;
 $('#app').innerHTML=(S.tab==='run'?runView():S.tab==='mng'?mngView():repView())+tabbar();
 $('#ov').innerHTML=modal()+(S.toast?`<div class="toast">${S.toast}</div>`:'');
 setPanel();
 const dk=!!S.modal||S.setOpen;$('#sb').style.color=dk?'#fff':'#111';
 if(sc.length)scEls().forEach((e,i)=>{if(sc[i]){e.scrollTop=sc[i][0];e.scrollLeft=sc[i][1]}});
}
let tt;function toast(m){S.toast=m;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast='';render()},1800)}
setInterval(()=>{if(S.running){S.secs++}if(S.running||(S.tab==='run'&&!S.modal&&!S.setOpen&&!S.toast)||S.modal==='together'){if(!document.activeElement||document.activeElement.tagName!=='INPUT')render()}},1000);
function stopRun(){const it=S.items[S.sel];it.s=S.secs;it.done=1;it.t=it.t||'오후 8:27';S.running=false}
function openEdit(){const it=S.items[S.sel];S.edit={i:S.sel,s:it.s,subj:it.subj||'기타',cont:it.cont||'미설정',n:it.n};S.editOrig=JSON.stringify(S.edit);S.modal='edit';S.dd=false;S.confirm=false;render()}
function loadEdit(i){const it=S.items[i];S.edit={i,s:it.s,subj:it.subj||'기타',cont:it.cont||'미설정',n:it.n};S.editOrig=JSON.stringify(S.edit)}
function saveEdit(){const e=S.edit,it=S.items[e.i];it.s=e.s;it.subj=e.subj;it.cont=e.cont;it.n=e.n}
document.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f||!S.edit)return;
 if(f==='n'){S.edit.n=e.target.value;saveEdit();return}
 const [h,m,s]=fmt(S.edit.s).map(Number);const v=Math.max(0,parseInt(e.target.value)||0);
 S.edit.s=f==='h'?v*3600+m*60+s:f==='m'?h*3600+Math.min(v,59)*60+s:h*3600+m*60+Math.min(v,59);saveEdit()});
$('#ipad').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.classList.contains('dim')&&e.target!==b)return;const a=b.dataset.a,v=b.dataset.v;
 switch(a){
 case 'tab':S.tab=v;if(v==='mng')S.mng='ana';render();break;
 case 'eclose':S.modal=null;toast('수정한 내용이 저장되었어요.');break;
 case 'fok':{const it=S.items[S.sel];if(S.focus)it.focus=S.focus;if(it.sch){S.modal='synced';render()}else{S.modal=null;render()}break}
 case 'toSch':{const it=S.items[S.sel];{const qq=new URLSearchParams({rec:it.sch,min:Math.max(1,Math.round(it.s/60)),focus:{'렘 수면':1,'조금 공부':2,'집중 공부':3,'초집중 공부':4,'무아지경 공부':5}[it.focus]||3}).toString();if(parent!==window)parent.postMessage({go:'sch',q:qq},'*');else location.href='scheduler_tobe.html?'+qq};break}
 case 'demo':S.secs+=1800;render();break;
 case 'tysel':S.tySel=v;render();break;
 case 'anaP':S.anaP=v;render();break;
 case 'anaBy':S.anaBy=v;render();break;
 case 'tyadd':{const x=($('#tyin').value||'').trim();if(!x)return toast('추가할 유형 이름을 입력해 주세요.');if(S.types.includes(x))return toast('이미 있는 유형이에요.');S.types.push(x);S.tySel=x;if(!XTS.includes(x))XTS.push(x);if(parent!==window)parent.postMessage({types:[x]},'*');toast(`'${x}' 유형을 추가했어요. 스케줄러 유형 목록에도 추가돼요.`);break}
 case 'goRun':S.tab='run';S.sel=+v;render();break;
 case 'pick':if(S.running)return toast('측정 중에는 다른 타이머로 이동할 수 없어요.');S.sel=+v;render();break;
 case 'view':S.view=+v;render();break;
 case 'start':S.running=true;S.secs=S.items[S.sel].done?0:S.items[S.sel].s;render();break;
 case 'pause':stopRun();toast('측정이 일시정지 되었어요.');break;
 case 'stop':stopRun();S.focus=null;S.modal='focus';render();break;
 case 'nextIt':if(S.running)stopRun();S.sel=(S.sel+1)%S.items.length;render();break;
 case 'again':S.tab='run';S.sel=0;S.running=true;S.secs=0;render();break;
 case 'edit':if(S.running)return toast('측정 중에는 수정할 수 없어요.');openEdit();break;
 case 'eitem':loadEdit(+v);render();break;
 case 'esubj':S.edit.subj=v;saveEdit();render();break;
 case 'dd':S.dd=!S.dd;render();break;
 case 'econt':S.edit.cont=v;saveEdit();S.dd=false;e.stopPropagation();render();break;
 case 'tipx':S.tip=false;e.stopPropagation();render();break;
 case 'ecancel':if(JSON.stringify(S.edit)!==S.editOrig){S.confirm=true;render()}else{S.modal=null;render()}break;
 case 'cfgo':S.confirm=false;render();break;
 case 'cfquit':S.confirm=false;S.modal=null;render();break;
 case 'esave':if(JSON.stringify(S.edit)===S.editOrig)return toast('수정된 데이터가 없습니다.');saveEdit();S.modal=null;toast('데이터가 수정되었습니다.');break;
 case 'esavenext':{if(JSON.stringify(S.edit)!==S.editOrig)saveEdit();const n=(S.edit.i+1)%S.items.length;loadEdit(n);render();break}
 case 'mx':S.modal=null;render();break;
 case 'together':S.modal='together';render();break;
 case 'mate':S.modal='together';render();break;
 case 'owl':S.owlSel=+v;render();break;
 case 'setMate':{const o=TOG[S.owlSel];if(!o[4]&&o[2]===0)return toast('현재 공부 중인 부엉이만 메이트로 지정할 수 있어요.');S.mate=o[0];toast(`${o[0]}을(를) 부엉이메이트로 지정했어요.`);break}
 case 'hideTg':S.hideTg=!S.hideTg;render();break;
 case 'focus':S.modal='focus';render();break;

 case 'addok':{const n=($('#nname')||{}).value||S.nsubj;const c={국어:'#ffe0a8',수학:'#bfeccb',영어:'#fdd5c0'}[S.nsubj]||'#ddd';S.items.push({n,c,s:0,subj:S.nsubj,cont:S.ntype||'기타'});S.modal=null;S.sel=S.items.length-1;toast('새 타이머가 추가되었습니다.');break}
 case 'mng':S.mng=v;render();break;
 case 'coll':S.coll=+v;render();break;
 case 'heart':S.heart=!S.heart;render();break;
 case 'rep':S.rep=v;S.anaTab='rt';render();break;
 case 'ana':S.anaTab=v;render();break;
 case 'lg':S.lgTab=v;render();break;
 case 'hideLg':S.hideLg=!S.hideLg;render();break;
 case 'closet':S.modal='closet';render();break;
 case 'wtab':S.wTab=+v;render();break;

 case 'wsave':S.modal=null;toast('저장되었습니다.');break;
 case 'set':S.setOpen=!S.setOpen;render();break;
 case 'push':S.push=!S.push;render();break;
 case 'dark':S.dark=!S.dark;toast(S.dark?'다크모드는 프로토타입에서 지원하지 않아요.':'라이트 모드');break;
 case 'toast':toast(v);break;
 }},true);
const JUMPS=[['NEW ⓐ 스케줄러 일정에서 시작 (측정 중)','run',{view:0,sel:3,running:true,secs:0,_from:1}],['NEW ⓑ 측정 종료 → 스케줄러에 기록','run',{sel:3,_synced:1}],['NEW ⓒ 데이터 수정 (자동 저장)','run',{_edit:1}],['NEW ⓓ 관리하기 · 학습 시간 분석','mng',{mng:'ana'}],['NEW ⓔ 새 타이머 추가 (공통 유형)','run',{modal:'add',nsubj:'수학',ntype:'N제'}],['① 측정하기 · 디지털','run',{view:0}],['② 측정하기 · 아날로그 시계','run',{view:1}],['③ 측정하기 · 부엉이 VS','run',{view:2}],['④ 측정 중 (한번 더 하기 누른 뒤)','run',{view:0,running:true,secs:0}],['⑤ 함께 부엉하기','run',{modal:'together'}],['⑦ 데이터 수정 · 콘텐츠 드롭다운','run',{_edit:2}],['⑨ 관리하기 · 마이 타이머','mng',{mng:'my'}],['⑪ 확인하기 · 일간 리포트','rep',{rep:'d'}],['⑫ 확인하기 · 주간 리포트','rep',{rep:'w'}],['⑬ 확인하기 · 월간 리포트','rep',{rep:'m'}],['⑭ 부엉이 옷장','rep',{rep:'d',modal:'closet'}],['⑮ 설정','rep',{rep:'d',setOpen:true}]];
document.getElementById('jumplist').innerHTML=JUMPS.map((j,i)=>`<li><button data-j="${i}">${j[0]}</button></li>`).join('');
document.getElementById('jumplist').addEventListener('click',e=>{const b=e.target.closest('[data-j]');if(!b)return;const j=JUMPS[+b.dataset.j];
 if(S.running)stopRun();Object.assign(S,{tab:j[1],modal:null,setOpen:false,running:false,sel:0,confirm:false,dd:false,items:ITEMS0(),types:TYPES0.concat(XTS.filter(t=>!TYPES0.includes(t)))},j[2]);
 if(j[2]._from)showFrom();
 if(j[2]._synced){S.items[3].s=5640;S.items[3].done=1;S.items[3].t='오후 8:21';S.items[3].focus='초집중 공부';S.modal='synced'}
 if(j[2]._edit){openEdit();if(j[2]._edit===2){S.dd=true}}
 render();document.getElementById('jump').classList.remove('open')});

(function(){const q=new URLSearchParams(window.__Q||location.search);if(q.get('from')!=='sch')return;
 let i=S.items.findIndex(x=>x.sch==q.get('id'));
 if(i<0){S.items.push({n:q.get('title'),c:'#ddd',s:0,subj:q.get('subj'),cont:q.get('type'),sch:+q.get('id'),plan:+q.get('plan'),ss:q.get('s'),se:q.get('e')});i=S.items.length-1}
