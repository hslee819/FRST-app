<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시대인재 통합 앱 (개선안)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--fg:#111;--sub:#8a8a8a;--faint:#c4c4c4;--line:#e6e6e6;--line2:#d4d4d4;--bg2:#f6f6f6;--bg3:#f3f3f5;--red:#f2352b;--blue:#2f6bf0;--green:#2E9E52}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#d9dbe0;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;color:var(--fg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#ipad{width:1180px;height:820px;background:#fff;position:relative;overflow:hidden;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);flex:none;transform-origin:center}
.status{position:absolute;top:0;left:0;right:0;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px;font-weight:700;z-index:60;pointer-events:none}
.status .r{display:flex;gap:6px;align-items:center}
.batt{width:24px;height:11px;border:1.5px solid currentColor;border-radius:3px;padding:1px}
.batt i{display:block;height:100%;width:92%;background:currentColor;border-radius:1px}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:30px}
/* header */
.hdr{height:84px;flex:none;display:flex;padding:0 30px}
.who b{font-size:20px;font-weight:800;display:block;margin-top:20px;letter-spacing:-.3px}
.who small{font-size:11.5px;display:block;margin-top:8px}
.dday{margin-left:16px;margin-top:20px;font-size:11px;color:var(--sub)}
.dday b{color:var(--fg);font-size:14px;margin-left:8px}
.dday .l2{display:flex;align-items:center;gap:10px;margin-top:9px}
.bar{width:100px;height:8px;border-radius:4px;background:#e5e5e5;overflow:hidden;display:inline-block}
.bar i{display:block;height:100%;background:#111;border-radius:4px}
.dday .l2 b{margin:0}
.hdr .rt{margin-left:auto;display:flex;gap:12px;margin-top:28px}
.cic{width:28px;height:28px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;position:relative}
.cic .dot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--red)}
/* sub nav */
.snav{height:50px;flex:none;display:flex;align-items:center;padding:0 30px}
.vt{font-size:21px;font-weight:800;color:var(--line2);margin-right:24px;letter-spacing:-.3px}
.vt.on{color:var(--fg)}
.snav .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.main{flex:1;min-height:0;padding:8px 30px 16px;position:relative;display:flex;gap:16px}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
/* subject tabs */
.stabs{display:flex;align-items:center;height:30px}
.stab{font-size:15px;font-weight:700;color:var(--line2);margin-right:22px}
.stab.on{color:var(--fg)}
/* boxes, buttons */
.panel{border:1px solid var(--line2);border-radius:5px;background:#fff;position:relative;min-height:0}
.ph{height:52px;display:flex;align-items:center;padding:0 16px;gap:10px;flex:none}
.ph h4{font-size:14.5px;font-weight:800}
.ph .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.pb{height:28px;border:1px solid var(--line2);border-radius:14px;padding:0 13px;font-size:12px;display:inline-flex;align-items:center;gap:5px;background:var(--bg2);white-space:nowrap}
.pb.on{background:#111;border-color:#111;color:#fff}
.pb.dis{color:var(--faint);cursor:default}
.kb{height:36px;border-radius:18px;padding:0 18px;background:#111;color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.kb.lg{height:44px;border-radius:22px;padding:0 24px;font-size:14px}
.kb.ghost{background:#fff;color:#111;border:1px solid var(--line2)}
.kb.dis{background:#e3e3e3;color:#fff;cursor:default}
.chip{height:28px;border-radius:14px;padding:0 13px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;background:#ececee;color:#555}
.chip.on{background:#111;color:#fff}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9px;font-size:10px;font-weight:700;white-space:nowrap}
.t-gray{background:#efeff1;color:#666}.t-blue{background:#e6eeff;color:var(--blue)}.t-red{background:#ffe9e7;color:var(--red)}.t-green{background:#e2f5e8;color:var(--green)}.t-yel{background:#f4b73a;color:#fff}.t-dark{background:#111;color:#fff}.t-line{border:1px solid var(--line2);color:#666;background:#fff}
.sd{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.scroll{overflow-y:auto;scrollbar-width:thin}
.muted{color:var(--sub)}
.arr{width:24px;height:24px;border-radius:50%;background:#111;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.arr.dis{background:#e3e3e3}
/* tabbar */
.tabbar{height:70px;flex:none;border-top:1px solid var(--line);display:flex;justify-content:center;gap:58px;background:#fff}
.tb{width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:11px;font-size:10px;color:#a3a3a3;position:relative}
.tb.on{color:var(--fg);font-weight:700}
.tb .nb{position:absolute;top:8px;right:22px;min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* content cards (홈 문항) */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-content:start}
.ccard{background:var(--bg3);border-radius:8px;padding:13px 14px;height:248px;display:flex;flex-direction:column;text-align:left;position:relative}
.ccard .top{display:flex;align-items:center;gap:6px;font-size:10.5px;height:18px}
.ccard h5{font-size:15px;font-weight:800;margin-top:10px}
.ccard .no{font-size:14px;margin-top:6px}
.ccard .ty{font-size:10px;color:var(--sub);margin-top:3px}
.cover{width:74px;height:100px;margin:12px auto 0;background:#d6d6d9;position:relative;display:flex;align-items:center;justify-content:center}
.cover span{position:absolute;right:4px;top:6px;writing-mode:vertical-rl;font-size:7.5px;font-weight:800;letter-spacing:1px}
.ccard .ft{margin-top:auto;display:flex;gap:6px}
.ccard .ft button{flex:1;height:26px;border-radius:13px;background:#fff;border:1px solid var(--line2);font-size:11px;font-weight:600}
.ccard .ft button.k{background:#111;color:#fff;border-color:#111}
.ccard.plan{opacity:.55}
.summ{display:flex;gap:10px}
.summ .s{flex:1;border:1px solid var(--line2);border-radius:5px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.summ .s b{font-size:20px;font-weight:800}
.summ .s small{font-size:11px;color:var(--sub);display:block}
/* table */
.qtab{width:100%;border-collapse:collapse;font-size:12.5px;text-align:center}
.qtab thead th{height:34px;font-weight:700;background:#fff;position:sticky;top:0;z-index:1;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line) inset}
.qtab td{height:42px}
.qtab tbody tr:nth-child(odd){background:var(--bg2)}
.qtab .wr td{color:var(--red)}
.qtab .wr td.act{color:inherit}
.circ{display:inline-flex;width:15px;height:15px;border:1px solid currentColor;border-radius:50%;align-items:center;justify-content:center;font-size:9px}
.mini{height:22px;border-radius:11px;padding:0 9px;font-size:10.5px;background:#fff;border:1px solid var(--line2);display:inline-flex;align-items:center;gap:3px;color:#111;font-weight:600}
.mini.k{background:#111;color:#fff;border-color:#111}
.scores{display:flex;justify-content:space-around;text-align:center;padding:4px 10px 0}
.scores small{font-size:11px;display:block}
.scores b{font-size:24px;font-weight:800;display:block;margin-top:3px}
.cuttab{width:100%;border-collapse:collapse;font-size:12px;text-align:center}
.cuttab th,.cuttab td{border:1px solid var(--line2);height:32px}
.cuttab th{background:var(--bg2);font-weight:700}
/* list rows */
.lrow{display:flex;align-items:center;gap:8px;padding:0 14px;height:52px;border-top:1px solid var(--line);width:100%;text-align:left;font-size:12.5px;white-space:nowrap}
.lrow.on{background:#111;color:#fff}
.lrow.on .muted{color:#aaa}
.lrow .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.sec-t{font-size:11px;color:var(--sub);font-weight:700;padding:14px 16px 6px}
/* bars */
.hbar{display:flex;align-items:center;gap:10px;font-size:12px;height:30px}
.hbar .lb{width:84px;flex:none}
.hbar .tr{flex:1;height:10px;background:#efeff1;border-radius:5px;position:relative;overflow:hidden}
.hbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.hbar .v{width:64px;text-align:right;font-weight:700;flex:none}
.vchart{display:flex;align-items:flex-end;gap:10px;height:170px;padding:0 6px;border-bottom:1px solid var(--line2);position:relative}
.vchart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:10.5px}
.vchart .c i{display:block;width:60%;max-width:30px;border-radius:3px 3px 0 0;background:#111}
.vchart .c i.g{background:#d9d9dd}
.vlab{display:flex;gap:10px;padding:6px 6px 0}
.vlab span{flex:1;text-align:center;font-size:10.5px;color:var(--sub)}
/* viewer */
.vtop{position:absolute;top:34px;left:106px;right:106px;height:44px;border-radius:22px;background:#2b2b2d;color:#fff;display:flex;align-items:center;padding:0 22px;font-size:12.5px;gap:14px;z-index:5}
.vtop b{font-weight:800}
.vtop .sep{width:1px;height:14px;background:#555}
.vtop .md{display:flex;align-items:center;gap:6px;color:#ddd}
.vtop .md i{width:8px;height:8px;border-radius:50%}
.vtop .tm{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.vtop .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.vtop .r button{height:28px;border-radius:14px;padding:0 13px;border:1px solid #555;font-size:12px;color:#fff;display:inline-flex;align-items:center;gap:5px}
.vtop .r button.w{background:#fff;color:#111;border-color:#fff;font-weight:700}
.vtop .r button.on{background:#f4b73a;border-color:#f4b73a;color:#111}
.vback{position:absolute;top:36px;left:40px;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;z-index:5}
.vbody{position:absolute;top:96px;left:30px;right:30px;bottom:20px;border:1px solid var(--line2);display:flex}
.vpane{flex:1;padding:24px 28px;overflow-y:auto;font-size:15px;line-height:1.75;scrollbar-width:thin}
.vpane+.vpane{border-left:1px solid var(--line2)}
.psg{border:1px solid #333;padding:14px 16px;font-family:"Nanum Myeongjo","Batang",serif;font-size:14.5px;line-height:1.85;text-align:justify}
.psg p{text-indent:1em}
.psg .box{border:1px solid #111;padding:0 3px}
.qtext{font-size:15.5px;margin-bottom:14px}
.opt{display:flex;gap:8px;padding:6px 10px;border-radius:6px;width:100%;text-align:left;font-size:15px;line-height:1.6;margin-bottom:2px}
.opt:hover{background:#f6f6f8}
.opt.sel{background:#eef3ff}
.opt.ok{background:#e2f5e8}
.opt.no{background:#ffe9e7}
.opt .n{flex:none;width:20px}
.solbox{margin-top:18px;border-top:2px solid #111;padding-top:14px;font-size:14px;line-height:1.75}
.solbox h6{font-size:13px;font-weight:800;margin-bottom:6px}
.mpanel{position:absolute;right:46px;bottom:40px;width:206px;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:12px 12px 10px;font-size:11.5px;z-index:4}
.mpanel .rw{display:flex;align-items:center;gap:6px;height:32px}
.mpanel .rw>span{width:30px;color:var(--sub)}
.bub{width:24px;height:24px;border-radius:50%;border:1px solid #999;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.bub.on{background:#111;color:#fff;border-color:#111}
.bub.ok{background:var(--green);border-color:var(--green);color:#fff}
.bub.no{background:var(--red);border-color:var(--red);color:#fff}
.mbook{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--bg2)}
.mbook.on{background:#f4b73a;color:#fff}
/* omr */
.omr{display:grid;grid-template-columns:repeat(3,1fr);gap:0 26px}
.orow{display:flex;align-items:center;gap:7px;height:33px;border-bottom:1px solid var(--line);font-size:12px}
.orow>b{width:24px;text-align:right;font-weight:700;margin-right:4px}
.orow .bub{width:21px;height:21px;font-size:10px}
/* scrap cards */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-content:start}
.scard{border:1px solid var(--line2);border-radius:6px;padding:13px 14px;text-align:left;display:flex;flex-direction:column;gap:7px;height:162px;background:#fff}
.scard h6{font-size:13.5px;font-weight:800}
.scard p{font-size:11.5px;color:#555;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.scard .ft{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--sub)}
/* wrong list */
.wrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.wrow h6{font-size:13.5px;font-weight:700}
.wrow p{font-size:11.5px;color:var(--sub);margin-top:3px}
.hist{display:flex;gap:3px}
.hist i{width:9px;height:9px;border-radius:50%;background:var(--red)}
.hist i.o{background:var(--green)}
/* canvas */
.draw{position:relative;flex:1;border:1px solid var(--line2);border-radius:5px;background:repeating-linear-gradient(#fff 0 27px,#f0f0f2 27px 28px)}
.draw canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
/* ask picker */
.pick{display:flex;gap:0;flex:1;min-height:0}
.pcol{flex:1;border:1px solid var(--line2);overflow-y:auto;scrollbar-width:thin}
.pcol+.pcol{border-left:0}
.pcol button{display:flex;align-items:center;gap:8px;width:100%;height:46px;padding:0 18px;border-bottom:1px solid var(--line);font-size:14px;text-align:left}
.pcol button.on{background:#141414;color:#fff}
.pcol .nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px}
.pcol .nums button{height:38px;padding:0;justify-content:center;border:1px solid var(--line2);border-radius:4px;font-size:13px}
.crumb{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--faint)}
.crumb .on{color:#111}
.acard{border:1px solid var(--line2);border-radius:6px;padding:14px 16px;margin-bottom:10px;width:100%;text-align:left;display:block}
.acard .hd{display:flex;align-items:center;gap:8px;font-size:12px}
.acard .sm{font-size:13px;line-height:1.6;margin-top:8px}
.acard .full{font-size:12.5px;line-height:1.7;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:#333}
.rank{display:flex;align-items:center;gap:16px;height:56px;border-bottom:1px solid var(--line);padding:0 18px;width:100%;text-align:left;font-size:14px}
.rank b.n{width:24px;font-size:17px;font-weight:800}
/* form */
.fl{font-size:12px;font-weight:700;margin:16px 0 8px}
.fl:first-child{margin-top:0}
.sel{height:38px;border:1px solid var(--line2);border-radius:5px;padding:0 12px;font-size:13px;background:#fff;display:flex;align-items:center;gap:6px;flex:1}
.ta{width:100%;height:150px;border:1px solid var(--line2);border-radius:5px;padding:12px;font-size:13px;resize:none;outline:none;line-height:1.6}
.inp{height:38px;border:1px solid var(--line2);border-radius:5px;padding:0 12px;font-size:13px;outline:none;width:100%}
/* study */
.week{display:flex;gap:8px}
.wd{width:58px;height:56px;border-radius:8px;border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--sub);gap:2px}
.wd b{font-size:16px;color:#111}
.wd.on{background:#111;border-color:#111;color:#bbb}
.wd.on b{color:#fff}
.wd .dts{display:flex;gap:2px;margin-top:2px}
.wd .dts i{width:4px;height:4px;border-radius:50%}
.prow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.prow.on{background:#f4f6ff}
.prow .cb{width:4px;height:36px;border-radius:2px;flex:none}
.prow h6{font-size:13.5px;font-weight:700}
.prow p{font-size:11px;color:var(--sub);margin-top:3px}
.mk{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.digits{font-size:92px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;text-align:center;color:#8b8b8b}
.digits.run{color:#111}
.tctl{display:flex;justify-content:center;gap:56px;margin-top:20px}
.tctl button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#555}
.tctl button span{width:52px;height:52px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center}
.tctl button.k span{background:#111;color:#fff}
.tctl button.dis{opacity:.35;cursor:default}
.heat{display:grid;grid-template-columns:40px repeat(16,1fr);gap:3px;font-size:10px;color:var(--sub);align-items:center}
.heat i{height:22px;border-radius:3px;display:block}
/* admin */
.amenu{width:214px;flex:none;padding:6px 0;overflow-y:auto}
.amenu .h{font-size:11px;color:var(--sub);font-weight:700;padding:16px 18px 6px}
.amenu button{display:flex;width:100%;height:38px;align-items:center;padding:0 18px;font-size:14px;gap:8px}
.amenu button.on{background:#111;color:#fff;font-weight:700}
.nrow{display:flex;align-items:center;gap:12px;height:54px;border-bottom:1px solid var(--line);padding:0 18px;width:100%;text-align:left;font-size:14px}
.slot{height:36px;border:1px solid var(--line2);border-radius:5px;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.slot.on{background:#111;color:#fff;border-color:#111}
.slot.dis{background:var(--bg2);color:var(--faint);cursor:default;text-decoration:line-through}
.ttab{width:100%;border-collapse:collapse;font-size:11.5px;text-align:center;table-layout:fixed}
.ttab th,.ttab td{border:1px solid var(--line);height:38px}
.ttab th{background:var(--bg2);font-weight:700}
.ttab td.f{font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:62px;padding:6px 8px;font-size:11.5px}
.cal div.h{height:30px;background:var(--bg2);font-weight:700;text-align:center;padding:7px 0}
.cal div.x{color:var(--faint)}
/* overlay */
#overlay{position:absolute;inset:0;z-index:50;display:none}
#overlay.on{display:block}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;width:420px;padding:26px 26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{font-size:18px;font-weight:800;margin-bottom:8px}
.modal .d{font-size:13px;color:#555;line-height:1.6}
.modal .btns{display:flex;gap:8px;margin-top:22px}
.modal .btns button{flex:1;height:44px;border-radius:22px;background:var(--bg2);font-size:14px;font-weight:700}
.modal .btns button.k{background:#111;color:#fff}
.modal .x{position:absolute;right:18px;top:18px}
.mopt{display:flex;align-items:center;gap:14px;border:1px solid var(--line2);border-radius:10px;padding:16px;margin-top:10px;width:100%;text-align:left}
.mopt b{font-size:15px;display:block}
.mopt small{font-size:12px;color:var(--sub)}

function selRate(c,qi,a){const R=rnd((c.r||7)*31+qi*7+3);const ok=48+Math.floor(R()*30);let left=100-ok;const o=[];for(let k=1;k<=5;k++){if(k===a)continue;o.push(R()+.15)}const sm=o.reduce((x,y)=>x+y,0);let out=[],j=0,acc=0;for(let k=1;k<=5;k++){if(k===a){out.push(ok);continue}let v=j<3?Math.round(o[j]/sm*left):left-acc;acc+=j<3?v:0;j++;out.push(v)}return out}

 const shown=V.mode==='sol'||(V.mode==='study'&&V.chk[V.qi]);const mine=V.ans[V.qi];
 const rate=shown?selRate(X.seed,V.qi,q.a):null;
 const opts=q.o.map((o,i)=>{const v=i+1;let cl='';if(shown){if(v===q.a)cl='ok';else if(mine===v)cl='bad'}else if(mine===v)cl='sel';
  return `<div class="op ${cl} ${rate?'rto':''}" data-a="vAns" data-v="${v}">${rate?`<i class="rb" style="width:${rate[i]}%"></i>`:''}<span>${CIRC[v]} ${o}</span>${rate?`<span class="rp">${rate[i]}%</span>`:''}</div>`}).join('');
 const modeL=V.scrap?(X.x.kind==='질문 내역'?'질문':'스크랩'):exam?'시험 모드':V.mode==='sol'?'해설':'학습 모드';

 const bar=`<div class="vbar"><b>${X.title}</b><span style="color:#555">|</span><span class="md"><i>●</i> ${modeL}</span>${exam?`<span class="tm">${I.clock} <span id="vtime">${fmt(V.sec,true)}</span></span>`:''}

  ${V.scrap?`${X.x.folder?'':'<button class="pl" data-a="fPick" data-v="'+X.x.id+'">오답 정리에 추가</button>'}<button class="end k" data-a="vClose">닫기</button>`:`<button class="end k" data-a="${exam?'vEnd':'vClose'}">${exam?'시험 종료':'학습 종료'}</button>`}</span></div>`;

const fmt=(s,h)=>{const p=n=>String(n).padStart(2,'0');return h?`${p(Math.floor(s/3600))} : ${p(Math.floor(s/60)%60)} : ${p(s%60)}`:`${p(Math.floor(s/60))}:${p(s%60)}`};

/* =========================================================

const srcTag={'성적':'t-dark','문항':'t-gray','질문하기':'t-blue','OCR':'t-green'};
function arc(){
 if(S.wd!=null)return header()+wrongDetail();
 const right=S.arcSub==='scrap'?`<button class="kb" data-a="ocr">${I.cam} OCR로 스크랩</button>`:`<button class="kb" data-a="flashStart">${I.bolt} 오답 플래시</button>`;
 return header()+snav([['scrap','스크랩'],['wrong','오답 정리']],S.arcSub,'arcSub',right)+`<div class="main">${S.arcSub==='scrap'?scrap():wrong()}</div>`;
}
const kindL=x=>x.kind==='질문 내역'?'질문':'스크랩';
function scrap(){
 const F=[['전체',()=>true],['질문',x=>x.kind==='질문 내역'],['스크랩',x=>x.kind!=='질문 내역'],['태그',x=>x.tags.length]];
 const sort=S.scSort||'time';
 const bar=`<div style="display:flex;gap:8px;align-items:center">${F.map(([f,fn])=>`<button class="chip ${S.scF===f?'on':''}" data-a="scF" data-v="${f}">${f==='태그'?I.tagi+' ':''}${f} ${f==='태그'?TAGS.length:SCRAPS.filter(fn).length}</button>`).join('')}
   <span class="seg" style="margin-left:10px"><button class="${sort==='time'?'on':''}" data-a="scSort" data-v="time">시간순</button><button class="${sort==='subj'?'on':''}" data-a="scSort" data-v="subj">과목별</button></span>
   <span class="muted" style="margin-left:auto;font-size:11.5px">문항 · 성적 · 질문하기에서 저장한 문항이 한곳에 모여요</span></div>`;
 const byTime=(a,b)=>b.date.localeCompare(a.date);
 const row=x=>`<button class="wrow" data-a="scOpen" data-v="${x.id}"><i class="sd" style="background:${COL[x.s]}"></i><div style="flex:1;min-width:0"><h6>${x.t}</h6><p style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.sn)}</p></div>
     ${x.tags.length?`<span class="muted" style="font-size:11px">${x.tags.join(' ')}</span>`:''}<span class="tag ${kindL(x)==='질문'?'t-blue':'t-gray'}">${kindL(x)}</span><span class="muted" style="font-size:11px;width:60px;text-align:right">${x.date} 저장</span>${I.chev}</button>`;
 const two=(title,cnt,items,cur,act,lh,rh,list)=>`<div style="display:flex;gap:16px;flex:1;min-height:0">
   <div class="panel col" style="width:262px;flex:none;gap:0"><div class="ph"><h4>${lh}</h4><span class="muted" style="font-size:11px;margin-left:auto">${cnt}개</span></div>
    <div class="scroll" style="flex:1">${items}</div></div>
   <div class="panel col" style="flex:1;gap:0"><div class="ph"><h4>${rh}</h4><span class="muted" style="font-size:11.5px">${list.length}문항</span></div>
    <div class="scroll" style="flex:1">${list.map(row).join('')||'<p class="muted" style="padding:40px;text-align:center;font-size:13px">문항이 없어요</p>'}</div></div></div>`;
 if(S.scF==='태그'){if(!TAGS.includes(S.scTag))S.scTag=TAGS[0];
  let list=SCRAPS.filter(x=>x.tags.includes(S.scTag)).sort(byTime);if(sort==='subj')list.sort((a,b)=>SUBJ.indexOf(a.s)-SUBJ.indexOf(b.s));
  return `<div class="col" style="flex:1">${bar}${two('',TAGS.length,TAGS.map(t=>`<button class="lrow ${S.scTag===t?'on':''}" data-a="scTag" data-v="${t}">${I.tagi} ${t}<span class="r muted">${SCRAPS.filter(x=>x.tags.includes(t)).length}</span></button>`).join(''),0,0,'태그',S.scTag,list)}</div>`}
 const fn=F.find(f=>f[0]===S.scF)[1],all=SCRAPS.filter(fn).sort(byTime);
 if(sort==='subj'){const subs=SUBJ.filter(x=>all.some(y=>y.s===x));if(!subs.includes(S.scSubj))S.scSubj=subs[0];const list=all.filter(x=>x.s===S.scSubj);
  return `<div class="col" style="flex:1">${bar}${two('',subs.length,subs.map(x=>`<button class="lrow ${S.scSubj===x?'on':''}" data-a="scSubj" data-v="${x}"><i class="sd" style="background:${COL[x]}"></i> ${x}<span class="r muted">${all.filter(y=>y.s===x).length}</span></button>`).join(''),0,0,'과목',S.scSubj||'',list)}</div>`}
 return `<div class="col" style="flex:1">${bar}
  <div class="sgrid scroll" style="flex:1">${all.map(x=>`<button class="scard" data-a="scOpen" data-v="${x.id}">
   <div style="display:flex;gap:6px;align-items:center;font-size:10.5px"><i class="sd" style="background:${COL[x.s]}"></i>${x.s}<span class="tag ${kindL(x)==='질문'?'t-blue':'t-gray'}" style="margin-left:auto">${kindL(x)}</span></div>
   <h6>${x.t}</h6><p>${esc(x.sn)}</p>
   <div class="ft">${x.date} 저장${x.tags.length?`<span style="margin-left:8px;color:var(--sub)">${x.tags.join(' ')}</span>`:''}${x.folder?`<span style="margin-left:auto;display:flex;align-items:center;gap:3px">${I.folder}오답 정리</span>`:`<span style="margin-left:auto;color:var(--blue);font-weight:700">오답 정리에 추가 +</span>`}</div></button>`).join('')}</div></div>`;
}

  <div class="scroll" style="flex:1">${gs.map(g=>`<button class="lrow ${S.grp===g?'on':''}" data-a="grp" data-v="${g}">${S.sortBy==='folder'?`<i class="sd" style="background:${COL[g]}"></i>`:I.tagi} ${g}<span class="r muted">${SCRAPS.filter(x=>inGroup(x,g)).length}</span></button>`).join('')}
</div></div>
  <div class="panel col" style="flex:1;gap:0"><div class="ph"><h4>${S.grp}</h4><span class="muted" style="font-size:11.5px">${list.length}문항</span><div class="r"><span class="muted" style="font-size:11px;display:flex;gap:10px;align-items:center"><span><i class="sd" style="background:var(--green)"></i> 다시 풀어 맞힘</span><span><i class="sd" style="background:var(--red)"></i> 틀림</span></span></div></div>
  <div class="scroll" style="flex:1">${list.map(x=>`<button class="wrow" data-a="wdOpen" data-v="${x.id}"><i class="sd" style="background:${COL[x.s]}"></i><div style="flex:1;min-width:0"><h6>${x.t}</h6><p style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.sn)}</p></div>
   <span style="display:flex;gap:6px">${x.tags.map(t=>`<span class="tag t-gray">${t}</span>`).join('')}</span>
   <span style="width:110px;display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="hist">${x.hist.map(h=>`<i class="${h?'o':''}"></i>`).join('')}</span><span class="muted" style="font-size:10.5px">${x.hist.length}회 풀이 ${x.memo?'· 메모':''}</span></span>${I.chev}</button>`).join('')||'<p class="muted" style="padding:40px;text-align:center;font-size:13px">문항이 없어요. 스크랩에서 오답 정리에 추가해 보세요.</p>'}</div></div>`;
}

}
const popAr=d=>d==='up'?'<i style="color:var(--red)">▲</i>':d==='dn'?'<i style="color:#4a6bd8">▼</i>':'<i style="color:#aaa">-</i>';
function tickHTML(){const i=Math.floor((S.tick||0)/3)%POP.length,[t,,d]=POP[i];return `<b>${i+1}.</b> ${t} ${popAr(d)}`}

   ${P.s?`<div class="pcol">${cs.map(c=>`<button class="${P.c===c?'on':''}" data-a="pC" data-v="${c}">${c}</button>`).join('')}</div>`:''}

function askWrite(){
