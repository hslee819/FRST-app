l=\"검정\" aria-pressed=\"true\">\u003c/button>\u003cbutton class=\"color-button\" data-color=\"#456ee3\" style=\"--swatch:#456ee3\" aria-label=\"파랑\" aria-pressed=\"false\">\u003c/button>\u003cbutton class=\"color-button\" data-color=\"#4e9e68\" style=\"--swatch:#4e9e68\" aria-label=\"초록\" aria-pressed=\"false\">\u003c/button>\u003cbutton class=\"color-button\" data-color=\"#e25850\" style=\"--swatch:#e25850\" aria-label=\"빨강\" aria-pressed=\"false\">\u003c/button>\u003cbutton class=\"color-button\" data-color=\"#f0cd41\" style=\"--swatch:#f0cd41\" aria-label=\"노랑\" aria-pressed=\"false\">\u003c/button>\u003clabel class=\"custom-color\" title=\"색상 선택\">\u003cinput type=\"color\" id=\"custom-color\" value=\"#262928\" aria-label=\"사용자 지정 필기 색상\">\u003c/label>\u003c/div>\u003clabel class=\"pen-width\">\u003cspan>굵기\u003c/span>\u003cinput type=\"range\" id=\"pen-width\" min=\"1\" max=\"8\" value=\"3\" aria-label=\"펜 굵기\">\u003c/label>\u003cbutton class=\"tool-button\" id=\"clear-ink\" aria-label=\"이 페이지 필기 지우기\">\u003cspan data-icon=\"trash\">\u003c/span>\u003c/button>\u003c/div>\n  \u003caside id=\"toc-panel\" class=\"toc-panel\" hidden>\u003cdiv class=\"toc-heading\">\u003ch2>페이지 탐색\u003c/h2>\u003cbutton class=\"icon-button\" id=\"toc-close\" aria-label=\"목차 닫기\">\u003cspan data-icon=\"close\">\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"toc-tabs\">\u003cbutton data-toc=\"all\" class=\"active\" aria-pressed=\"true\">전체 페이지\u003c/button>\u003cbutton data-toc=\"bookmarks\" aria-pressed=\"false\">북마크\u003c/button>\u003c/div>\u003cdiv id=\"toc-list\">\u003c/div>\u003c/aside>\n  \u003cdiv class=\"reader-workspace\" id=\"reader-workspace\">\u003cdiv class=\"reading-stage\" id=\"reading-stage\">\u003cdiv class=\"paper-wrapper\" id=\"paper-wrapper\">\u003carticle id=\"paper\" class=\"paper\">\u003cdiv id=\"paper-content\">\u003c/div>\u003csvg id=\"ink-layer\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 1000\" aria-label=\"필기 영역\">\u003c/svg>\u003c/article>\u003c/div>\u003c/div>\u003caside id=\"question-panel\" class=\"question-panel\" hidden>\u003c/aside>\u003c/div>\n  \u003cdiv class=\"reader-bottom\">\u003cbutton class=\"button reader-page-button\" id=\"previous-page\">\u003cspan data-icon=\"chevron-left\">\u003c/span>이전\u003c/button>\u003cdiv class=\"reading-progress\">\u003cdiv>\u003cspan id=\"reader-progress-label\">읽는 중\u003c/span>\u003cspan id=\"reader-progress-value\">1 / 15\u003c/span>\u003c/div>\u003cprogress id=\"reader-progress\" max=\"15\" value=\"1\">\u003c/progress>\u003c/div>\u003cbutton class=\"button reader-page-button\" id=\"next-page\">다음\u003cspan data-icon=\"chevron-right\">\u003c/span>\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003cdialog id=\"mode-dialog\" class=\"dialog mode-dialog\" aria-labelledby=\"mode-title\">\u003cdiv class=\"dialog-header\">\u003cdiv>\u003cp class=\"eyebrow\">START LEARNING\u003c/p>\u003ch2 id=\"mode-title\">원하는 모드를 선택하세요\u003c/h2>\u003c/div>\u003cbutton class=\"icon-button\" data-close aria-label=\"닫기\">\u003cspan data-icon=\"close\">\u003c/span>\u003c/button>\u003c/div>\u003cp class=\"dialog-description\" id=\"mode-book-name\">\u003c/p>\u003cdiv class=\"mode-options\">\u003cbutton class=\"mode-option\" data-start-mode=\"study\">\u003cspan class=\"mode-option-icon\" data-icon=\"book\">\u003c/span>\u003cstrong>학습 모드\u003c/strong>\u003cp>문항 해설과 오답 복습,\u003cbr>TA 질문으로 이해를 완성해요.\u003c/p>\u003cspan>학습 시작\u003cspan data-icon=\"arrow-right\">\u003c/span>\u003c/span>\u003c/button>\u003cbutton class=\"mode-option dark\" data-start-mode=\"exam\">\u003cspan class=\"mode-option-icon\" data-icon=\"clock\">\u003c/span>\u003cstrong>시험 모드\u003c/strong>\u003cp>문제를 푸는 시간을 측정하고\u003cbr>종료 후 점수를 확인해요.\u003c/p>\u003cspan>시험 시작\u003cspan data-icon=\"arrow-right\">\u003c/span>\u003c/span>\u003c/button>\u003c/div>\u003clabel id=\"reset-progress-row\" class=\"checkbox-label\" hidden>\u003cinput type=\"checkbox\" id=\"reset-progress\">기존 풀이를 지우고 새로 시작하기\u003c/label>\u003cp class=\"muted-note\">예시 문항으로 구성된 학습 데모입니다.\u003c/p>\u003c/dialog>\n\u003cdialog id=\"page-dialog\" class=\"dialog small-dialog\" aria-labelledby=\"page-dialog-title\">\u003cform id=\"page-jump-form\">\u003cdiv class=\"dialog-header\">\u003ch2 id=\"page-dialog-title\">페이지 이동\u003c/h2>\u003cbutton type=\"button\" class=\"icon-button\" data-close aria-label=\"닫기\">\u003cspan data-icon=\"close\">\u003c/span>\u003c/button>\u003c/div>\u003clabel class=\"field\">이동할 페이지\u003cinput type=\"number\" min=\"1\" max=\"15\" id=\"page-number-input\" required>\u003c/label>\u003cbutton type=\"submit\" class=\"button primary full-width\">이동하기\u003cspan data-icon=\"arrow-right\">\u003c/span>\u003c/button>\u003c/form>\u003c/dialog>\n\u003cdialog id=\"omr-dialog\" class=\"dialog omr-dialog\" aria-labelledby=\"omr-title\">\u003cdiv class=\"dialog-header\">\u003cdiv>\u003cp class=\"eyebrow\">ANSWER SHEET\u003c/p>\u003ch2 id=\"omr-title\">답안지 \u003cspan>(OMR)\u003c/span>\u003c/h2>\u003c/div>\u003cbutton class=\"icon-button\" data-close aria-label=\"닫기\">\u003cspan data-icon=\"close\">\u003c/span>\u003c/button>\u003c/div>\u003cdiv id=\"omr-summary\" class=\"omr-summary\">\u003c/div>\u003cdiv id=\"omr-grid\" class=\"omr-grid\">\u003c/div>\u003cdiv class=\"omr-footer\">\u003cp>문항 번호를 누르면 해당 문항으로 이동합니다.\u003c/p>\u003cbutton id=\"omr-collect\" class=\"button secondary\" hidden>\u003cspan data-icon=\"lightning\">\u003c/span>틀린 문항 오답에 모으기\u003c/button>\u003c/div>\u003c/dialog>\n\u003cdialog id=\"finish-dialog\" class=\"dialog small-dialog\" aria-labelledby=\"finish-title\">\u003cdiv class=\"dialog-header\">\u003ch2 id=\"finish-title\">학습을 종료할까요?\u003c/h2>\u003cbutton class=\"icon-button\" data-close aria-label=\"닫기\">\u003cspan data-icon=\"close\">\u003c/span>\u003c/button>\u003c/div>\u003cp id=\"finish-description\" class=\"dialog-description\">\u003c/p>\u003cdiv class=\"dialog-actions\">\u003cbutton id=\"save-later\" class=\"button secondary\">나중에 이어서 풀기\u003c/button>\u003cbutton id=\"grade-button\" class=\"button primary\">채점하기\u003cspan data-icon=\"check\">\u003c/span>\u003c/button>\u003c/div>\u003c/dialog>\n\u003cdialog id=\"explanation-dialog\" class=\"dialog explanation-dialog\" aria-labelledby=\"explanation-title\">\u003cdiv class=\"dialog-header\">\u003cdiv>\u003cp class=\"eyebrow\">SOLUTION & REASONING\u003c/p>\u003ch2 id=\"explanation-title\">문항 해설\u003c/h2>\u003c/div>\u003cbutton class=\"icon-button\" data-close aria-label=\"닫기\">\u003cspan data-icon=\"close\">\u003c/span>\u003c/button>\u003c/div>\u003cdiv id=\"explanation-content\">\u003c/div>\u003cbutton id=\"explanation-collect\" class=\"button secondary\">\u003cspan data-icon=\"lightning\">\u003c/span>오답노트 만들기\u003c/button>\u003c/dialog>\n\u003cdialog id=\"reader-settings-dialog\" class=\"dialog settings-dialog\" aria-labelledby=\"reader-settings-title\">\u003cdiv class=\"dialog-header\">\u003ch2 id=\"reader-settings-title\">보기 설정\u003c/h2>\u003cbutton class=\"icon-button\" data-close aria-label=\"닫기\">\u003cspan data-icon=\"close\">\u003c/span>\u003c/button>\u003c/div>\u003clabel class=\"field\">페이지 확대\u003cselect id=\"zoom-select\">\u003coption value=\"fit\">화면에 맞춤\u003c/option>\u003coption value=\"100\">100%\u003c/option>\u003coption value=\"125\">125%\u003c/option>\u003coption value=\"150\">150%\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"field\">페이지 배경\u003cselect id=\"paper-theme\">\u003coption value=\"white\">화이트\u003c/option>\u003coption value=\"sepia\">편안한 종이색\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"field\">지문 영역 너비\u003cinput type=\"range\" id=\"split-width\" min=\"35\" max=\"65\" value=\"50\">\u003c/label>\u003cp class=\"muted-note\">읽기 도구에서 ← → 키로 이동할 수 있어요.\u003cbr>펜과 형광펜은 마우스·터치·펜 입력을 지원해요.\u003c/p>\u003c/dialog>\n\u003cdialog id=\"settings-dialog\" class=\"dialog settings-dialog\" aria-labelledby=\"settings-title\">\u003cdiv class=\"dialog-header\">\u003cdiv>\u003cp class=\"eyebrow\">YOUR WORKSPACE\u003c/p>\u003ch2 id=\"settings-title\">내 서재 설정\u003c/h2>\u003c/div>\u003cbutton class=\"icon-button\" data-close aria-label=\"닫기\">\u003cspan data-icon=\"close\">\u003c/span>\u003c/button>\u003c/div>\u003clabel class=\"field\">표시 이름\u003cinput id=\"profile-name\" maxlength=\"20\" placeholder=\"나의 서재\">\u003c/label>\u003cbutton id=\"profile-save\" class=\"button primary full-width\">저장하기\u003c/button>\u003cdiv class=\"settings-info\">\u003cspan data-icon=\"lock\">\u003c/span>\u003cp>즐겨찾기, 읽던 페이지, 필기와 오답은 이 브라우저에 저장됩니다.\u003c/p>\u003c/div>\u003cp class=\"muted-note\">캡처 화면을 참고해 구현한 데모 앱입니다.\u003cbr>실제 교재 본문, 회원 계정, 성적 서버와 연결되어 있지 않습니다.\u003c/p>\u003c/dialog>\n\u003cdialog id=\"book-menu-dialog\" class=\"dialog book-menu-dialog\" aria-labelledby=\"book-menu-title\">\u003cdiv class=\"dialog-header\">\u003ch2 id=\"book-menu-title\">콘텐츠 관리\u003c/h2>\u003cbutton class=\"icon-button\" data-close aria-label=\"닫기\">\u003cspan data-icon=\"close\">\u003c/span>\u003c/button>\u003c/div>\u003cdiv id=\"book-menu-actions\">\u003c/div>\u003c/dialog>\n\u003cdialog id=\"notification-dialog\" class=\"dialog notification-dialog\" aria-labelledby=\"notification-title\">\u003cdiv class=\"dialog-header\">\u003cdiv>\u003cp class=\"eyebrow\">LIBRARY UPDATES\u003c/p>\u003ch2 id=\"notification-title\">알림\u003c/h2>\u003c/div>\u003cbutton class=\"icon-button\" data-close aria-label=\"닫기\">\u003cspan data-icon=\"close\">\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"notice-item\">\u003ci>\u003c/i>\u003cdiv>\u003cstrong>11월 콘텐츠가 준비되었어요\u003c/strong>\u003cp>서바이벌 18회 · 엑셀러레이터 29회\u003c/p>\u003csmall>2026.11.02 · 예시 알림\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"notice-item\">\u003ci>\u003c/i>\u003cdiv>\u003cstrong>항해일지, 새로운 항해의 시작\u003c/strong>\u003cp>항해일지에서 학습 경험과 이야기를 만나보세요.\u003c/p>\u003csmall>2026.09.14 · 예시 알림\u003c/small>\u003c/div>\u003c/div>\u003c/dialog>\n\u003cdialog id=\"info-dialog\" class=\"dialog small-dialog\" aria-labelledby=\"info-title\">\u003cdiv class=\"dialog-header\">\u003ch2 id=\"info-title\">콘텐츠 안내\u003c/h2>\u003cbutton class=\"icon-button\" data-close aria-label=\"닫기\">\u003cspan data-icon=\"close\">\u003c/span>\u003c/button>\u003c/div>\u003cp class=\"dialog-description\">이 앱은 제공된 캡처를 바탕으로 화면과 학습 흐름을 구현한 데모입니다. 본문·문항·정답은 예시이며 실제 교재 및 성적 자료가 아닙니다.\u003c/p>\u003cp class=\"muted-note\">학습 모드에서는 정답과 해설을 바로 확인하고,\u003cbr>시험 모드에서는 종료 후 채점할 수 있어요.\u003c/p>\u003c/dialog>\n\u003cdialog id=\"clear-dialog\" class=\"dialog small-dialog\" aria-labelledby=\"clear-title\">\u003cdiv class=\"dialog-header\">\u003ch2 id=\"clear-title\">이 페이지의 필기를 지울까요?\u003c/h2>\u003cbutton class=\"icon-button\" data-close aria-label=\"닫기\">\u003cspan data-icon=\"close\">\u003c/span>\u003c/button>\u003c/div>\u003cp class=\"dialog-description\">다른 페이지의 필기는 유지됩니다.\u003c/p>\u003cdiv class=\"dialog-actions\">\u003cbutton class=\"button secondary\" data-close>취소\u003c/button>\u003cbutton class=\"button primary\" id=\"confirm-clear\">필기 지우기\u003c/button>\u003c/div>\u003c/dialog>\n\n\u003cdialog id=\"proposal-dialog\" class=\"dialog proposal-dialog\" aria-labelledby=\"proposal-title\">\u003cdiv class=\"proposal-header\">\u003cdiv>\u003cp class=\"eyebrow\">E-BOOK EXPERIENCE PROPOSAL\u003c/p>\u003ch2 id=\"proposal-title\">학습을 이어주는\u003cbr>더 직관적인 eBook 경험.\u003c/h2>\u003cp>제공해 주신 UX 개선 기획안\u003c/p>\u003c/div>\u003cbutton class=\"icon-button\" data-close aria-label=\"기획안 닫기\">\u003cspan data-icon=\"close\">\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"proposal-content\">\u003cp class=\"proposal-intro\">콘텐츠 탐색에서 문제 풀이, 오답 복습과 다음 학습의 설계까지. 학습자가 필요한 행동에 더 쉽게 도달하도록 흐름을 연결합니다.\u003c/p>\u003csection class=\"proposal-section\">\u003cspan class=\"proposal-number\">01\u003c/span>\u003cdiv>\u003ch3>첫 화면을 학습의 시작점으로\u003c/h3>\u003cdiv class=\"proposal-tags\">\u003cspan>#콘텐츠보기\u003c/span>\u003cspan>#검색\u003c/span>\u003c/div>\u003ch4>현재 문제\u003c/h4>\u003cp>첫 화면에 문항·학습과 직접적인 관련이 적은 항해일지를 제공하고 있습니다. 회차별·파트별 단순 나열로 보고 싶은 콘텐츠만 선별하기도 어렵습니다.\u003c/p>\u003ch4>개선 방안\u003c/h4>\u003cul>\u003cli>\u003cstrong>첫 화면에 플래시카드 팝업\u003c/strong>을 노출하여 본인의 오답을 우선 확인하고 복습하도록 유도합니다.\u003c/li>\u003cli>항해일지는 \u003cstrong>회차를 먼저 선택하고, 회차 안에서 파트를 선택\u003c/strong>하는 구조로 탐색을 단순화합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"proposal-flow\">\u003cspan>오답 먼저 복습\u003c/span>\u003cb>→\u003c/b>\u003cspan>학습 콘텐츠 선택\u003c/span>\u003cb>→\u003c/b>\u003cspan>필요한 파트 열람\u003c/span>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"proposal-section\">\u003cspan class=\"proposal-number\">02\u003c/span>\u003cdiv>\u003ch3>이름만 보고도 이해되는 메뉴\u003c/h3>\u003cp>‘시그니처’의 콘텐츠 범주와 ‘시대 하나씩’의 학습 기능이 명확하지 않고, 해설만 수록된 ‘시대 콘텐츠’ 때문에 원문을 다시 찾아야 합니다.\u003c/p>\u003cdiv class=\"proposal-naming\">\u003cdiv>\u003cspan>시그니처\u003c/span>\u003cb>→\u003c/b>\u003cstrong>별도 콘텐츠명으로 표기\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>시대 하나씩\u003c/span>\u003cb>→\u003c/b>\u003cstrong>학습 모드\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>시대 콘텐츠\u003c/span>\u003cb>→\u003c/b>\u003cstrong>해설지\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"proposal-caption\">상위 메뉴에서 실제 학습 기능과 자료의 성격을 바로 인지할 수 있도록 합니다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"proposal-section\">\u003cspan class=\"proposal-number\">03\u003c/span>\u003cdiv>\u003ch3>sdij 서랍장과 학습을 연결\u003c/h3>\u003cp>eBook에서 학습한 뒤, 서랍장에서 자신의 위치를 파악하고 다음 학습 방향을 설계할 수 있도록 연결합니다.\u003c/p>\u003ch4>개선 방안\u003c/h4>\u003cp>학습 모드의 \u003cstrong>OMR 상단에 서랍장 정보를 통합\u003c/strong>하고 전체 재원생 데이터 일부와 선지별 선택 비율을 보여줍니다.\u003c/p>\u003cdiv class=\"proposal-stat-summary\">\u003cdiv>\u003cstrong>6,783\u003cspan>명\u003c/span>\u003c/strong>\u003csmall>90일 누적 활성 사용자\u003c/small>\u003c/div>\u003cdiv>\u003cstrong>4,121,327\u003cspan>회\u003c/span>\u003c/strong>\u003csmall>전체 조회수\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"proposal-metrics\">\u003cdiv>\u003cspan>리포트 서랍장 탭\u003c/span>\u003cstrong>90.52%\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>성적 추이 그래프\u003c/span>\u003cstrong>72.65%\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>부엉이 분석실 탭\u003c/span>\u003cstrong>84.48%\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>답안 입력\u003c/span>\u003cstrong>51.63%\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>성적 확인 팝업\u003c/span>\u003cstrong>57.47%\u003c/strong>\u003c/div>\u003cdiv>\u003cspan>성적 입력 팝업\u003c/span>\u003cstrong>58.22%\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"proposal-caption\">기획안 제공 수치 · 출처: 앱 사용 통계 리포트(GA 90일 화면별 조회수). 이 데모의 실제 이용 통계가 아닙니다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"proposal-section\">\u003cspan class=\"proposal-number\">04\u003c/span>\u003cdiv>\u003ch3>막힌 문항에서 바로 TA로\u003c/h3>\u003cdiv class=\"proposal-tags\">\u003cspan>#질문\u003c/span>\u003c/div>\u003cp>오답 확인과 기본 해설 이후에도 남는 질문을 즉시 해결하도록 \u003cstrong>해당 문항에서 TA 앱으로 이동하는 바로가기\u003c/strong>를 제공합니다.\u003c/p>\u003cdiv class=\"proposal-flow\">\u003cspan>오답 확인\u003c/span>\u003cb>→\u003c/b>\u003cspan>해설 이해\u003c/span>\u003cb>→\u003c/b>\u003cspan>TA 추가 질문\u003c/span>\u003c/div>\u003c/div>\u003c/section>\u003cdiv class=\"proposal-end\">\u003cspan data-icon=\"document\">\u003c/span>\u003cp>기존 앱의 톤과 배치를 유지하며 용어 구분, 오답 복습, 문항 해설과 TA 연결을 반영했습니다.\u003c/p>\u003c/div>\u003c/div>\u003c/dialog>\n\u003cdiv id=\"toast\" class=\"toast\" role=\"status\" aria-live=\"polite\" hidden>\u003c/div>\n\u003cscript type=\"application/json\" id=\"ebook-linked-apps\">{\"ta\":\"\\u003c!doctype html>\\n\\u003chtml lang=\\\"ko\\\">\\n\\u003chead>\\n\\u003cmeta charset=\\\"utf-8\\\">\\n\\u003cmeta name=\\\"viewport\\\" content=\\\"width=device-width,initial-scale=1\\\">\\n\\u003ctitle>시대인재 TA · 리뉴얼 UI\\u003c/title>\\n\\u003cstyle>\\n:root{color-scheme:light;--ink:#161616;--muted:#858585;--line:#dedede;--soft:#f7f7f7;--accent:#5d69be}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:\\\"Malgun Gothic\\\",\\\"Apple SD Gothic Neo\\\",Arial,sans-serif;font-size:15px}button,input,textarea,select{font:inherit}button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit}button:disabled{cursor:not-allowed;color:#aaa}button:focus-visible,a:focus-visible,input:focus-visib \\\" id=\\\"image-input\\\" accept=\\\"image/*\\\" multiple hidden>\\n\\u003cinput type=\\\"file\\\" id=\\\"problem-photo-input\\\" accept=\\\"image/png,image/jpeg,image/webp\\\" hidden>\\n\\u003cdiv class=\\\"toast\\\" id=\\\"toast\\\" role=\\\"status\\\" hidden>\\u003c/div>\\n\\u003cscript>\\n(() => {\\n  'use strict';\\n\\n  const STORAGE_KEY = 'ta-review-cards-v1';\\n  const esc = value => String(value ?? '').replace(/[&\\u003c>\\\"']/g, character => ({\\n    '&': '&amp;', '\\u003c': '&lt;', '>': '&gt;', '\\\"': '&quot;', \\\"'\\\": '&#39;',\\n  }[character]));\\n  const localDate = () => {\\n    const now = new Date();\\n    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;\\n  };\\n  const freshState = () => ({ date: localDate(), currentId: '', flipped: false, reviewed: [] });\\n  let state = freshState();\\n  let notice = '';\\n  let lastMembership = '';\\n\\n  try {\\n    const raw = globalThis.localStorage.getItem(STORAGE_KEY);\\n    if (raw) {\\n      const value = JSON.parse(raw);\\n      if (!value || typeof value.date !== 'string' || !Array.isArray(value.reviewed)) {\\n        throw new Error('Invalid saved review state');\\n      }\\n      if (value.date === localDate()) {\\n        state = {\\n          date: value.date,\\n          currentId: typeof value.currentId === 'string' ? value.currentId : '',\\n          flipped: value.flipped === true,\\n          reviewed: [...new Set(value.reviewed.filter(id => typeof id === 'string'))],\\n        };\\n      }\\n    }\\n  } catch {\\n    notice = '복습 기록을 불러오지 못했어요. 현재 화면에서 카드를 이어서 볼 수 있어요.';\\n  }\\n\\n  function persist() {\\n    try {\\n      globalThis.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));\\n      notice = '';\\n      return true;\\n    } catch {\\n      notice = '현재 화면에는 반영했지만 복습 기록을 저장하지 못했어요. 새로고침하면 사라질 수 있어요.';\\n      return false;\\n    }\\n  }\\n\\n  function prepare(items) {\\n    const ids = new Set();\\n    const cards = (Array.isArray(items) ? items : []).filter(item => {\\n      if (!item || typeof item.id !== 'string' || !item.id || ids.has(item.id)) return false;\\n      ids.add(item.id);\\n      return true;\\n    });\\n    if (state.date !== localDate()) state = freshState();\\n    state.reviewed = state.reviewed.filter(id => ids.has(id));\\n    const membership = JSON.stringify(cards.map(item => item.id));\\n    const pending = cards.find(item => !state.reviewed.includes(item.id));\\n    if (!ids.has(state.currentId) || (membership !== lastMembership && pending && state.reviewed.includes(state.currentId))) {\\n      state.currentId = (cards.find(item => !state.reviewed.includes(item.id)) || cards[0])?.id || '';\\n      state.flipped = false;\\n    }\\n    lastMembership = membership;\\n    return cards;\\n  }\\n\\n  function source(item) {\\n    return [item.subject, item.book, item.round != null ? `${item.round}회` : '', item.number != null ? `${item.number}번` : '']\\n      .filter(Boolean).map(esc).join(' · ');\\n  }\\n\\n  function tags(item) {\\n    const values = Array.isArray(item.tags) ? item.tags.filter(tag => typeof tag === 'string').slice(0, 5) : [];\\n    return values.length ? `\\u003cdiv class=\\\"review-card-tags\\\">${values.map(tag => `\\u003cspan>#${esc(tag.replace(/^#+/, ''))}\\u003c/span>`).join('')}\\u003c/div>` : '';\\n  }\\n\\n  const bookmarkIcon = '\\u003csvg viewBox=\\\"0 0 24 24\\\" aria-hidden=\\\"true\\\">\\u003cpath d=\\\"M6 3h12v18l-6-4-6 4V3Z\\\"/>\\u003c/svg>';\\n  const checkIcon = '\\u003csvg viewBox=\\\"0 0 24 24\\\" aria-hidden=\\\"true\\\">\\u003cpath d=\\\"m5 12 4 4L20 5\\\"/>\\u003c/svg>';\\n  const leftIcon = '\\u003csvg viewBox=\\\"0 0 24 24\\\" aria-hidden=\\\"true\\\">\\u003cpath d=\\\"m14 6-6 6 6 6\\\"/>\\u003c/svg>';\\n  const rightIcon = '\\u003csvg viewBox=\\\"0 0 24 24\\\" aria-hidden=\\\"true\\\">\\u003cpath d=\\\"m10 6 6 6-6 6\\\"/>\\u003c/svg>';\\n  const flipIcon = '\\u003csvg viewBox=\\\"0 0 24 24\\\" aria-hidden=\\\"true\\\">\\u003cpath d=\\\"M4 10a8 8 0 0 1 13-5l3 4m0-5v5h-5M20 14a8 8 0 0 1-13 5l-3-4m0 5v-5h5\\\"/>\\u003c/svg>';\\n\\n  function render(items) {\\n    const cards = prepare(items);\\n    const completed = state.reviewed.length;\\n    const remaining = cards.length - completed;\\n    const heading = `\\u003cdiv class=\\\"review-cards-heading\\\">\\u003cdiv>\\u003ch2>${bookmarkIcon}북마크 복습\\u003c/h2>\\u003cp>저장해 둔 질문을 한 장씩 꺼내 보세요.\\u003c/p>\\u003c/div>\\u003cspan class=\\\"review-cards-count\\\">${cards.length ? `오늘 ${completed} / ${cards.length}개 완료` : '북마크한 질문이 자동으로 모여요'}\\u003c/span>\\u003c/div>`;\\n    const storageNotice = notice ? `\\u003cp class=\\\"review-cards-notice\\\" role=\\\"status\\\">${esc(notice)}\\u003c/p>` : '';\\n\\n    if (!cards.length) {\\n      return `\\u003csection class=\\\"review-cards\\\" aria-label=\\\"북마크 복습 카드\\\">${heading}\\u003cdiv class=\\\"review-cards-empty\\\">\\u003cspan class=\\\"review-cards-empty-icon\\\">${bookmarkIcon}\\u003c/span>\\u003cdiv>\\u003cstrong>다시 보고 싶은 답변을 북마크해 보세요.\\u003c/strong>\\u003cp>북마크하면 이곳에 복습 카드가 자동으로 나타나요.\\u003c/p>\\u003c/div>\\u003cbutton class=\\\"outline\\\" data-action=\\\"nav\\\" data-id=\\\"search\\\">문항 검색\\u003c/button>\\u003c/div>${storageNotice}\\u003c/section>`;\\n    }\\n\\n    if (!remaining) {\\n      return `\\u003csection class=\\\"review-cards\\\" aria-label=\\\"북마크 복습 카드\\\">${heading}\\u003cdiv class=\\\"review-cards-complete\\\" aria-live=\\\"polite\\\">\\u003cspan class=\\\"review-cards-complete-icon\\\">${checkIcon}\\u003c/span>\\u003cdiv>\\u003ch3>오늘의 북마크 복습을 마쳤어요.\\u003c/h3>\\u003cp>${cards.length}개의 질문을 다시 살펴봤어요. 언제든 한 번 더 복습할 수 있어요.\\u003c/p>\\u003c/div>\\u003cbutton class=\\\"outline\\\" data-action=\\\"review-restart\\\">다시 복습\\u003c/button>\\u003c/div>${storageNotice}\\u003c/section>`;\\n    }\\n\\n    const index = cards.findIndex(item => item.id === state.currentId);\\n    const item = cards[index];\\n    const isDone = state.reviewed.includes(item.id);\\n    const headingText = typeof item.questionSummary === 'string' ? item.questionSummary : '';\\n    const answerText = typeof item.answerSummary === 'string' ? item.answerSummary : '';\\n    return `\\u003csection class=\\\"review-cards\\\" aria-label=\\\"북마크 복습 카드\\\">${heading}\\u003carticle class=\\\"review-flashcard ${state.flipped ? 'is-flipped' : ''}\\\">\\u003cdiv class=\\\"review-card-top\\\">\\u003cspan>${source(item)}\\u003c/span>\\u003cspan class=\\\"review-card-position\\\">${index + 1} / ${cards.length}\\u003c/span>\\u003c/div>\\u003cdiv class=\\\"review-card-body\\\" id=\\\"review-card-body\\\" aria-live=\\\"polite\\\" aria-atomic=\\\"true\\\">\\u003cspan class=\\\"review-card-side\\\">${state.flipped ? '답변 요약' : '이 질문, 다시 생각해 볼까요?'}\\u003c/span>\\u003ch3>${esc(headingText)}\\u003c/h3>${tags(item)}${state.flipped ? `\\u003cp class=\\\"review-card-answer\\\">${esc(answerText)}\\u003c/p>` : '\\u003cp class=\\\"review-card-hint\\\">답변을 보기 전에, 기억나는 내용을 먼저 떠올려 보세요.\\u003c/p>'}\\u003c/div>\\u003cdiv class=\\\"review-card-actions\\\">\\u003cbutton class=\\\"review-card-flip\\\" data-action=\\\"review-flip\\\" data-id=\\\"${esc(item.id)}\\\" aria-controls=\\\"review-card-body\\\" aria-expanded=\\\"${state.flipped}\\\">${flipIcon}${state.flipped ? '질문 다시 보기' : '답변 보기'}\\u003c/button>${state.flipped ? `\\u003cbutton class=\\\"review-card-done\\\" data-action=\\\"review-done\\\" data-id=\\\"${esc(item.id)}\\\" ${isDone ? 'disabled' : ''}>${checkIcon}${isDone ? '오늘 복습 완료' : '오늘 복습 완료'}\\u003c/button>` : ''}\\u003c/div>\\u003cdiv class=\\\"review-card-footer\\\">\\u003cbutton class=\\\"review-card-original\\\" data-action=\\\"answer\\\" data-id=\\\"${esc(item.id)}\\\">질문·답변 원문 보기 \\u003cspan aria-hidden=\\\"true\\\">↗\\u003c/span>\\u003c/button>\\u003cdiv class=\\\"review-card-paging\\\">\\u003cspan>${remaining}개 남음\\u003c/span>\\u003cbutton class=\\\"review-card-arrow\\\" data-action=\\\"review-prev\\\" data-id=\\\"${esc(item.id)}\\\" aria-label=\\\"이전 복습 카드\\\" ${cards.length \\u003c 2 ? 'disabled' : ''}>${leftIcon}\\u003c/button>\\u003cbutton class=\\\"review-card-arrow\\\" data-action=\\\"review-next\\\" data-id=\\\"${esc(item.id)}\\\" aria-label=\\\"다음 복습 카드\\\" ${cards.length \\u003c 2 ? 'disabled' : ''}>${rightIcon}\\u003c/button>\\u003c/div>\\u003c/div>\\u003c/article>${storageNotice}\\u003c/section>`;\\n  }\\n\\n  function handle(action, id, items) {\\n    if (!['review-flip', 'review-next', 'review-prev', 'review-done', 'review-restart'].includes(action)) return false;\\n    const cards = prepare(items);\\n    if (!cards.length) return true;\\n    const currentIndex = cards.findIndex(item => item.id === state.currentId);\\n    if (id && id !== state.currentId) return true;\\n\\n    if (action === 'review-restart') {\\n      state.reviewed = [];\\n      state.currentId = cards[0].id;\\n      state.flipped = false;\\n    } else if (action === 'review-flip') {\\n      state.flipped = !state.flipped;\\n    } else if (action === 'review-next' || action === 'review-prev') {\\n      const offset = action === 'review-next' ? 1 : -1;\\n      state.currentId = cards[(currentIndex + offset + cards.length) % cards.length].id;\\n      state.flipped = false;\\n    } else if (action === 'review-done') {\\n      // The answer must be visible before a card can be marked reviewed.\\n      if (!state.flipped) return true;\\n      if (!state.reviewed.includes(state.currentId)) state.reviewed.push(state.currentId);\\n      for (let offset = 1; offset \\u003c= cards.length; offset++) {\\n        const candidate = cards[(currentIndex + offset) % cards.length];\\n        if (!state.reviewed.includes(candidate.id)) {\\n          state.currentId = candidate.id;\\n          break;\\n        }\\n      }\\n      state.flipped = false;\\n    }\\n    persist();\\n    return true;\\n  }\\n\\n  globalThis.TAReviewCards = Object.freeze({ render, handle });\\n})();\\n\\n\\u003c/script>\\n\\u003cscript>\\n(() => {\\n  'use strict';\\n  const $ = (s, r = document) => r.querySelector(s);\\n  const safe = value => String(value ?? '').replace(/[&\\u003c>\\\"']/g, c => ({'&':'&amp;','\\u003c':'&lt;','>':'&gt;','\\\"':'&quot;',\\\"'\\\":'&#39;'}[c]));\\n  const paths = {menu:'\\u003cpath d=\\\"M4 6h16M4 12h16M4 18h16\\\"/>',search:'\\u003ccircle cx=\\\"10.5\\\" cy=\\\"10.5\\\" r=\\\"6.5\\\"/>\\u003cpath d=\\\"m16 16 5 5\\\"/>',question:'\\u003ccircle cx=\\\"12\\\" cy=\\\"12\\\" r=\\\"9\\\"/>\\u003cpath d=\\\"M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5m0 3v.1\\\"/>',users:'\\u003ccircle cx=\\\"9\\\" cy=\\\"7\\\" r=\\\"3\\\"/>\\u003cpath d=\\\"M3 20v-3a6 6 0 0 1 12 0v3m1-16a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5\\\"/>',book:'\\u003cpath d=\\\"M5 3h14v18l-7-5-7 5z\\\"/>',back:'\\u003cpath d=\\\"m13 5-7 7 7 7M6 12h15\\\"/>',bell:'\\u003cpath d=\\\"M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4\\\"/>',camera:'\\u003cpath d=\\\"M3 7h4l2-3h6l2 3h4v14H3z\\\"/>\\u003ccircle cx=\\\"12\\\" cy=\\\"13\\\" r=\\\"4\\\"/>',right:'\\u003cpath d=\\\"M4 12h16m-6-6 6 6-6 6\\\"/>',calendar:'\\u003crect x=\\\"3\\\" y=\\\"5\\\" width=\\\"18\\\" height=\\\"16\\\" rx=\\\"2\\\"/>\\u003cpath d=\\\"M7 2v6m10-6v6M3 11h18\\\"/>',close:'\\u003cpath d=\\\"m6 6 12 12M6 18 18 6\\\"/>'};\\n  const icon = name => `\\u003csvg viewBox=\\\"0 0 24 24\\\" aria-hidden=\\\"true\\\">${paths[name] || paths.question}\\u003c/svg>`;\\n  const storageKey = 'ta-original-demo-v1';\\n  let saved = {bookmarks:['korean17-1'],questions:[],ratings:{}};\\n  try { const value = JSON.parse(localStorage.getItem(storageKey) || 'null'); if (value && Array.isArray(value.bookmarks) && Array.isArray(value.questions)) { saved = {bookmarks:value.bookmarks.filter(x=>typeof x==='string'),questions:value.questions.filter(x=>x && typeof x.id==='string' && typeof x.text==='string' && typeof x.created==='string' && x.source && typeof x.source.subject==='string' && typeof x.source.book==='string' && Number.isInteger(x.source.round) && Number.isInteger(x.source.number)).map(x=>({...x,images:Array.isArra 분합니다. 본인에게 익숙한 표시를 정해 제한된 시간 안에서 반복해 보세요.',tag:'독서',teacher:'여주희 · 국어 TA'},\\n    {id:'korean8-1',subject:'국어',book:'서바이벌프로',round:8,number:2,name:'이승민',date:'2026.10.14',count:17,question:'실모 국어 비문학 오답 방법이 궁금합니다.\\\\n그냥 다시 읽고 풀어서 오답하고 있는데 다시 읽으면 당연히 잘 읽히고 이렇게 오답하는 게 맞나 싶습니다.',answer:'안녕하세요. 이승민 TA입니다.\\\\n비문학 오답은 크게 두 가지 측면에서 피드백하시는 것을 추천드립니다.\\\\n\\\\n첫 번째는 ‘지문을 읽는 태도’에 대한 피드백입니다. 문제를 왜 틀렸는지, 그리고 지문을 어떻게 읽었다면 틀리지 않을 수 있었는지를 스스로 생각해 보는 과정입니다. A와 B의 차이점을 파악하지 못했다면, 두 대상의 차이점을 확인하고 넘어가겠다는 피드백을 할 수 있습니다.\\\\n\\\\n두 번째는 ‘문제를 푸는 태도’에 대한 피드백입니다. 선지를 읽을 때 자의적인 해석이 들어가지는 않았는지, 보기에 제시된 조건을 놓치지는 않았는지 등을 분석하시면 됩니다.\\\\n\\\\n이런 방법으로 피드백하다 보면 자주 하는 실수나 취약한 영역이 보이고, 그 약점을 보완하면 국어 실력이 향상될 가능성이 높습니다.\\\\n\\\\n추가적인 질문 있으시면 언제든지 남겨주세요!',tag:'문제 해결',teacher:'이승민 · 연세대학교 첨단컴퓨팅학부'},\\n    {id:'korean8-2',subject:'국어',book:'서바이벌프로',round:8,number:2,name:'김채은',date:'2026.10.23',count:8,question:'비문학을 읽을 때 내용은 알겠는데 문제로 넘어가면 근거가 기억나지 않아요. 지문을 여러 번 돌아보게 됩니다.',answer:'안녕하세요. 김채은 TA입니다.\\\\n\\\\n문단을 읽고 모든 정보를 암기하기보다는, 각 문단이 어떤 역할을 하는지 생각해 보세요. 개념을 소개하는지, 사례로 설명하는지, 두 견해를 비교하는지 정도를 파악하면 됩니다.\\\\n\\\\n문제를 읽고 필요한 정보가 어느 문단에 있는지 찾아갈 수 있으면 충분합니다. 돌아가서 확인하는 과정 자체를 줄이려고 하기보다는, 필요한 위치를 정확히 찾는 데 집중해 주세요.',tag:'독서',teacher:'김채은 · 국어 TA'},\\n    {id:'math10-1',subject:'수학',book:'월례고사',round:10,number:21,name:'박준영',date:'2026.10.29',count:10,question:'함수의 조건을 식으로 옮기는 부분이 어렵습니다. 그래프로 먼저 해석해도 괜찮을까요?',answer:'안녕하세요. 박준영 TA입니다.\\\\n\\\\n조건이 기울기나 교점에 관한 정보라면 간단한 그래프로 관계를 먼저 확인하는 것이 도움이 됩니다. 다만 그림에서 추측한 성질을 결론으로 사용하려면 주어진 조건과 식으로 다시 확인해 주세요.\\\\n\\\\n조건을 하나씩 옮겨 적고, 각각이 그래프의 어느 특징을 뜻하는지 연결해서 살펴보세요.',tag:'함수',teacher:'박준영 · 수학 TA'},\\n    {id:'physics17-1',subject:'물리학Ⅱ',book:'서바이벌',round:17,number:9,name:'정유진',date:'2026.11.01',count:6,question:'힘의 방향을 설정할 때 부호가 자꾸 헷갈립니다. 기준 방향은 어떻게 정해야 하나요?',answer:'안녕하세요. 정유진 TA입니다.\\\\n\\\\n기준 방향은 편한 쪽으로 정하되, 식을 세우는 동안 일관되게 유지해 주세요. 먼저 좌표축과 양의 방향을 표시하고, 각 힘을 축에 따라 분해한 뒤 부호를 붙이는 순서로 풀어 보세요.\\\\n\\\\n계산 결과가 음수라면 처음 정한 양의 방향과 반대라는 의미로 해석할 수 있습니다.',tag:'개념 설명',teacher:'정유진 · 과학 uestion-category-filter\\\" role=\\\"group\\\" aria-label=\\\"질문 분류\\\">${[['problem','문항 풀이·개념'],['study','학습 상담·기타']].map(([category,label])=>`\\u003cbutton class=\\\"category-button ${state.questionsCategory===category?'active':''}\\\" data-action=\\\"question-category\\\" data-category=\\\"${category}\\\" aria-pressed=\\\"${state.questionsCategory===category}\\\">${label}\\u003cspan>${count(category)}\\u003c/span>\\u003c/button>`).join('')}\\u003c/div>\\u003cp class=\\\"category-note\\\">문항 풀이와 개념 질문을 먼저 보여드려요. 공부 방법이나 개인적인 고민은 ‘학습 상담·기타’에서 확인하세요.\\u003c/p>${shown.length?`\\u003cdiv class=\\\"result-grid question-list\\\">${shown.map(x=>card(x)).join('')}\\u003c/div>`:`\\u003cdiv class=\\\"category-empty\\\">\\u003cstrong>${emptyTitle}\\u003c/strong>\\u003cp>${state.questionsCategory==='problem'&&count('study')?'학습 상담·기타에 '+count('study')+'개의 질문이 따로 모여 있어요.':'궁금한 내용은 아래에서 질문해 주세요.'}\\u003c/p>${state.questionsCategory==='problem'&&count('study')?'\\u003cbutton class=\\\"text-button\\\" data-action=\\\"question-category\\\" data-category=\\\"study\\\">학습 상담·기타 보기 →\\u003c/button>':''}\\u003c/div>`}\\u003c/section>`;\\n  }\\n  function contentRounds(content){\\n    if(content==='서바이벌')return [16,17,18];\\n    if(content==='월례고사')return [9,10,11];\\n    const rounds=Array.from({length:18},(_,i)=>i+1);\\n    return content==='엑셀러레이터'?rounds.concat([27,28,29]):rounds;\\n  }\\n  function readQuestionDeepLink(search){\\n    const params=new URLSearchParams(search),names=['subject','content','round','number'];\\n    if(!names.every(name=>params.getAll(name).length===1)||params.getAll('view').length>1)return null;\\n    const subject=params.get('subject'),content=params.get('content'),roundText=params.get('round'),numberText=params.get('number'),view=params.get('view')||'question';\\n    if(!subjects.includes(subject)||!books[subject].includes(content)||!['question','answers'].includes(view)||!/^\\\\d{1,2}$/.test(roundText)||!/^\\\\d{1,2}$/.test(numberText))return null;\\n    const round=Number(roundText),number=Number(numberText),maxNumber=['국어','영어'].includes(subject)?45:subject==='수학'?30:20;\\n    // 콘텐츠 서랍장 리포트에만 있는 회차는 링크로 들어올 때만 허용한다.\\n    const linkOnlyRounds={'수학|서바이벌':[23,24]};\\n    const rounds=contentRounds(content).concat(linkOnlyRounds[subject+'|'+content]||[]);\\n    if(!rounds.includes(round)||number\\u003c1||number>maxNumber)return null;\\n    return {source:{subject,book:content,round,number},view};\\n  }\\n  function focusQuestion(){const field=$('#question-text');if(field){field.scrollIntoView({block:'center',behavior:'smooth'});field.focus({preventScroll:true});}}\\n\\n  function selectedAnswers(){const s=state.source;return answers.filter(x=>x.subject===s.subject && x.book===s.book && x.round===s.round && x.number===s.number);}\\n  function empty(title,subtitle){return `\\u003cdiv class=\\\"empty\\\">\\u003cdiv class=\\\"empty-icon\\\" aria-hidden=\\\"true\\\">?\\u003c/div>\\u003cstrong>${safe(title)}\\u003c/strong>\\u003cp>${safe(subtitle)}\\u003c/p>\\u003c/div>`;}\\n  function results(){const matches=selectedAnswers();return `${header(sourceText()+' 검색 결과',{back:true,action:'\\u003cbutton class=\\\"primary\\\" data-action=\\\"ask-selected\\\">질문하기 →\\u003c/button>'})}\\u003cdiv class=\\\"section-tools\\\">\\u003cdiv class=\\\"tabs\\\">\\u003cbutton class=\\\"tab active\\\" data-action=\\\"answer-tab\\\">답변 \\u003csmall>(${matches.length})\\u003c/small>\\u003c/button>\\u003cbutton class=\\\"tab\\\" data-action=\\\"explanation\\\">해설지\\u003c/button>\\u003c/div>\\u003clabel class=\\\"switch\\\">\\u003cinput type=\\\"checkbox\\\" id=\\\"image-switch\\\" ${state.showImages?'checked':''}>사진 함께 보기\\u003c/label>\\u003c/div>\\u003cp class=\\\"notice-line\\\">사진 화면을 참고하여 구성한 예시 답변입니다. 실제 TA 서비스와 연결되어 있지 않습니다.\\u003c/p>${state.showImages?photoPanel():''}${otherQuestions()}`;}\\n  function detail(){const a=answers.find(x=>x.id===state.selectedAnswer);if(!a){state.page='results';return results();}const marked=saved.bookmarks.includes(a.id);const rating=saved.ratings[a.id]||0;return `${header('검색 결과 상세보기',{back:true,action:'\\u003cbutton class=\\\"primary\\\" data-action=\\\"ask-selected\\\">질문하기 →\\u003c/button>'})}\\u003cdiv class=\\\"section-tools\\\">\\u003ch2 class=\\\"result-heading\\\">${safe(sourceText(a))} \\u003cspan class=\\\"badge\\\" style=\\\"background:#626ebc;color:#fff;border:0\\\">${safe(a.tag)}\\u003c/span>\\u003c/h2>\\u003cdiv class=\\\"filter-row\\\">\\u003cbutton class=\\\"outline\\\" data-action=\\\"report\\\">ⓘ 질문 신고\\u003c/button>\\u003cbutton class=\\\"outline\\\" data-action=\\\"bookmark\\\" data-id=\\\"${a.id}\\\" aria-pressed=\\\"${marked}\\\">${marked?'▣ 북마크됨':'♧ 북마크'}\\u003c/button>\\u003c/div>\\u003c/div>${questionPhoto(a)?photoPanel(a):''}\\u003cdiv class=\\\"detail-labels\\\">\\u003cbutton class=\\\"active\\\">최초질문\\u003c/button>\\u003c/div>\\u003cdiv class=\\\"detail-columns\\\">\\u003csection class=\\\"detail-box\\\">\\u003cdiv class=\\\"detail-meta\\\">\\u003cspan class=\\\"badge\\\">질문\\u003c/span>\\u003cspan>${a.date} 등록\\u003c/span>\\u003c/div>${safe(a.question)}\\u003c/section>\\u003csection>\\u003cdiv class=\\\"detail-box\\\">\\u003cdiv class=\\\"detail-meta\\\">\\u003cspan class=\\\"badge dark\\\">답변\\u003c/span>\\u003cspan>${a.date} 등록\\u003c/span>\\u003c/div>${safe(a.answer)}\\u003cdiv class=\\\"teacher-strip\\\">\\u003cspan>${safe(a.teacher)}\\u003c/span>\\u003cspan>★ 4.8 / 5 \\u003cspan class=\\\"muted\\\">(예시)\\u003c/span> ♡ ${a.count}\\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"review\\\">\\u003cstrong>답변 리뷰\\u003c/strong>${[1,2,3,4,5].map(n=>`\\u003cbutton data-action=\\\"rate\\\" data-value=\\\"${n}\\\" class=\\\"${rating>=n?'rated':''}\\\" aria-label=\\\"${n}점\\\">${rating>=n?'★':'☆'}\\u003c/button>`).join('')}\\u003cspan class=\\\"muted\\\">${rating?rating+'점으로 평가했어요':'답변이 도움이 되었나요?'}\\u003c/span>\\u003c/div>\\u003c/section>\\u003c/div>`;}\\n  function form(){return `${header('문항 질문',{back:true,action:'\\u003cbutton class=\\\"primary\\\" type=\\\"submit\\\" form=\\\"ask-form\\\">질문 등록하기\\u003c/button>'})}\\u003cdiv class=\\\"subhead\\\">\\u003ch2>문항 정보\\u003c/h2>\\u003cp class=\\\"muted\\\">출처가 명확하지 않으면 질문이 취소될 수 있습니다.\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"form-source\\\">\\u003cdiv class=\\\"breadcrumb\\\">${crumbs()}\\u003c/div>\\u003cbutton class=\\\"text-button\\\" data-action=\\\"reset-source\\\">⟳ 문항 변경\\u003c/button>\\u003c/div>\\u003cform id=\\\"ask-form\\\">\\u003cp id=\\\"form-error\\\" class=\\\"form-error\\\" role=\\\"alert\\\" hidden>\\u003c/p>\\u003cdiv class=\\\"question-form\\\">\\u003csection>${photoPanel()}\\u003cdiv class=\\\"form-block-title\\\">\\u003ch2>질문 이미지 등록\\u003c/h2>\\u003csmall id=\\\"image-count\\\">${state.images.length} / 5\\u003c/small>\\u003cspan class=\\\"muted\\\">문항 위에 필기한 뒤 바로 첨부할 수 있습니다.\\u003c/span>\\u003c/div>\\u003cbutton class=\\\"upload-area\\\" type=\\\"button\\\" data-action=\\\"upload\\\">\\u003cspan class=\\\"upload-plus\\\">⊕\\u003c/span> 이미지 업로드 하기\\u003c/button>\\u003cdiv class=\\\"attachment-list\\\" id=\\\"attachments\\\">${attachmentHTML()}\\u003c/div>\\u003cp class=\\\"muted\\\" style=\\\"margin-top:14px;font-size:11px\\\">이미지는 최대 5장, 파일당 3MB까지 첨부할 수 있습니다.\\u003c/p>\\u003c/section>\\u003csection>\\u003cdiv class=\\\"form-section\\\">\\u003cdiv class=\\\"form-block-title\\\">\\u003ch2>질문 내용 입력\\u003c/h2>\\u003c/div>\\u003ctextarea class=\\\"field question-text\\\" id=\\\"question-text\\\" name=\\\"question\\\" maxlength=\\\"1000\\\" required placeholder=\\\"문제 1개당 질문 1개로 답변합니다.&#10;여러 문제를 함께 올리면 답변을 받지 못할 수 있어요.&#10;문제 이미지나 풀이 과정이 있는 필기 이미지와 함께 질문 내용을 입력해 보세요.\\\">${safe(state.text)}\\u003c/textarea>\\u003cp class=\\\"char-count\\\">\\u003cspan id=\\\"char-count\\\">${state.text.length}\\u003c/span>/1000\\u003c/p>\\u003c/div>\\u003cdiv class=\\\"form-section\\\">\\u003cdiv class=\\\"form-block-title\\\">\\u003ch2>답변 요청 TA 선택\\u003c/h2>\\u003c/div>\\u003cdiv class=\\\"choice-grid\\\">\\u003cbutton type=\\\"button\\\" clas \"explanation\\\">\\u003ch3>${safe(sourceText())}\\u003c/h3>\\u003cp>사진 속 해설지 탭을 재현한 영역입니다. 해당 문항의 실제 해설 원본은 제공되지 않았습니다.\\u003c/p>\\u003cp style=\\\"margin-top:16px\\\">문항과 선지의 조건을 확인하고, 지문의 근거와 풀이 과정을 비교해 보세요. 이해되지 않는 부분은 질문하기로 남길 수 있습니다.\\u003c/p>\\u003c/div>`),\\n    'answer-tab':()=>{},\\n    'reset-source':()=>{preserveForm();go('ask');},\\n    upload:()=>$('#image-input').click(),\\n    'remove-image':el=>{preserveForm();state.images.splice(Number(el.dataset.index),1);render();},\\n    'no-ta':()=>{preserveForm();state.ta='';render();},'choose-ta':openTA,\\n    'select-ta':el=>{state.ta=el.dataset.value;$('#modal').close();render();},\\n    request:el=>{preserveForm();state.request=el.dataset.value;render();},\\n    'mine-tab':el=>{state.mineTab=el.dataset.value;render();},\\n    month:el=>{const d=new Date(state.year,state.month+Number(el.dataset.value),1);state.year=d.getFullYear();state.month=d.getMonth();render();},\\n    'all-ta':()=>{state.allTA=true;state.interested=false;render();},'interest-ta':()=>{state.interested=!state.interested;state.allTA=false;render();},\\n    'ta-schedule':()=>modal('TA 주간 스케줄','\\u003cp>현재 등록된 TA 스케줄이 없습니다.\\u003c/p>\\u003cp style=\\\"margin-top:12px\\\">실시간 상담 시스템이 연결되면 TA별 상담 시간을 확인할 수 있습니다.\\u003c/p>'),\\n    tickets:()=>modal('내 이용권 확인','\\u003cp>\\u003cstrong>TA Meet 잔여 이용권: 0회\\u003c/strong>\\u003c/p>\\u003cp>\\u003cstrong>SA Meet 잔여 이용권: 0회\\u003c/strong>\\u003c/p>\\u003cp style=\\\"margin-top:20px\\\">원본 사진의 이용권 상태를 재현한 예시입니다. 결제나 실제 상담 예약은 연결되어 있지 않습니다.\\u003c/p>'),\\n    week:el=>{state.week+=Number(el.dataset.value);render();},\\n    'own-question':el=>{const q=saved.questions.find(x=>x.id===el.dataset.id);if(!q)return;modal('나의 질문',`\\u003cp>\\u003cstrong>${safe(sourceText(q.source))}\\u003c/strong>\\u003c/p>\\u003cp class=\\\"question-own\\\" style=\\\"margin-top:18px\\\">${safe(q.text)}\\u003c/p>${q.images.map(im=>`\\u003cimg class=\\\"inline-image\\\" src=\\\"${im.data}\\\" alt=\\\"${safe(im.name)}\\\">`).join('')}\\u003cp style=\\\"margin-top:18px\\\">답변 요청 TA: ${safe(q.ta||'지정 없음')}\\u003cbr>답변 요청 사항: ${safe(q.request)}\\u003cbr>상태: 로컬 저장 · 답변 대기\\u003c/p>\\u003cbutton class=\\\"outline\\\" data-action=\\\"delete-question\\\" data-id=\\\"${q.id}\\\" style=\\\"margin-top:20px\\\">질문 삭제\\u003c/button>`);},\\n    'delete-question':el=>{saved.questions=saved.questions.filter(x=>x.id!==el.dataset.id);const stored=persist();$('#modal').close();render();toast(stored?'질문을 삭제했습니다.':'현재 화면에서 삭제했지만 저장 공간 문제로 새로고침하면 다시 나타날 수 있어요.');}\\n  };\\n  document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;if(handleReviewAction(el))return;const action=actions[el.dataset.action];if(action)action(el);});\\n\\n\\n  $('#drawer-toggle').addEventListener('click',toggleDrawer);$('#drawer-shade').addEventListener('click',closeDrawer);\\n  document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDrawer();});\\n  document.addEventListener('input',event=>{if(event.target.id==='question-text'){state.text=event.target.value;$('#char-count').textContent=state.text.length;}if(event.target.id==='custom-request')state.customRequest=event.target.value;});\\n  document.addEventListener('change',event=>{\\nif(event.target.id==='mine-subject'){state.mineSubject=event.target.value;render();}if(event.target.id==='mine-order'){state.mineOrder=event.target.value;render();}if(event.target.id==='image-switch'){state.showImages=event.target.checked;render();}});\\n  document.addEventListener('submit',event=>{if(event.target.id!=='ask-form')return;event.preventDefault();if(imageUploadBusy){displayError('사진을 첨부하고 있습니다. 잠시 후 등록해 주세요.');return;}preserveForm();const text=state.text.trim();if(!text){displayError('질문 내용을 입력해 주세요.');return;}if(!state.source.number){displayError('문항 정보를 먼저 선택해 주세요.');return;}if(state.request==='직접입력'&&!state.customRequest.trim()){displayError('직접입력한 답변 요청 사항을 작성해 주세요.');return;}const now=new Date();const localDate=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}T${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;saved.questions.unshift({id:'q-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),source:{...state.source},text,ta:state.ta,request:state.request==='직접입력'?state.customRequest:state.request,images:[...state.images],created:localDate});const stored=persist();state.text='';state.images=[];state.customRequest='';state.request='없습니다';state.ta='';state.mineTab='문항 질문';state.month=now.getMonth();state.year=now.getFullYear();go('mine');toast(stored?'질문을 이 브라우저에 저장했습니다.':'질문을 임시로 추가했습니다. 저장 공간 부족으로 새로고침하면 사라질 수 있어요.');});\\n  $('#image-input').addEventListener('change',async event=>{const input=event.target,files=[...input.files];input.value='';if(imageUploadBusy){toast('사진을 첨부하고 있습니다. 잠시 후 다시 선택해 주세요.');return;}preserveForm();if(files.length+state.images.length>5){toast('이미지는 최대 5장까지 첨부할 수 있습니다.');return;}imageUploadBusy=true;for(const file of files){if(!file.type.startsWith('image/')||file.type==='image/svg+xml'){toast('PNG, JPG, WEBP 등 사진 파일을 선택해 주세요.');continue;}if(file.size>3*1024*1024){toast('파일당 3MB 이하의 이미지를 선택해 주세요.');continue;}try{const original=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});const data=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const ratio=Math.min(1,1000/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.8));};img.onerror=reject;img.src=original;});state.images.push({name:file.name,data});}catch{toast('이미지를 읽지 못했습니다. 다른 사진을 선택해 주세요.');}}imageUploadBusy=false;if(state.page==='form')render();});\\n\\n  $('#problem-photo-input').addEventListener('change',async event=>{\\n    const input=event.target,file=input.files?.[0],source=problemPhotoTarget?{...problemPhotoTarget}:null;\\n    input.value='';\\n    if(!file||!source||!source.number||problemPhotoBusy)return;\\n    if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024){toast('5MB 이하의 PNG, JPG, WEBP 문제 원문 사진을 선택해 주세요.');return;}\\n    problemPhotoBusy=true;preserveForm();render();\\n    try{\\n      const original=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});\\n      const data=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{try{const ratio=Math.min(1,1600/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.86));}catch(error){reject(error);}};img.onerror=reject;img.src=original;});\\n      if(!isProblemPhotoData(data))throw Error('Invalid problem photo');\\n      problemPhotos[problemSourceKey(source)]={data,name:file.name};\\n      let stored=true;\\n      try{localStorage.setItem(problemPhotoStorageKey,JSON.stringify(problemPhotos));}catch{stored=false;}\\n      toast(stored?'해당 문항의 문제 원문 사진을 등록했습니다.':'현재 화면에는 반영했지만 저장 공간이 부족해 새로고침하면 사라질 수 있어요.');\\n    }catch{toast('사진을 읽지 못했습니다. 다른 문제 원문 사진을 선택해 주세요.');}\\n    finally{problemPhotoBusy=false;preserveForm();render();}\\n  });\\n  render();\\n  if(!linkedEntry&&bookmarkReviewItems().length)openReview();\\n  if(linkedEntry?.view==='answers')$('#other-questions')?.scrollIntoView({block:'start'});\\n})();\\n\\u003c/script>\\n\\u003c/body>\\n\\u003c/html>\\n\"}\u003c/script>\n\u003cscript>\n(function (root) {\n  'use strict';\n\n  // 교재 제목·회차는 제공된 화면을 참고했습니다. 지문·문항·통계는 직접 작성한 예시입니다.\n  const subjects = ['국어', '수학', '영어', '물리학Ⅱ', '사회문화', '한국사'];\n  const demoNotice = {\n    isDemo: true,\n    content: '지문·문항·정답·해설은 기능 확인을 위해 작성한 예시이며 실제 교재 내용이 아닙니다.',\n    statistics: '선지별 선택 비율은 예시 데이터이며 실제 재원생 통계가 아닙니다.',\n    library: '국어 외 과목의 교재 목록은 화면 구성을 위한 예시입니다.'\n  };\n  const books = [];\n  const logParts = [\n    ['01', '수능 만점자의 1년', '성적 우수자의 공부 몰입도', '6평을 위한 항해지도', '상반기 콘텐츠 추천', '실수와 보완법'],\n    ['02', '국수탐 만점자의 1년', '9평을 위한 항해지도', '하반기 콘텐츠 추천']\n  ];\n  logParts.forEach(function (issueParts) {\n    const issue = issueParts[0];\n    issueParts.slice(1).forEach(function (title, index) {\n      books.push({\n        id: 'log-' + issue + '-part-' + (index + 1), kind: 'log', subject: '항해일지',\n        type: 'log', title: '항해일지', issue: issue, subtitle: 'Part ' + (index + 1) + '. ' + title,\n        updated: '2026-09-14', pages: 15, available: true, completed: false, seconds: 0,\n        color: issue === '01' ? '#8586ab' : '#709fb3', demo: true\n      });\n    });\n  });\n\n  function addWorkbook(id, subject, type, issue, updated, options) {\n    const config = options || {};\n    const names = { survival: '서바이벌', accelerator: '엑셀러레이터', monthly: '월례고사' };\n    books.push({\n      id: id, kind: 'workbook', subject: subject, type: type, title: names[type],\n      issue: String(issue), subtitle: config.demo ? '화면 구성용 예시 교재' : '개별 문항 풀이',\n      updated: updated, pages: 45, available: config.available !== false,\n      completed: Boolean(config.completed), seconds: config.seconds || 0,\n      color: type === 'accelerator' ? '#3c62b1' : type === 'monthly' ? '#626a60' : '#9fa58d',\n      demo: true, demoLibrary: Boolean(config.demo)\n    });\n  }\n  addWorkbook('korean-survival-18', '국어', 'survival', '18', '2026-11-02', { available: false });\n  addWorkbook('korean-accelerator-29', '국어', 'accelerator', '29', '2026-11-02', { available: false });\n  addWorkbook('korean-monthly-10', '국어', 'monthly', '10', '2026-10-28');\n  addWorkbook('korean-survival-17', '국어', 'survival', '17', '2026-10-26', { completed: true, seconds: 17 });\n  addWorkbook('korean-accelerator-28', '국어', 'accelerator', '28', '2026-10-26');\n  addWorkbook('korean-survival-16', '국어', 'survival', '16', '2026-10-19', { completed: true, available: false });\n  addWorkbook('korean-accelerator-27', '국어', 'accelerator', '27', '2026-10-19', { available: false });\n  addWorkbook('math-survival-18', '수학', 'survival', '18', '2026-11-02', { demo: true });\n  addWorkbook('math-accelerator-29', '수학', 'accelerator', '29', '2026-11-02', { demo: true });\n  addWorkbook('english-survival-18', '영어', 'survival', '18', '2026-11-02', { demo: true });\n  addWorkbook('physics-survival-18', '물리학Ⅱ', 'survival', '18', '2026-11-02', { demo: true });\n  addWorkbook('social-survival-18', '사회문화', 'survival', '18', '2026-11-02', { demo: true });\n  addWorkbook('history-monthly-10', '한국사', 'monthly', '10', '2026-10-28', { demo: true });\n\n  function template(prompt, passage, choices, answer, explanation, tags) {\n    return { prompt: prompt, passage: passage, choices: choices, answer: answer, explanation: explanation, tags: tags };\n  }\n  const koreanTemplates = [\n    template('윗글을 바탕으로 추론한 내용으로 가장 적절한 것은?',\n      '같은 글을 반복해서 읽으면 내용이 익숙하게 느껴진다. 그러나 익숙함이 곧 이해를 뜻하지는 않는다. 책을 덮은 뒤 핵심 내용을 자신의 말로 설명하면 이해하지 못한 부분을 발견할 수 있다. 발견한 빈틈을 다시 확인하는 과정이 복습의 출발점이 된다.',\n      ['익숙한 내용은 설명할 필요가 없다.', '반복해서 읽으면 언제나 모든 내용을 이해하게 된다.', '스스로 설명해 보는 활동은 이해의 빈틈을 찾는 데 도움이 된다.', '복습은 처음부터 끝까지 같은 속도로 읽을 때만 가능하다.', '핵심 내용을 기억하지 못해도 이해한 것으로 볼 수 있다.'],\n      3, '글은 익숙함과 이해를 구분하고, 책을 덮고 자신의 말로 설명하는 활동으로 이해의 빈틈을 찾을 수 있다고 말한다. 따라서 ③이 적절하다. ④의 ‘같은 속도로 읽을 때만’이라는 제한은 지문에 없다.', ['독서', '내용 추론']),\n    template('윗글의 중심 내용으로 가장 적절한 것은?',\n      '계획에 빈칸이 없다고 해서 실행이 잘되는 것은 아니다. 예상보다 오래 걸리는 과제가 생길 수 있기 때문이다. 하루의 일부를 여유 시간으로 남겨 두면 지연된 과제를 마무리하고 다음 계획을 조정할 수 있다.',\n      ['계획에는 예상하지 못한 상황에 대응할 여유가 필요하다.', '모든 과제는 같은 시간이 걸린다.', '일정이 지연되면 모든 계획을 포기해야 한다.', '여유 시간에는 새로운 과제만 해야 한다.', '계획은 자세할수록 반드시 성공한다.'],\n      1, '지연되는 과제를 처리하고 계획을 조정하기 위해 여유 시간을 두자는 글이다. ①이 글 전체를 포괄한다.', ['독서', '중심 내용']),\n    template('윗글의 설명 방식으로 가장 적절한 것은?',\n      '메모 A는 문제의 정답만 적어 두었다. 메모 B는 정답과 함께 잘못 판단한 근거, 다음에 확인할 조건을 적었다. A로는 결과를 확인할 수 있지만, B로는 생각의 어느 지점을 바꿔야 하는지도 확인할 수 있다.',\n      ['어휘의 어원을 분석하고 있다.', '일어난 사건을 시간 순서대로 나열하고 있다.', '대상의 크기를 수치로 계산하고 있다.', '두 사례를 비교하여 기록 내용의 차이를 드러내고 있다.', '전문가의 말을 인용하여 권위를 강조하고 있다.'],\n      4, '정답만 기록한 A와 판단 근거까지 기록한 B를 비교한다. 그 차이를 통해 기록의 역할을 설명하므로 ④가 적절하다.', ['독서', '설명 방식']),\n    template('윗글에서 말하는 ‘점검’의 사례로 가장 적절한 것은?',\n      '점검은 끝낸 과제의 수만 세는 일이 아니다. 처음 세운 목표와 실제 결과를 비교하고, 차이가 생긴 이유를 확인하는 일이다. 그 이유가 다음 계획에 반영될 때 기록은 학습을 조절하는 자료가 된다.',\n      ['친구의 과제 수를 그대로 목표로 삼는다.', '예상 시간과 실제 시간을 비교하고 지연 원인을 다음 계획에 반영한다.', '끝낸 과제 수를 확인한 뒤 기록을 지운다.', '목표와 관계없이 새 문제집을 고른다.', '모든 과제의 시간을 같게 바꾼다.'],\n      2, '목표와 실제 결과를 비교하고 차이의 원인을 다음 계획에 반영하는 ②가 지문의 점검에 해당한다.', ['독서', '사례 적용']),\n    template('윗글을 이해한 내용으로 적절하지 않은 것은?',\n      '질문을 만들 때에는 막힌 위치를 구체적으로 적는 편이 좋다. 자신이 사용한 조건과 거기서 도출한 판단을 함께 적으면 상대방은 풀이의 흐름을 파악할 수 있다. 이 기록은 답변을 받은 뒤 자신의 판단을 다시 살펴보는 데에도 쓰인다.',\n      ['막힌 위치를 구체적으로 기록하면 좋다.', '풀이에 사용한 조건을 질문에 포함할 수 있다.', '자신이 도출한 판단도 질문의 자료가 된다.', '질문 기록은 답변을 받은 뒤에도 활용할 수 있다.', '답변을 받으려면 자신의 풀이 과정은 반드시 숨겨야 한다.'],\n      5, '글에서는 사용한 조건과 판단을 함께 적으라고 권한다. 풀이 과정을 반드시 숨겨야 한다는 ⑤는 글의 내용과 반대이다.', ['독서', '내용 일치']),\n    template('윗글에 제목을 붙인 것으로 가장 적절한 것은?',\n      '문제를 틀렸다는 사실만으로 같은 실수가 반복되는 이유를 알 수는 없다. 조건을 놓친 것인지, 계산을 잘못한 것인지, 개념을 혼동한 것인지 구분해야 한다. 이유에 따라 다시 읽기, 계산 검산, 개념 비교처럼 다음 행동도 달라진다.',\n      ['문제 수가 정하는 학습의 질', '정답을 빠르게 외우는 방법', '오답의 원인에서 찾는 다음 행동', '모든 실수를 해결하는 한 가지 방법', '계산 연습만으로 끝내는 복습'],\n      3, '오답 원인을 구분하고 그 원인에 맞는 행동을 정하자는 글이다. 이를 함께 담은 제목은 ③이다.', ['독서', '제목 찾기'])\n  ];\n\n  function mathTemplate(number) {\n    const unit = Math.floor((number - 1) / 6) + 1;\n    switch ((number - 1) % 6) {\n      case 0: {\n        const x = unit + 3;\n        return template('방정식을 만족하는 x의 값은?', '2x + 3 = ' + (2 * x + 3),\n          [String(x - 2), String(x - 1), String(x), String(x + 1), String(x + 2)], 3,\n          '양변에서 3을 빼면 2x = ' + (2 * x) + '이다. 양변을 2로 나누면 x = ' + x + '이다.', ['방정식', '일차방정식']);\n      }\n      case 1: {\n        const value = 3 * unit + 2;\n        return template('함숫값 f(' + unit + ')는?', '함수 f(x) = 3x + 2이다.',\n          [String(value), String(value + 1), String(value + 2), String(value + 3), String(value + 4)], 1,\n          'x에 ' + unit + '을 대입하면 f(' + unit + ') = 3 × ' + unit + ' + 2 = ' + value + '이다.', ['함수', '함숫값']);\n      }\n      case 2: {\n        const value = 2 + 3 * (unit + 2);\n        return template('다음 등차수열의 제' + (unit + 3) + '항은?', '첫째항이 2이고 공차가 3인 등차수열이다.',\n          [String(value - 3), String(value - 2), String(value - 1), String(value), String(value + 1)], 4,\n          '제n항은 2 + 3(n − 1)이다. n = ' + (unit + 3) + '을 대입하면 ' + value + '이다.', ['수열', '등차수열']);\n      }\n      case 3: {\n        const value = unit + 2;\n        return template('세 수의 산술평균은?', '세 수는 ' + unit + ', ' + (unit + 2) + ', ' + (unit + 4) + '이다.',\n          [String(value - 1), String(value), String(value + 1), String(value + 2), String(value + 3)], 2,\n          '세 수를 더한 ' + (3 * value) + '를 개수 3으로 나누면 산술평균은 ' + value + '이다.', ['자료 해석', '평균']);\n      }\n      case 4: {\n        const value = (unit + 2) * 4;\n        return template('직사각형의 넓이는?', '가로 길이가 ' + (unit + 2) + ' cm, 세로 길이가 4 cm인 직사각형이다.',\n          [String(value - 8) + ' cm²', String(value - 6) + ' cm²', String(value - 4) + ' cm²', String(value - 2) + ' cm²', String(value) + ' cm²'], 5,\n          '직사각형의 넓이는 가로 × 세로이므로 ' + (unit + 2) + ' × 4 = ' + value + ' cm²이다.', ['도형', '넓이']);\n      }\n      default: {\n        const value = 2 * unit;\n        return template('함수 f(x)의 x = ' + unit + '에서의 미분계수는?', 'f(x) = x²이며, 도함수는 f′(x) = 2x이다.',\n          [String(value - 2), String(value - 1), String(value), String(value + 1), String(value + 2)], 3,\n          '도함수 f′(x) = 2x에 x = ' + unit + '을 대입하면 f′(' + unit + ') = ' + value + '이다.', ['미분', '미분계수']);\n      }\n    }\n  }\n\n  const englishTemplates = [\n    template('글의 내용과 일치하는 것은?', 'Mina studies at the library every Saturday. Before she leaves, she writes down one question to ask her teacher on Monday.',\n      ['Mina never visits the library.', 'Mina asks her teacher a question every Saturday.', 'Mina prepares a question before leaving the library.', 'Mina studies only on Monday.', 'Mina writes questions for her classmates.'], 3,\n      'Before she leaves, she writes down one question이라고 했으므로 도서관을 떠나기 전에 질문을 준비한다는 ③이 일치한다.', ['영어', '내용 일치']),\n    template('빈칸에 들어갈 말로 가장 적절한 것은?', 'I was tired, _____ I took a short break and then returned to my work.',\n      ['so', 'or', 'although', 'unless', 'before'], 1,\n      '피곤했다는 원인과 잠깐 쉬었다는 결과를 연결하므로 so가 적절하다.', ['영어', '연결어']),\n    template('글의 주제로 가장 적절한 것은?', 'A large task can feel difficult to begin. Dividing it into smaller steps gives you a clear place to start. Completing the first step can help you continue.',\n      ['Why all tasks take the same time', 'The value of avoiding difficult work', 'How to finish work without a plan', 'Making a large task easier to start', 'Why starting early is impossible'], 4,\n      '큰 과제를 작은 단계로 나누어 시작하기 쉽게 만드는 방법을 설명하므로 ④가 주제로 적절하다.', ['영어', '주제']),\n    template('밑줄 친 표현을 우리말로 옮긴 것으로 가장 적절한 것은?', 'Please check your answer once more. In this sentence, “once more” means _____.',\n      ['아주 드물게', '한 번 더', '전혀 없이', '지난해에', '가능한 한 빨리'], 2,\n      'once more는 again과 같은 뜻으로, ‘한 번 더’를 의미한다.', ['영어', '어휘']),\n    template('글의 내용으로 알 수 없는 것은?', 'The reading club meets in Room 3 on Fridays. Each meeting begins at four and lasts for one hour. Members bring a book of their choice.',\n      ['모임 장소', '모임 요일', '시작 시간', '모임의 길이', '회원의 정확한 수'], 5,\n      '장소·요일·시작 시간·진행 시간과 준비물은 제시되어 있지만 회원 수는 언급되어 있지 않다.', ['영어', '정보 확인'])\n  ];\n\n  const physicsTemplates = [\n    template('물체의 속력은?', '물체가 일정한 속력으로 12 m를 3 s 동안 이동했다. 속력은 이동 거리 ÷ 걸린 시간으로 구한다.',\n      ['2 m/s', '3 m/s', '4 m/s', '6 m/s', '9 m/s'], 3, '12 m ÷ 3 s = 4 m/s이므로 ③이다.', ['물리학Ⅱ', '운동']),\n    template('물체에 작용하는 알짜힘의 크기는?', '질량 2 kg인 물체의 가속도가 3 m/s²이다. 알짜힘 F = ma를 이용한다.',\n      ['6 N', '2 N', '3 N', '5 N', '9 N'], 1, 'F = ma = 2 × 3 = 6 N이다.', ['물리학Ⅱ', '힘']),\n    template('저항에 흐르는 전류의 세기는?', '저항 4 Ω에 전압 12 V를 걸었다. 전류 I = V/R을 이용한다.',\n      ['0.5 A', '1 A', '2 A', '3 A', '4 A'], 4, 'I = V/R = 12/4 = 3 A이다.', ['물리학Ⅱ', '전기']),\n    template('힘이 물체에 한 일은?', '이동 방향으로 일정한 힘 5 N을 가하여 물체를 2 m 이동시켰다. 일 W = Fd를 이용한다.',\n      ['5 J', '10 J', '15 J', '20 J', '25 J'], 2, '힘과 이동 방향이 같으므로 W = Fd = 5 × 2 = 10 J이다.', ['물리학Ⅱ', '일과 에너지']),\n    template('파동의 진행 속력은?', '파장이 2 m, 진동수가 5 Hz인 파동이다. 진행 속력 v = fλ를 이용한다.',\n      ['2 m/s', '4 m/s', '5 m/s', '8 m/s', '10 m/s'], 5, 'v = fλ = 5 × 2 = 10 m/s이다.', ['물리학Ⅱ', '파동'])\n  ];\n\n  const socialTemplates = [\n    template('이 조사에 대한 설명으로 가장 적절한 것은?', '연구자는 학생들의 통학 시간을 알아보기 위해 같은 문항으로 구성된 설문지를 100명에게 배부했다. 응답은 분 단위 숫자로 정리했다.',\n      ['모든 학생을 반드시 관찰했다.', '통학 시간을 과학적으로 조사할 수는 없다.', '동일한 문항을 사용하여 비교 가능한 응답을 수집했다.', '응답자의 통학 이유를 모두 확인했다.', '조사 결과를 제시하지 않아도 전국 평균을 확정할 수 있다.'], 3,\n      '동일한 질문과 분 단위의 응답 형식을 사용했으므로 응답을 서로 비교할 수 있다. 전국 평균이나 모든 통학 이유까지 알 수 있다는 근거는 없다.', ['사회문화', '자료 수집']),\n    template('자료를 바르게 해석한 것은?', '가상의 설문에서 50명 중 30명이 버스, 15명이 도보, 5명이 자전거를 주된 통학 수단으로 답했다. 각 사람은 하나만 선택했다.',\n      ['버스를 선택한 비율은 60%이다.', '도보를 선택한 비율은 50%이다.', '자전거를 선택한 비율은 20%이다.', '도보 응답이 버스 응답보다 많다.', '응답자 수는 60명이다.'], 1,\n      '버스 응답 30명을 전체 50명으로 나누면 0.6이므로 60%이다.', ['사회문화', '자료 해석']),\n    template('다음 연구에서 비교하려는 것은?', '두 학급에 같은 읽기 자료를 제공했다. A반은 혼자 읽고, B반은 읽은 뒤 짝과 토론했다. 이후 같은 이해도 문항에 답하도록 했다.',\n      ['교실 크기에 따른 이동 거리', '통학 수단과 수면 시간의 관계', '두 자료의 글자 수 차이', '토론 여부에 따른 이해도 차이', '학급 명칭에 따른 출석률'], 4,\n      '읽기 자료와 이해도 문항은 같고 읽은 뒤 토론하는지 여부가 다르므로 토론 여부에 따른 이해도 차이를 비교한다.', ['사회문화', '연구 설계']),\n    template('조사 결과를 해석할 때 필요한 태도로 가장 mplate('다음 탐구 활동의 결과로 단정하기 어려운 것은?', '학생들이 한 장터의 옛 사진 두 장을 비교했다. 사진에는 가게 간판과 거리 모습이 보였지만 촬영 범위 밖의 모습은 나오지 않았다.',\n      ['사진에 가게 간판이 보인다.', '사진에 거리 모습이 담겨 있다.', '비교한 사진은 두 장이다.', '사진에는 촬영 범위의 한계가 있다.', '이 사진만으로 전국 모든 장터의 모습을 알 수 있다.'], 5,\n      '한 장터의 일부를 촬영한 사진 두 장만으로 전국 모든 장터의 모습을 일반화할 수 없다.', ['한국사', '자료의 한계'])\n  ];\n\n  const templateSets = { '국어': koreanTemplates, '영어': englishTemplates, '물리학Ⅱ': physicsTemplates, '사회문화': socialTemplates, '한국사': historyTemplates };\n  const questionCache = new Map();\n  function getBook(id) { return books.find(function (book) { return book.id === id; }) || null; }\n  function ratiosFor(answer) {\n    const base = [4.8, 12.1, 67.5, 12.9, 2.7];\n    const ratios = new Array(5);\n    base.forEach(function (value, index) { ratios[(index + answer - 3 + 5) % 5] = value; });\n    return ratios;\n  }\n  function getQuestions(bookId) {\n    const book = getBook(bookId);\n    if (!book || book.kind !== 'workbook') return [];\n    if (!questionCache.has(bookId)) {\n      const questions = Array.from({ length: 45 }, function (_, index) {\n        const number = index + 1;\n        const set = templateSets[book.subject];\n        const source = book.subject === '수학' ? mathTemplate(number) : set[index % set.length];\n        return {\n          id: bookId + '-q' + number, bookId: bookId, subject: book.subject, number: number,\n          prompt: source.prompt, passage: source.passage, choices: source.choices.slice(),\n          answer: source.answer, explanation: source.explanation, tags: source.tags.slice(),\n          points: number \u003c= 35 ? 2 : 3, ratios: ratiosFor(source.answer),\n          isDemo: true, statisticsLabel: '학생 선택 비율 · 예시'\n        };\n      });\n      questionCache.set(bookId, questions);\n    }\n    return questionCache.get(bookId);\n  }\n  function getQuestion(bookId, number) {\n    const n = Number(number);\n    return Number.isInteger(n) && n >= 1 && n \u003c= 45 ? getQuestions(bookId)[n - 1] || null : null;\n  }\n  function allQuestions() {\n    return books.reduce(function (items, book) { return items.concat(getQuestions(book.id)); }, []);\n  }\n\n  const articles = [\n    ['목표를 작은 행동으로 바꾸기', '이번 주 목표를 적었다면 오늘 시작할 수 있는 크기로 나누어 보자. 큰 목표는 방향을 정하고, 작은 행동은 그 방향으로 움직이게 한다.', '“독서를 더 잘하기”보다 “한 지문의 중심 문장을 찾아 설명하기”처럼 끝났는지 확인할 수 있는 행동을 적어 보자.', '하루가 끝나면 완료한 행동과 어려웠던 부분을 함께 기록한다. 다음 계획은 그 기록에서 출발한다.'],\n    ['읽은 뒤에는 잠깐 멈추기', '한 단락을 읽은 뒤 잠깐 시선을 떼고 무엇을 읽었는지 자신의 말로 정리해 보자. 설명이 막히는 곳은 다시 살펴볼 단서가 된다.', '중요한 문장을 많이 표시하는 것보다 문장 사이의 관계를 하나라도 설명해 보는 일이 도움이 될 수 있다.', '다시 읽을 때에는 처음과 똑같이 훑지 말고, 방금 설명하지 못했던 부분을 먼저 확인한다.'],\n    ['오답에 이유를 남기기', '오답에는 정답만 적지 말고 그 선지를 골랐던 이유를 한 문장 남겨 보자. 당시의 판단을 알아야 바꿀 지점도 찾을 수 있다.', '조건을 놓쳤는지, 개념을 혼동했는지, 계산 과정이 틀렸는지 구분한다. 같은 오답이라도 다음 행동은 달라질 수 있다.', '복습할 때에는 해설을 가리고 다시 판단한다. 이유를 설명할 수 있게 되면 기록에 해결한 날짜를 남긴다.'],\n    ['시간을 기록하고 조정하기', '시험 모드에서는 풀이에 걸린 시간을 확인할 수 있다. 기록을 볼 때에는 총시간과 오래 머문 문항을 함께 살펴보자.', '오래 걸린 이유를 생각해 본다. 내용을 다시 읽었는지, 계산을 반복했는지, 두 선지 사이에서 망설였는지 구체적으로 적는다.', '다음 연습에서는 바꿀 행동을 하나만 정한다. 한 번의 결과로 자신을 단정하지 말고 여러 번의 변화를 비교한다.'],\n    ['질문을 구체적으로 만들기', '해설을 읽고도 막힌 부분이 있다면 어느 문장과 어느 판단 사이에서 이해가 끊겼는지 찾아보자.', 'TA에게 질문할 때에는 문항 번호, 사용한 조건, 자신이 생각한 풀이를 함께 적는다. 질문의 출발점이 선명해진다.', '답변을 받은 뒤에는 설명을 그대로 옮기기보다 자신의 말로 다시 정리한다. 같은 조건을 만나면 무엇을 확인할지도 적어 둔다.'],\n    ['복습을 다시 만나는 시간', '복습할 문항이 많다면 오늘 확인할 몇 개를 먼저 고른다. 시작할 수 있는 분량을 정하면 밀린 기록을 펼치기 쉬워진다.', '플래시카드의 답을 보기 전에 잠깐 멈춰 생각해 보자. 정답뿐 아니라 그 근거를 떠올리는 것이 목표이다.', '아직 헷갈리는 문항은 다시 복습할 목록에 남기고, 설명할 수 있는 문항은 완료로 표시한다. 목록은 다음 학습을 위한 안내가 된다.'],\n    ['한 주의 학습을 돌아보기', '한 주가 끝나면 많이 한 일과 잘 이해한 일을 구분해서 적어 보자. 분량과 이해는 서로 다른 점검 기준이다.', '예상과 달랐던 부분에는 이유를 붙인다. 계획이 과했는지, 필요한 개념이 부족했는지 살펴보면 다음 주의 우선순위가 보인다.', '유지할 행동 하나와 바꿀 행동 하나를 정한다. 작은 조정을 기록하며 자신에게 맞는 학습 방법을 만들어 간다.']\n  ];\n  function getPage(bookId, page) {\n    const book = getBook(bookId);\n    const n = Number(page);\n    if (!book || !Number.isInteger(n) || n \u003c 1 || n > book.pages) return null;\n    if (book.kind === 'workbook') {\n      const question = getQuestion(bookId, n);\n ;if(e.key==='ArrowRight'){e.preventDefault();changePage(state.page+1);}if(e.key==='ArrowLeft'){e.preventDefault();changePage(state.page-1);}});\n  window.addEventListener('beforeunload',()=>{tick();persist();});\n  EbookFlash.init({host:$('#flash-section'),getQuestions:()=>D.allQuestions(),getBook:id=>D.getBook(id),icon,toast,openQuestion:q=>{const b=D.getBook(q.bookId);if(b)startReader(b,'study',q.number);},onStartLearning:()=>setView('study')});\n  renderLibrary();\n  EbookFlash.openWelcome();\n})();\n\n\u003c/script>\n\u003c/body>\u003c/html>\n"}</script>
<script>
(function(){
  const config=JSON.parse(document.getElementById('ebook-ipad-app').textContent);
  const frame=document.getElementById('ipad-frame'),app=document.getElementById('ipad-app');
  function fit(){
    const scale=Math.min(1,Math.max(1,window.innerWidth-32)/config.width,Math.max(1,window.innerHeight-32)/config.height);
    frame.style.width=config.width*scale+'px';frame.style.height=config.height*scale+'px';
    app.style.transform='scale('+scale+')';
  }
  fit();app.srcdoc=config.html;window.addEventListener('resize',fit);
})();
</script></body></html>
