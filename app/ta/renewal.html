<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'ta-review-cards-v1';
  const esc = value => String(value ?? '').replace(/[&<>"']/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[character]));
  const localDate = () => {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  };
  const freshState = () => ({ date: localDate(), currentId: '', flipped: false, reviewed: [] });
  let state = freshState();
  let notice = '';
  let lastMembership = '';

  try {
    const raw = globalThis.localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const value = JSON.parse(raw);
      if (!value || typeof value.date !== 'string' || !Array.isArray(value.reviewed)) {
        throw new Error('Invalid saved review state');
      }
      if (value.date === localDate()) {
        state = {
          date: value.date,
          currentId: typeof value.currentId === 'string' ? value.currentId : '',
          flipped: value.flipped === true,
          reviewed: [...new Set(value.reviewed.filter(id => typeof id === 'string'))],
        };
      }
    }
  } catch {
    notice = '복습 기록을 불러오지 못했어요. 현재 화면에서 카드를 이어서 볼 수 있어요.';
  }

  function persist() {
    try {
      globalThis.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      notice = '';
      return true;
    } catch {
      notice = '현재 화면에는 반영했지만 복습 기록을 저장하지 못했어요. 새로고침하면 사라질 수 있어요.';
      return false;
    }
  }

  function prepare(items) {
    const ids = new Set();
    const cards = (Array.isArray(items) ? items : []).filter(item => {
      if (!item || typeof item.id !== 'string' || !item.id || ids.has(item.id)) return false;
      ids.add(item.id);
      return true;
    });
    if (state.date !== localDate()) state = freshState();
    state.reviewed = state.reviewed.filter(id => ids.has(id));
    const membership = JSON.stringify(cards.map(item => item.id));
    const pending = cards.find(item => !state.reviewed.includes(item.id));
    if (!ids.has(state.currentId) || (membership !== lastMembership && pending && state.reviewed.includes(state.currentId))) {
      state.currentId = (cards.find(item => !state.reviewed.includes(item.id)) || cards[0])?.id || '';
      state.flipped = false;
    }
    lastMembership = membership;
    return cards;
  }

  function source(item) {
    return [item.subject, item.book, item.round != null ? `${item.round}회` : '', item.number != null ? `${item.number}번` : '']
      .filter(Boolean).map(esc).join(' · ');
  }

  function tags(item) {
    const values = Array.isArray(item.tags) ? item.tags.filter(tag => typeof tag === 'string').slice(0, 5) : [];
    return values.length ? `<div class="review-card-tags">${values.map(tag => `<span>#${esc(tag.replace(/^#+/, ''))}</span>`).join('')}</div>` : '';
  }

  const bookmarkIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg>';
  const checkIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L20 5"/></svg>';
  const leftIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>';
  const rightIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>';
  const flipIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 0 1 13-5l3 4m0-5v5h-5M20 14a8 8 0 0 1-13 5l-3-4m0 5v-5h5"/></svg>';

  function render(items) {
    const cards = prepare(items);
    const completed = state.reviewed.length;
    const remaining = cards.length - completed;
    const heading = `<div class="review-cards-heading"><div><h2>${bookmarkIcon}북마크 복습</h2><p>저장해 둔 질문을 한 장씩 꺼내 보세요.</p></div><span class="review-cards-count">${cards.length ? `오늘 ${completed} / ${cards.length}개 완료` : '북마크한 질문이 자동으로 모여요'}</span></div>`;
    const storageNotice = notice ? `<p class="review-cards-notice" role="status">${esc(notice)}</p>` : '';

    if (!cards.length) {
      return `<section class="review-cards" aria-label="북마크 복습 카드">${heading}<div class="review-cards-empty"><span class="review-cards-empty-icon">${bookmarkIcon}</span><div><strong>다시 보고 싶은 답변을 북마크해 보세요.</strong><p>북마크하면 이곳에 복습 카드가 자동으로 나타나요.</p></div><button class="outline" data-action="nav" data-id="search">문항 검색</button></div>${storageNotice}</section>`;
    }

    if (!remaining) {
      return `<section class="review-cards" aria-label="북마크 복습 카드">${heading}<div class="review-cards-complete" aria-live="polite"><span class="review-cards-complete-icon">${checkIcon}</span><div><h3>오늘의 북마크 복습을 마쳤어요.</h3><p>${cards.length}개의 질문을 다시 살펴봤어요. 언제든 한 번 더 복습할 수 있어요.</p></div><button class="outline" data-action="review-restart">다시 복습</button></div>${storageNotice}</section>`;
    }

    const index = cards.findIndex(item => item.id === state.currentId);
    const item = cards[index];
    const isDone = state.reviewed.includes(item.id);
    const headingText = typeof item.questionSummary === 'string' ? item.questionSummary : '';
    const answerText = typeof item.answerSummary === 'string' ? item.answerSummary : '';
    return `<section class="review-cards" aria-label="북마크 복습 카드">${heading}<article class="review-flashcard ${state.flipped ? 'is-flipped' : ''}"><div class="review-card-top"><span>${source(item)}</span><span class="review-card-position">${index + 1} / ${cards.length}</span></div><div class="review-card-body" id="review-card-body" aria-live="polite" aria-atomic="true"><span class="review-card-side">${state.flipped ? '답변 요약' : '이 질문, 다시 생각해 볼까요?'}</span><h3>${esc(headingText)}</h3>${tags(item)}${state.flipped ? `<p class="review-card-answer">${esc(answerText)}</p>` : '<p class="review-card-hint">답변을 보기 전에, 기억나는 내용을 먼저 떠올려 보세요.</p>'}</div><div class="review-card-actions"><button class="review-card-flip" data-action="review-flip" data-id="${esc(item.id)}" aria-controls="review-card-body" aria-expanded="${state.flipped}">${flipIcon}${state.flipped ? '질문 다시 보기' : '답변 보기'}</button>${state.flipped ? `<button class="review-card-done" data-action="review-done" data-id="${esc(item.id)}" ${isDone ? 'disabled' : ''}>${checkIcon}${isDone ? '오늘 복습 완료' : '오늘 복습 완료'}</button>` : ''}</div><div class="review-card-footer"><button class="review-card-original" data-action="answer" data-id="${esc(item.id)}">질문·답변 원문 보기 <span aria-hidden="true">↗</span></button><div class="review-card-paging"><span>${remaining}개 남음</span><button class="review-card-arrow" data-action="review-prev" data-id="${esc(item.id)}" aria-label="이전 복습 카드" ${cards.length < 2 ? 'disabled' : ''}>${leftIcon}</button><button class="review-card-arrow" data-action="review-next" data-id="${esc(item.id)}" aria-label="다음 복습 카드" ${cards.length < 2 ? 'disabled' : ''}>${rightIcon}</button></div></div></article>${storageNotice}</section>`;
  }

  function handle(action, id, items) {
    if (!['review-flip', 'review-next', 'review-prev', 'review-done', 'review-restart'].includes(action)) return false;
    const cards = prepare(items);
    if (!cards.length) return true;
    const currentIndex = cards.findIndex(item => item.id === state.currentId);
    if (id && id !== state.currentId) return true;

    if (action === 'review-restart') {
      state.reviewed = [];
      state.currentId = cards[0].id;
      state.flipped = false;
    } else if (action === 'review-flip') {
      state.flipped = !state.flipped;
    } else if (action === 'review-next' || action === 'review-prev') {
      const offset = action === 'review-next' ? 1 : -1;
      state.currentId = cards[(currentIndex + offset + cards.length) % cards.length].id;
      state.flipped = false;
    } else if (action === 'review-done') {
      // The answer must be visible before a card can be marked reviewed.
      if (!state.flipped) return true;
      if (!state.reviewed.includes(state.currentId)) state.reviewed.push(state.currentId);
      for (let offset = 1; offset <= cards.length; offset++) {
        const candidate = cards[(currentIndex + offset) % cards.length];
        if (!state.reviewed.includes(candidate.id)) {
          state.currentId = candidate.id;
          break;
        }
      }
      state.flipped = false;
    }
    persist();
    return true;
  }

  globalThis.TAReviewCards = Object.freeze({ render, handle });
})();

</script>

  const paths = {menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',question:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5m0 3v.1"/>',users:'<circle cx="9" cy="7" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3m1-16a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5"/>',book:'<path d="M5 3h14v18l-7-5-7 5z"/>',back:'<path d="m13 5-7 7 7 7M6 12h15"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/>',camera:'<path d="M3 7h4l2-3h6l2 3h4v14H3z"/><circle cx="12" cy="13" r="4"/>',right:'<path d="M4 12h16m-6-6 6 6-6 6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>'};
  const icon = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.question}</svg>`;
  const storageKey = 'ta-original-demo-v1';
  let saved = {bookmarks:['korean17-1'],questions:[],ratings:{}};
  try { const value = JSON.parse(localStorage.getItem(storageKey) || 'null'); if (value && Array.isArray(value.bookmarks) && Array.isArray(value.questions)) { saved = {bookmarks:value.bookmarks.filter(x=>typeof x==='string'),questions:value.questions.filter(x=>x && typeof x.id==='string' && typeof x.text==='string' && typeof x.created==='string' && x.source && typeof x.source.subject==='string' && typeof x.source.book==='string' && Number.isInteger(x.source.round) && Number.isInteger(x.source.number)).map(x=>({...x,images:Array.isArray(x.images)?x.images.filter(y=>y && typeof y.data==='string' && /^data:image\/(png|jpeg|webp);base64,/.test(y.data)):[]})),ratings:value.ratings && typeof value.ratings==='object' ? value.ratings : {}}; } } catch {}
  const persist = () => { try {localStorage.setItem(storageKey, JSON.stringify(saved));return true;}catch{toast('브라우저 저장 공간이 부족합니다. 현재 화면에서는 계속 사용할 수 있어요.');return false;} };
  const subjects = ['국어','수학','영어','물리학Ⅱ','사회문화'];
  const books = {국어:['월례고사','서바이벌','상상(FINAL)','엑셀러레이터','서바이벌프로'],수학:['월례고사','서바이벌','서바이벌프로','엑셀러레이터'],영어:['월례고사','서바이벌','엑셀러레이터'],'물리학Ⅱ':['월례고사','서바이벌','서바이벌프로'],사회문화:['월례고사','서바이벌','서바이벌프로']};
  const answers = [
    {id:'korean17-1',subject:'국어',book:'서바이벌',round:17,number:1,name:'김하경',date:'2026.11.02',count:7,question:'국어 모의고사에서 비슷한 유형의 문제를 계속 틀려요. 지문을 다시 읽으면 이해가 되는데, 시험 중에는 선지의 표현을 놓치게 됩니다. 어떻게 복습하면 좋을까요?',answer:'안녕하세요, 김하경 TA입니다.\n\n틀린 문제를 다시 풀 때 정답을 찾는 것과 처음 판단을 점검하는 것을 나누어 보세요. 틀린 선지에서 어떤 단어를 놓쳤는지, 지문의 어떤 부분을 근거로 판단했는지 표시하는 것이 좋습니다.\n\n다시 읽어 이해되는 것에서 그치지 않고, 처음에 떠올렸던 근거와 올바른 근거의 차이를 한 문장으로 남겨 보세요. 비슷한 실수를 찾아 정리하면 다음 시험에서 확인할 기준을 만들 수 있습니다.\n\n작은 표현까지 차분하게 살펴보는 연습을 응원합니다.',tag:'학습 방법',teacher:'김하경 · 국어 TA'},
    {id:'korean17-2',subject:'국어',book:'서바이벌',round:17,number:1,name:'이승민',date:'2026.10.30',count:12,question:'선지를 고를 때 두 개가 남으면 오래 고민합니다. 지문에 있는 표현을 그대로 사용하지 않은 선지는 어떻게 판단해야 하나요?',answer:'안녕하세요. 이승민 TA입니다.\n\n선지의 단어가 지문과 같은지보다, 문장이 말하는 관계가 같은지 확인해 보세요. 주체, 대상, 조건, 범위를 나누어 확인하면 근거를 찾기 쉽습니다.\n\n예를 들어 일부의 사례를 전체의 특성으로 넓힌 것은 아닌지, 가능성을 필연으로 바꾼 것은 아닌지 점검해 주세요.\n\n두 선지가 남았을 때는 각각을 지문의 근거 문장과 직접 연결해 보는 연습을 권합니다.',tag:'선지 판단',teacher:'이승민 · 국어 TA'},
    {id:'korean17-3',subject:'국어',book:'서바이벌',round:17,number:1,name:'여주희',date:'2026.10.28',count:4,question:'문단의 중심 내용을 메모하는 데 시간이 너무 오래 걸립니다. 독서 지문을 읽으면서 어느 정도까지 표시하는 게 좋을까요?',answer:'안녕하세요. 여주희 TA입니다.\n\n표시는 읽은 내용을 전부 옮기는 용도가 아니라, 다시 찾을 위치를 남기는 용도로 사용해 보세요.\n\n정의, 비교 기준, 인과 관계처럼 문제에서 근거로 확인할 부분을 중심으로 간단한 기호만 남겨도 충분합니다. 본인에게 익숙한 표시를 정해 제한된 시간 안에서 반복해 보세요.',tag:'독서',teacher:'여주희 · 국어 TA'},
    {id:'korean8-1',subject:'국어',book:'서바이벌프로',round:8,number:2,name:'이승민',date:'2026.10.14',count:17,question:'실모 국어 비문학 오답 방법이 궁금합니다.\n그냥 다시 읽고 풀어서 오답하고 있는데 다시 읽으면 당연히 잘 읽히고 이렇게 오답하는 게 맞나 싶습니다.',answer:'안녕하세요. 이승민 TA입니다.\n비문학 오답은 크게 두 가지 측면에서 피드백하시는 것을 추천드립니다.\n\n첫 번째는 ‘지문을 읽는 태도’에 대한 피드백입니다. 문제를 왜 틀렸는지, 그리고 지문을 어떻게 읽었다면 틀리지 않을 수 있었는지를 스스로 생각해 보는 과정입니다. A와 B의 차이점을 파악하지 못했다면, 두 대상의 차이점을 확인하고 넘어가겠다는 피드백을 할 수 있습니다.\n\n두 번째는 ‘문제를 푸는 태도’에 대한 피드백입니다. 선지를 읽을 때 자의적인 해석이 들어가지는 않았는지, 보기에 제시된 조건을 놓치지는 않았는지 등을 분석하시면 됩니다.\n\n이런 방법으로 피드백하다 보면 자주 하는 실수나 취약한 영역이 보이고, 그 약점을 보완하면 국어 실력이 향상될 가능성이 높습니다.\n\n추가적인 질문 있으시면 언제든지 남겨주세요!',tag:'문제 해결',teacher:'이승민 · 연세대학교 첨단컴퓨팅학부'},
    {id:'korean8-2',subject:'국어',book:'서바이벌프로',round:8,number:2,name:'김채은',date:'2026.10.23',count:8,question:'비문학을 읽을 때 내용은 알겠는데 문제로 넘어가면 근거가 기억나지 않아요. 지문을 여러 번 돌아보게 됩니다.',answer:'안녕하세요. 김채은 TA입니다.\n\n문단을 읽고 모든 정보를 암기하기보다는, 각 문단이 어떤 역할을 하는지 생각해 보세요. 개념을 소개하는지, 사례로 설명하는지, 두 견해를 비교하는지 정도를 파악하면 됩니다.\n\n문제를 읽고 필요한 정보가 어느 문단에 있는지 찾아갈 수 있으면 충분합니다. 돌아가서 확인하는 과정 자체를 줄이려고 하기보다는, 필요한 위치를 정확히 찾는 데 집중해 주세요.',tag:'독서',teacher:'김채은 · 국어 TA'},
    {id:'math10-1',subject:'수학',book:'월례고사',round:10,number:21,name:'박준영',date:'2026.10.29',count:10,question:'함수의 조건을 식으로 옮기는 부분이 어렵습니다. 그래프로 먼저 해석해도 괜찮을까요?',answer:'안녕하세요. 박준영 TA입니다.\n\n조건이 기울기나 교점에 관한 정보라면 간단한 그래프로 관계를 먼저 확인하는 것이 도움이 됩니다. 다만 그림에서 추측한 성질을 결론으로 사용하려면 주어진 조건과 식으로 다시 확인해 주세요.\n\n조건을 하나씩 옮겨 적고, 각각이 그래프의 어느 특징을 뜻하는지 연결해서 살펴보세요.',tag:'함수',teacher:'박준영 · 수학 TA'},
    {id:'physics17-1',subject:'물리학Ⅱ',book:'서바이벌',round:17,number:9,name:'정유진',date:'2026.11.01',count:6,question:'힘의 방향을 설정할 때 부호가 자꾸 헷갈립니다. 기준 방향은 어떻게 정해야 하나요?',answer:'안녕하세요. 정유진 TA입니다.\n\n기준 방향은 편한 쪽으로 정하되, 식을 세우는 동안 일관되게 유지해 주세요. 먼저 좌표축과 양의 방향을 표시하고, 각 힘을 축에 따라 분해한 뒤 부호를 붙이는 순서로 풀어 보세요.\n\n계산 결과가 음수라면 처음 정한 양의 방향과 반대라는 의미로 해석할 수 있습니다.',tag:'개념 설명',teacher:'정유진 · 과학 TA'}

  function closeDrawer(){ $('#drawer').hidden=true;$('#drawer-shade').hidden=true;$('#drawer-toggle').setAttribute('aria-expanded','false');document.body.classList.remove('body-scroll-lock');}

  const navItems = [['search','search','문항 검색'],['ask','question','문항 질문'],['ta','users','TA Meet'],['sa','calendar','SA Meet'],['mine','book','나의 질문들']];
  function renderNav(){ $('#navigation').innerHTML=navItems.map(([id,ico,label])=>`<button class="nav-item ${state.mode===id?'active':''}" data-action="nav" data-id="${id}">${icon(ico)}${label}</button>`).join(''); }
  function fillSource(){const s=state.source;if(!subjects.includes(s.subject))s.subject=initialSource.subject;if(!books[s.subject].includes(s.book))s.book=books[s.subject][0];if(!s.round)s.round=s.book==='서바이벌'?17:s.book==='월례고사'?10:8;if(!s.number)s.number=1;}
  function go(page){if(reviewPopupOpen)closeModal();if(page==='form')fillSource();state.page=page;state.mode=page==='results'||page==='detail'?'search':page==='form'?'ask':page;state.ranking=false;state.explanation=false;closeDrawer();render();window.scrollTo(0,0);}

  function picker(){const s=state.source;const nums=s.subject==='국어'?45:s.subject==='영어'?45:s.subject==='수학'?30:20;const rounds=contentRounds(s.book);return `${header(state.mode==='ask'?'문항 질문':'문항 검색',{action:state.mode==='search'?reviewButton():''})}<section><div class="subhead"><h2>문항 정보</h2><p class="muted">${state.mode==='ask'?'질문할 문제의 출처를 선택해 주세요.':'문제의 출처를 입력하거나 촬영하여 검색할 수 있습니다.'}</p>${state.mode==='search'?ranks():''}</div><div class="breadcrumb">${crumbs()}</div><div class="picker"><div class="pick-col" aria-label="과목 선택">${state.mode==='search'?`<button class="pick-row camera" data-action="camera">CAMERA ${icon('camera')}</button>`:''}${subjects.map(subject=>`<button class="pick-row ${s.subject===subject?'selected':''}" data-action="subject" data-value="${safe(subject)}">${safe(subject)}</button>`).join('')}</div><div class="pick-col" aria-label="콘텐츠 선택">${books[s.subject].map(book=>`<button class="pick-row ${s.book===book?'selected':''}" data-action="book" data-value="${safe(book)}">${safe(book)}</button>`).join('')}</div><div class="pick-col" id="round-column" aria-label="회차 선택">${s.book?rounds.map(round=>`<button class="pick-row ${s.round===round?'selected':''}" data-action="round" data-value="${round}" ${s.round===round?'id="selected-round"':''}>${round}회</button>`).join(''):'<p class="pick-empty">콘텐츠를 선택해 주세요.</p>'}</div><div class="pick-col" aria-label="문항 번호 선택">${s.round?Array.from({length:nums},(_,i)=>i+1).map(number=>`<button class="pick-row ${s.number===number?'selected':''}" data-action="number" data-value="${number}">${number} <span style="font-size:12px">▤</span></button>`).join(''):'<p class="pick-empty">회차를 선택해 주세요.</p>'}</div></div><div class="picker-bottom"><button class="text-button" data-action="source-help">${state.mode==='ask'?'▸ 학부 콘텐츠':'출처를 찾기 어려우신가요?'}</button><button class="primary" data-action="pick-next" ${s.number?'':'disabled'}>${s.number?(state.mode==='ask'?'질문 작성하기':'답변 검색하기'):'번호를 고르세요'}</button></div></section>`;}
  function questionPresentation(answer){return presentationById[answer.id]||{questionSummary:'질문 내용을 확인해 보세요.',answerSummary:'상세 화면에서 TA의 답변을 확인할 수 있습니다.',tags:[],category:'study'};}

  function reviewCardsMarkup(){return `<div id="review-cards-host">${globalThis.TAReviewCards.render(bookmarkReviewItems())}</div>`;}

  function card(answer,context=false){const marked=saved.bookmarks.includes(answer.id),presentation=questionPresentation(answer);return `<article class="answer-card answer-list-row"><div class="card-top">${context?`<span class="subject">${safe(answer.subject)}</span><span>${safe(answer.book)} ${answer.round}회 ${answer.number}번</span>`:`<span>${safe(answer.name)} TA</span>`}<button class="icon-btn bookmark ${marked?'is-saved':''}" data-action="bookmark" data-id="${answer.id}" aria-label="${marked?'북마크 해제':'북마크 추가'}" aria-pressed="${marked}">${icon('book')}</button><small>${answer.count+(marked?1:0)}</small></div><div class="card-writer"><span class="question-category-label">${presentation.category==='problem'?'문항 풀이·개념':'학습 상담·기타'}</span><time>${answer.date} 등록</time></div><h3 class="question-summary">${safe(presentation.questionSummary)}</h3><div class="question-tags" aria-label="질문 핵심 키워드">${presentation.tags.map(tag=>`<span class="question-tag">#${safe(tag)}</span>`).join('')}</div><div class="answer-snippet"><span class="badge dark">답변 요약</span><span class="preview">${safe(answerSummary(answer))}</span></div><div class="card-actions"><button class="card-open" data-action="answer" data-id="${answer.id}">질문·답변 전문 보기 ↗</button><button class="text-button" data-action="ask-answer" data-id="${answer.id}">이 문항 질문 →</button></div></article>`;}
  function sameSource(a,b){return a.subject===b.subject&&a.book===b.book&&a.round===b.round&&a.number===b.number;}
  const problemPhotoStorageKey='ta-original-problem-photos-v1';

  function photoPanel(source=state.source){const photo=questionPhoto(source);return `<section class="question-photo-panel" aria-label="문항 사진"><div class="question-photo-header"><h2>문항 사진</h2><button type="button" class="outline" data-action="upload-problem-photo" ${problemPhotoBusy?'disabled':''}>${problemPhotoBusy?'사진 등록 중…':photo?'문제 사진 변경':'문제 원문 사진 등록'}</button></div>${photo?`<figure class="question-photo-figure"><div class="question-photo-frame original"><img src="${safe(photo.url)}" alt="${safe(sourceText(source))} 문제 원문"></div><figcaption>${safe(photo.caption)} · 1장</figcaption></figure>`:'<div class="question-photo-empty">'+icon('camera')+'<strong>등록된 문제 원문 사진이 없습니다.</strong><p>문제와 선지가 포함된 원문 사진 한 장을 등록해 주세요.<br>풀이·해설 사진은 질문 이미지에 따로 첨부할 수 있습니다.</p></div>'}</section>`;}
  function otherQuestions(){

  function contentRounds(content){

  function readQuestionDeepLink(search){

    const subject=params.get('subject'),content=params.get('content'),roundText=params.get('round'),numberText=params.get('number'),view=params.get('view')||'question';
    if(!subjects.includes(subject)||!books[subject].includes(content)||!['question','answers'].includes(view)||!/^\d{1,2}$/.test(roundText)||!/^\d{1,2}$/.test(numberText))return null;

  function detail(){const a=answers.find(x=>x.id===state.selectedAnswer);if(!a){state.page='results';return results();}const marked=saved.bookmarks.includes(a.id);const rating=saved.ratings[a.id]||0;return `${header('검색 결과 상세보기',{back:true,action:'<button class="primary" data-action="ask-selected">질문하기 →</button>'})}<div class="section-tools"><h2 class="result-heading">${safe(sourceText(a))} <span class="badge" style="background:#626ebc;color:#fff;border:0">${safe(a.tag)}</span></h2><div class="filter-row"><button class="outline" data-action="report">ⓘ 질문 신고</button><button class="outline" data-action="bookmark" data-id="${a.id}" aria-pressed="${marked}">${marked?'▣ 북마크됨':'♧ 북마크'}</button></div></div>${questionPhoto(a)?photoPanel(a):''}<div class="detail-labels"><button class="active">최초질문</button></div><div class="detail-columns"><section class="detail-box"><div class="detail-meta"><span class="badge">질문</span><span>${a.date} 등록</span></div>${safe(a.question)}</section><section><div class="detail-box"><div class="detail-meta"><span class="badge dark">답변</span><span>${a.date} 등록</span></div>${safe(a.answer)}<div class="teacher-strip"><span>${safe(a.teacher)}</span><span>★ 4.8 / 5 <span class="muted">(예시)</span> ♡ ${a.count}</span></div></div><div class="review"><strong>답변 리뷰</strong>${[1,2,3,4,5].map(n=>`<button data-action="rate" data-value="${n}" class="${rating>=n?'rated':''}" aria-label="${n}점">${rating>=n?'★':'☆'}</button>`).join('')}<span class="muted">${rating?rating+'점으로 평가했어요':'답변이 도움이 되었나요?'}</span></div></section></div>`;}
  function form(){return `${header('문항 질문',{back:true,action:'<button class="primary" type="submit" form="ask-form">질문 등록하기</button>'})}<div class="subhead"><h2>문항 정보</h2><p class="muted">출처가 명확하지 않으면 질문이 취소될 수 있습니다.</p></div><div class="form-source"><div class="breadcrumb">${crumbs()}</div><button class="text-button" data-action="reset-source">⟳ 문항 변경</button></div><form id="ask-form"><p id="form-error" class="form-error" role="alert" hidden></p><div class="question-form"><section>${photoPanel()}<div class="form-block-title"><h2>질문 이미지 등록</h2><small id="image-count">${state.images.length} / 5</small><span class="muted">문항 위에 필기한 뒤 바로 첨부할 수 있습니다.</span></div><button class="upload-area" type="button" data-action="upload"><span class="upload-plus">⊕</span> 이미지 업로드 하기</button><div class="attachment-list" id="attachments">${attachmentHTML()}</div><p class="muted" style="margin-top:14px;font-size:11px">이미지는 최대 5장, 파일당 3MB까지 첨부할 수 있습니다.</p></section><section><div class="form-section"><div class="form-block-title"><h2>질문 내용 입력</h2></div><textarea class="field question-text" id="question-text" name="question" maxlength="1000" required placeholder="문제 1개당 질문 1개로 답변합니다.&#10;여러 문제를 함께 올리면 답변을 받지 못할 수 있어요.&#10;문제 이미지나 풀이 과정이 있는 필기 이미지와 함께 질문 내용을 입력해 보세요.">${safe(state.text)}</textarea><p class="char-count"><span id="char-count">${state.text.length}</span>/1000</p></div><div class="form-section"><div class="form-block-title"><h2>답변 요청 TA 선택</h2></div><div class="choice-grid"><button type="button" class="choice ${state.ta?'':'selected'}" data-action="no-ta">⊘ 원하는 TA가 없어요.</button><button type="button" class="choice ${state.ta?'selected':''}" data-action="choose-ta">${icon('users')} ${state.ta?safe(state.ta):'원하는 TA가 있어요.'}</button></div></div><div class="form-section"><h2>답변 요청 사항</h2><div class="request-options">${['없습니다','문제풀이 설명이 필요해요','개념 설명도 함께 부탁해요','직접입력'].map(request=>`<button type="button" class="request-option ${state.request===request?'selected':''}" data-action="reque   function monthControls(){return `<div class="month-control"><button class="icon-btn" data-action="month" data-value="-1" aria-label="이전 달">‹</button><span>${state.year}년 ${state.month+1}월</span><button class="icon-btn" data-action="month" data-value="1" aria-label="다음 달">›</button></div>`;}
  function mine(){let contents;const tabs=['북마크','문항 질문','TA Meet','SA Meet'];if(state.mineTab==='북마크'){let rows=answers.filter(x=>saved.bookmarks.includes(x.id) && (state.mineSubject==='모든 과목'||x.subject===state.mineSubject));if(state.mineOrder==='인기 답변')rows.sort((a,b)=>b.count-a.count);else rows.sort((a,b)=>b.date.localeCompare(a.date));contents=rows.length?`<div class="mine-heading"><h2>전체 보기</h2></div><div class="result-grid">${rows.map(x=>card(x,true)).join('')}</div>`:empty('북마크한 답변이 없어요!','문항 검색에서 다시 보고 싶은 답변을 북마크해 보세요.');}else if(state.mineTab==='문항 질문'){const monthKey=`${state.year}-${String(state.month+1).padStart(2,'0')}`;const rows=saved.questions.filter(x=>x.created.startsWith(monthKey));contents=`${monthControls()}${rows.length?`<div class="result-grid" style="margin-top:20px">${rows.map(q=>`<article class="answer-card"><div class="card-top"><span class="subject">${safe(q.source.subject)}</span><span>${safe(q.source.book)} ${q.source.round}회 ${q.source.number}번</span></div><div class="card-writer"><strong>나의 질문</strong><time>${safe(q.created.slice(0,10).replace(/-/g,'.'))}</time></div><p class="question-own">${safe(q.text)}</p><p class="muted" style="margin-top:15px">답변 요청: ${safe(q.ta||'지정 없음')}</p><div style="margin-top:15px"><span class="status-tag">로컬 저장 · 답변 대기</span></div><button class="card-open" data-action="own-question" data-id="${q.id}">질문 상세보기 ↗</button></article>`).join('')}</div>`:empty('아직 등록한 질문이 없습니다.','궁금한 문제를 질문하고, 나의 질문들에서 다시 확인해 보세요.')}`;}else{contents=`${monthControls()}${empty('등록된 질문이 없어요!','상담을 신청하면 이곳에서 내역을 확인할 수 있어요.')}`;}return `${header('나의 질문들',{action:reviewButton()+'<button class="outline" data-action="tickets">내 이용권 확인</button>'})}<div class="section-tools"><div class="tabs" role="tablist" aria-label="나의 질문 종류">${tabs.map(tab=>`<button class="tab ${state.mineTab===tab?'active':''}" data-action="mine-tab" data-value="${tab}" role="tab" aria-selected="${state.mineTab===tab}">${tab}</button>`).join('')}</div>${state.mineTab==='북마크'?`<div class="filter-row"><select class="select" id="mine-subject" aria-label="북마크 과목"><option>모든 과목</option>${subjects.map(s=>`<option ${s===state.mineSubject?'selected':''}>${s}</option>`).join('')}</select><select class="select" id="mine-order" aria-label="북마크 정렬">${['최신 답변','인기 답변'].map(v=>`<option ${state.mineOrder===v?'selected':''}>${v}</option>`).join('')}</select></div>`:''}</div>${contents}`;}
  function ta(){return `${header('TA Meet')}<div class="meet-top"><h2>${state.allTA?'전체 TA':'현재 활동 중인 TA'}</h2><div class="meet-filters"><button data-action="all-ta" class="${state.allTA?'active':''}">전체 TA 보기</button><span>|</span><button data-action="interest-ta" class="${state.interested?'active':''}">관심 TA만 보기</button><button class="outline" data-action="ta-schedule">TA 주간 스케줄 보기</button></div></div>${empty(state.interested?'관심 TA가 없습니다.':'현재 상담 가능한 TA가 없습니다.','잠시 후 다시 확인해 주시기 바랍니다.')}<p class="notice-line">원본 사진과 같은 상담 대기 화면입니다. 현재 HTML에서는 실시간 TA 연결을 제공하지 않습니다.</p>`;}
  function weekDates(){const start=new Date(2026,10,2+state.week*7);return Array.from({length:5},(_,i)=>new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));}
  function dateString(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;}
  function sa(){const days=weekDates(),first=days[0],last=days[4];return `${header('SA Meet')}<div class="form-source" style="font-size:14px">신청 현황 (0건) 이용권 잔여 횟수: <strong>0회</strong><button class="text-button" data-action="tickets" style="margin-left:auto">내 이용권 확인</button></div><section class="schedule-frame"><h2>${first.getMonth()+1}월 ${Math.ceil(first.getDate()/7)}주 상담신청</h2><div class="schedule-dates"><button class="icon-btn" data-action="week" data-value="-1" aria-label="이전 주">‹</button><span>${dateString(first)} ~ ${dateString(last)}</span><button class="icon-btn" data-action="week" data-value="1" aria-label="다음 주">›</button></div><div class="schedule-grid">${days.map((d,i)=>`<div><div class="day-name">${['월','화','수','목','금'][i]}<br><span class="${dateString(d)==='2026-11-06'?'today':''}">${d.getDate()}</span></div><div class="time-column">${['15:30','16:20','17:10','19:00','20:00','21:00'].map(t=>`<button class="time-slot" disabled title="이용권이 없어 신청할 수 없습니다">${t}</button>`).join('')}</div></div>`).join('')}</div><p class="schedule-note">원본 화면처럼 잔여 이용권이 0회이므로 상담 시간이 비활성화되어 있습니다.</p></section>`;}
  function render(){renderNav();let content;if(state.page==='search'||state.page==='ask')content=picker();else if(state.page==='results')content=results();else if(state.page==='detail')content=detail();else if(state.page==='form')content=form();else if(state.page==='mine')content=mine();else if(state.page==='ta')content=ta();else content=sa();main.innerHTML=content+footer();const selected=$('#selected-round');if(selected){const col=$('#round-column');col.scrollTop=Math.max(0,selected.offsetTop-col.offsetTop-78);}document.title=`${state.page==='mine'?'나의 질문들':state.page==='ta'?'TA Meet':state.page==='sa'?'SA Meet':state.mode==='ask'?'문항 질문':'문항 검색'} · 시대인재 TA 기능 추가`;}
  function preserveForm(){if($('#question-text'))state.text=$('#question-text').value;if($('#custom-request'))state.customRequest=$('#custom-request').value;}
  function displayError(message){const el=$('#form-error');el.textContent=message;el.hidden=false;el.scrollIntoView({block:'center',behavior:'smooth'});}
  function openTA(){preserveForm();modal('답변을 요청할 TA 선택',`<p>아래 목록은 화면 확인용 예시입니다. 선택한 TA는 질문 기록에 함께 저장됩니다.</p>${[['김하경','국어'],['이승민','국어'],['박준영','수학'],['정유진','과학']].map(([name,subject])=>`<button class="teacher-option" data-action="select-ta" data-value="${name} TA"><span class="teacher-avatar">${name.slice(1)}</span><span><strong>${name} TA</strong><small>${subject} · 예시 프로필</small></span><span class="teacher-pick">선택 →</span></button>`).join('')}`);}
  const actions = {
    menu:toggleDrawer,
    'upload-problem-photo':()=>{if(problemPhotoBusy)return;preserveForm();problemPhotoTarget={...state.source};$('#problem-photo-input').click();},
    nav:el=>{preserveForm();go(el.dataset.id==='ask'?'form':el.dataset.id);},back:()=>{if(state.page==='detail')go('results');else if(state.page==='form')go('ask');else go('search');},
    notifications:()=>modal('알림','<p>새로운 알림이 없습니다.</p><p style="margin-top:12px">질문은 이 브라우저에만 저장되는 예시 화면이며, 실제 답변 알림은 전송되지 않습니다.</p>'),
    'close-modal':closeModal,
    'review-open':openReview,
    subject:el=>{state.source={subject:el.dataset.value,book:null,round:null,number:null};render();},
    book:el=>{state.source.book=el.dataset.value;state.source.round=null;state.source.number=null;render();},
    round:el=>{state.source.round=Number(el.dataset.value);state.source.number=null;render();},
    number:el=>{state.source.number=Number(el.dataset.value);render();},
    'pick-next':()=>{if(state.source.number)go(state.mode==='ask'?'form':'results');},
    ranking:()=>{state.ranking=!state.ranking;render();},
    popular:el=>{const p=popular[Number(el.dataset.index)];state.source={subject:p[0],book:p[1],round:p[2],number:p[3]};go('results');},
    'source-help':()=>modal('문항 정보 선택 안내','<p>과목 → 콘텐츠 → 회차 → 문항 번호 순서로 선택해 주세요.</p><p style="margin-top:12px">예시 답변: 국어 · 서바이벌 · 17회 · 1번, 국어 · 서바이벌프로 · 8회 · 2번, 수학 · 월례고사 · 10회 · 21번.</p>'),
    camera:()=>modal('사진으로 질문하기','<p>이 HTML에서는 자동 문항 인식이 연결되어 있지 않습니다. 문제 출처를 선택한 뒤 질문 작성 화면에서 사진을 첨부할 수 있어요.</p><button class="primary" data-action="camera-continue" style="margin-top:22px">질문할 문항 선택하기</button>'),
    'camera-continue':()=>{$('#modal').close();go('ask');},
    'ask-selected':()=>{preserveForm();go('form');focusQuestion();},
    'focus-question':focusQuestion,
    'question-category':el=>{if(!['problem','study'].includes(el.dataset.category))return;preserveForm();state.questionsCategory=el.dataset.category;render();},
    'ask-answer':el=>{preserveForm();const a=answers.find(x=>x.id===el.dataset.id);if(!a)return;state.source={subject:a.subject,book:a.book,round:a.round,number:a.number};go('form');focusQuestion();},
    answer:el=>{state.selectedAnswer=el.dataset.id;const a=answers.find(x=>x.id===el.dataset.id);state.source={subject:a.subject,book:a.book,round:a.round,number:a.number};go('detail');},
    bookmark:el=>{const id=el.dataset.id;const isSaved=saved.bookmarks.includes(id);saved.bookmarks=isSaved?saved.bookmarks.filter(x=>x!==id):[...saved.bookmarks,id];const stored=persist();render();toast(stored?(isSaved?'북마크를 해제했습니다.':'나의 질문들 → 북마크에 저장했습니다.'):'현재 화면에 반영했지만 저장 공간 문제로 새로고침하면 사라질 수 있어요.');},
    rate:el=>{saved.ratings[state.selectedAnswer]=Number(el.dataset.value);const stored=persist();render();toast(stored?'답변 리뷰를 저장했습니다.':'평가를 반영했지만 저장 공간 문제로 새로고침하면 사라질 수 있어요.');},
    report:()=>modal('질문 신고','<p>이 화면의 질문은 예시 데이터입니다. 실제 서비스와 연결되어 있지 않아 신고가 전송되지 않습니다.</p>'),
    explanation:()=>modal('해설지',`<div class="explanation"><h3>${safe(sourceText())}</h3><p>사진 속 해설지 탭을 재현한 영역입니다. 해당 문항의 실제 해설 원본은 제공되지 않았습니다.</p><p style="margin-top:16px">문항과 선지의 조건을 확인하고, 지문의 근거와 풀이 과정을 비교해 보세요. 이해되지 않는 부분은 질문하기로 남길 수 있습니다.</p></div>`),
    'answer-tab':()=>{},
    'reset-source':()=>{preserveForm();go('ask');},
    upload:()=>$('#image-input').click(),
    'remove-image':el=>{preserveForm();state.images.splice(Number(el.dataset.index),1);render();},
    'no-ta':()=>{preserveForm();state.ta='';render();},'choose-ta':openTA,
    'select-ta':el=>{state.ta=el.dataset.value;$('#modal').close();render();},
    request:el=>{preserveForm();state.request=el.dataset.value;render();},
    'mine-tab':el=>{state.mineTab=el.dataset.value;render();},
    month:el=>{const d=new Date(state.year,state.month+Number(el.dataset.value),1);state.year=d.getFullYear();state.month=d.getMonth();render();},
    'all-ta':()=>{state.allTA=true;state.interested=false;render();},'interest-ta':()=>{state.interested=!state.interested;state.allTA=false;render();},
    'ta-schedule':()=>modal('TA 주간 스케줄','<p>현재 등록된 TA 스케줄이 없습니다.</p><p style="margin-top:12px">실시간 상담 시스템이 연결되면 TA별 상담 시간을 확인할 수 있습니다.</p>'),
    tickets:()=>modal('내 이용권 확인','<p><strong>TA Meet 잔여 이용권: 0회</strong></p><p><strong>SA Meet 잔여 이용권: 0회</strong></p><p style="margin-top:20px">원본 사진의 이용권 상태를 재현한 예시입니다. 결제나 실제 상담 예약은 연결되어 있지 않습니다.</p>'),
    week:el=>{state.week+=Number(el.dataset.value);render();},
    'own-question':el=>{const q=saved.questions.find(x=>x.id===el.dataset.id);if(!q)return;modal('나의 질문',`<p><strong>${safe(sourceText(q.source))}</strong></p><p class="question-own" style="margin-top:18px">${safe(q.text)}</p>${q.images.map(im=>`<img class="inline-image" src="${im.data}" alt="${safe(im.name)}">`).join('')}<p style="margin-top:18px">답변 요청 TA: ${safe(q.ta||'지정 없음')}<br>답변 요청 사항: ${safe(q.request)}<br>상태: 로컬 저장 · 답변 대기</p><button class="outline" data-action="delete-question" data-id="${q.id}" style="margin-top:20px">질문 삭제</button>`);},
    'delete-question':el=>{saved.questions=saved.questions.filter(x=>x.id!==el.dataset.id);const stored=persist();$('#modal').close();render();toast(stored?'질문을 삭제했습니다.':'현재 화면에서 삭제했지만 저장 공간 문제로 새로고침하면 다시 나타날 수 있어요.');}
  };
  document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;if(handleReviewAction(el))return;const action=actions[el.dataset.action];if(action)action(el);});


  $('#drawer-toggle').addEventListener('click',toggleDrawer);$('#drawer-shade').addEventListener('click',closeDrawer);
  document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDrawer();});
  document.addEventListener('input',event=>{if(event.target.id==='question-text'){state.text=event.target.value;$('#char-count').textContent=state.text.length;}if(event.target.id==='custom-request')state.customRequest=event.target.value;});
  document.addEventListener('change',event=>{
if(event.target.id==='mine-subject'){state.mineSubject=event.target.value;render();}if(event.target.id==='mine-order'){state.mineOrder=event.target.value;render();}if(event.target.id==='image-switch'){state.showImages=event.target.checked;render();}});
  document.addEventListener('submit',event=>{if(event.target.id!=='ask-form')return;event.preventDefault();if(imageUploadBusy){displayError('사진을 첨부하고 있습니다. 잠시 후 등록해 주세요.');return;}preserveForm();const text=state.text.trim();if(!text){displayError('질문 내용을 입력해 주세요.');return;}if(!state.source.number){displayError('문항 정보를 먼저 선택해 주세요.');return;}if(state.request==='직접입력'&&!state.customRequest.trim()){displayError('직접입력한 답변 요청 사항을 작성해 주세요.');return;}const now=new Date();const localDate=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}T${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;saved.questions.unshift({id:'q-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),source:{...state.source},text,ta:state.ta,request:state.request==='직접입력'?state.customRequest:state.request,images:[...state.images],created:localDate});const stored=persist();state.text='';state.images=[];state.customRequest='';state.request='없습니다';state.ta='';state.mineTab='문항 질문';state.month=now.getMonth();state.year=now.getFullYear();go('mine');toast(stored?'질문을 이 브라우저에 저장했습니다.':'질문을 임시로 추가했습니다. 저장 공간 부족으로 새로고침하면 사라질 수 있어요.');});
  $('#image-input').addEventListener('change',async event=>{const input=event.target,files=[...input.files];input.value='';if(imageUploadBusy){toast('사진을 첨부하고 있습니다. 잠시 후 다시 선택해 주세요.');return;}preserveForm();if(files.length+state.images.length>5){toast('이미지는 최대 5장까지 첨부할 수 있습니다.');return;}imageUploadBusy=true;for(const file of files){if(!file.type.startsWith('image/')||file.type==='image/svg+xml'){toast('PNG, JPG, WEBP 등 사진 파일을 선택해 주세요.');continue;}if(file.size>3*1024*1024){toast('파일당 3MB 이하의 이미지를 선택해 주세요.');continue;}try{const original=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});const data=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const ratio=Math.min(1,1000/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.8));};img.onerror=reject;img.src=original;});state.images.push({name:file.name,data});}catch{toast('이미지를 읽지 못했습니다. 다른 사진을 선택해 주세요.');}}imageUploadBusy=false;if(state.page==='form')render();});

  $('#problem-photo-input').addEventListener('change',async event=>{
    const input=event.target,file=input.files?.[0],source=problemPhotoTarget?{...problemPhotoTarget}:null;
    input.value='';
    if(!file||!source||!source.number||problemPhotoBusy)return;
    if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024){toast('5MB 이하의 PNG, JPG, WEBP 문제 원문 사진을 선택해 주세요.');return;}
    problemPhotoBusy=true;preserveForm();render();
    try{
      const original=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});
      const data=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{try{const ratio=Math.min(1,1600/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.86));}catch(error){reject(error);}};img.onerror=reject;img.src=original;});
      if(!isProblemPhotoData(data))throw Error('Invalid problem photo');
      problemPhotos[problemSourceKey(source)]={data,name:file.name};
      let stored=true;
      try{localStorage.setItem(problemPhotoStorageKey,JSON.stringify(problemPhotos));}catch{stored=false;}
      toast(stored?'해당 문항의 문제 원문 사진을 등록했습니다.':'현재 화면에는 반영했지만 저장 공간이 부족해 새로고침하면 사라질 수 있어요.');
    }catch{toast('사진을 읽지 못했습니다. 다른 문제 원문 사진을 선택해 주세요.');}
    finally{problemPhotoBusy=false;preserveForm();render();}
  });
  render();
  if(!linkedEntry&&bookmarkReviewItems().length)openReview();
  if(linkedEntry?.view==='answers')$('#other-questions')?.scrollIntoView({block:'start'});
})();
</script>
</body>
</html>
