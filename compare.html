<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기존 · 개선 화면 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--bg:#d9dbe0;--fg:#121722;--sub:#6b7080;--line:#c9ccd3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;overflow:hidden}
a{color:inherit;text-decoration:none}
header{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
header .back{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--sub);flex-shrink:0}
header .back:hover{color:var(--fg)}
header h1{font-size:16px;font-weight:700;margin:0;display:flex;align-items:center;gap:10px;min-width:0}
header h1 img{width:28px;height:28px;border-radius:7px}
header h1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header nav{margin-left:auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
header nav a{font-size:13px;font-weight:600;color:var(--sub);padding:6px 11px;border-radius:999px;white-space:nowrap}
header nav a.on{background:#111;color:#fff}
main{position:absolute;top:52px;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.pane{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.label{display:flex;align-items:center;gap:8px;height:30px;padding:0 4px}
.label b{font-size:13px;font-weight:700;padding:4px 11px;border-radius:999px;background:#fff;color:var(--sub)}
.pane.tobe .label b{background:#111;color:#fff}
.label a{margin-left:auto;font-size:12px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.frame{flex:1;min-height:0;border-radius:14px;overflow:hidden;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.missing{padding:80px 20px;text-align:center;font-size:15px;color:var(--sub)}
@media (max-aspect-ratio:5/4){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
@media (max-width:640px){header nav{display:none}}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html" aria-label="첫 화면으로">‹ 목록</a>
  <h1><img id="icon" src="" alt=""><span id="title"></span></h1>
  <nav id="nav" aria-label="앱 선택"></nav>
</header>
<main id="main"></main>
<script>
(() => {
  'use strict';
  const ASIS = '%EA%B8%B0%EC%A1%B4%20%EC%95%B1%20%ED%99%94%EB%A9%B4/';
  const TOBE = '%EA%B0%9C%EC%84%A0%20%EC%95%B1%20%ED%99%94%EB%A9%B4/';
  const APPS = {
    scheduler: {name: 'SDIJ 스케줄러', icon: 'scheduler', asis: ASIS + 'scheduler_asis.html', tobe: TOBE + 'scheduler_timer_tobe.html'},
    timer: {name: 'SDIJ 타이머', icon: 'timer', asis: ASIS + 'timer_asis.html', tobe: TOBE + 'scheduler_timer_tobe.html?app=timer'},
    drawer: {name: 'SDIJ 콘텐츠 서랍장', icon: 'drawer', asis: ASIS + 'sdij_drawer_asis.html', tobe: TOBE + 'sdij_drawer_tobe.html'},
    ebook: {name: 'SDIJ E-BOOK', icon: 'ebook', asis: ASIS + 'ebook_asis.html', tobe: 'app/EBOOK.html'},
    ta: {name: 'SDIJ TA', icon: 'ta', asis: ASIS + 'ta_asis.html', tobe: 'app/ta/TA.html'},
    n: {name: '시대인재N', icon: 'sdijn', asis: ASIS + 'jaejong_asis.html', tobe: 'app/n/N.html'},
  };
  const key = new URLSearchParams(location.search).get('app');
  const app = APPS[key];
  document.getElementById('nav').innerHTML = Object.entries(APPS)
    .map(([k, a]) => `<a href="?app=${k}" class="${k === key ? 'on' : ''}">${a.name.replace('SDIJ ', '')}</a>`).join('');
  const main = document.getElementById('main');
  if (!app) {
    document.getElementById('title').textContent = '기존 · 개선 화면 비교';
    document.getElementById('icon').remove();
    main.innerHTML = '<div class="missing">위에서 비교할 앱을 골라 주세요.</div>';
    return;
  }
  document.title = `${app.name} · 기존 / 개선 비교`;
  document.getElementById('title').textContent = app.name;
  document.getElementById('icon').src = `icons/${app.icon}.png`;
  const pane = (cls, label, src) => `<section class="pane ${cls}"><div class="label"><b>${label}</b><a href="${src}" target="_blank" rel="noopener">새 창으로 열기</a></div><div class="frame"><iframe src="${src}" title="${app.name} ${label}"></iframe></div></section>`;
  main.innerHTML = pane('asis', '기존 화면', app.asis) + pane('tobe', '개선 화면', app.tobe);
})();
</script>
</body>
</html>
